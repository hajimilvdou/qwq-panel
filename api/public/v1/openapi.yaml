        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ai/providers/fetch-models:
    post:
      operationId: fetchAIProviderModels
      tags: [ai]
      summary: Fetch available model identifiers from an OpenAI or Anthropic compatible endpoint
      description: Queries the endpoint's /models list through the host's outbound egress policy, using either an existing provider_id or unsaved base_url + api_key values. Administrators only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Read-only model discovery probe that may carry an unsaved write-only API key.
      x-qwq-action-exempt: Read-only connectivity and model discovery probe; does not mutate host state.
      requestBody:
        description: Existing provider_id or unsaved base_url/kind/api_key parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiProviderFetchModelsRequest' }
      responses:
        '200':
          description: Discovered model list or sanitized failure category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProviderFetchModelsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ai/providers:
    get:
      operationId: listAIProviders
      tags: [ai]
      summary: List the global AI providers
      description: |
        Every configured provider, ordered by identifier. An administrator sees the full resource
        including `base_url`; every other signed-in principal gets the reduced projection
        (`provider_id`, `name`, `model`, `is_default`, `has_api_key`) — the address of the
        installation's model traffic is an administrator's concern (GAPS 缺口 2). The list is
        bounded and not paginated.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      responses:
        '200':
          description: All providers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProviderList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAIProvider
      tags: [ai]
      summary: Add a global AI provider
      description: |
        Runs `host.ai_providers.create` on the caller; the outcome's `result` of `OperationDone` is
        the created `AiProvider`. Administrator only and human browser session only (ADR-0017): the
        resource decides where the installation sends model traffic, so no AI operator and no
        service account reaches it (the permission is human-only). `is_default` makes the new
        provider the one sessions without their own endpoint use and clears the previous default.
        The API key is not part of the resource; store it with `PUT …/api-key` afterwards.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.ai_providers.create
        summary: Add a global AI provider the installation's sessions may use
        effect: write
        risk: low
        mode: invoke
        idempotent: true
        plannable: true
        ui_route: /settings/ai
        permission: host.ai_providers:create
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The provider to add.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiProviderCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ai/providers/{provider_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderIdPath'
    patch:
      operationId: updateAIProvider
      tags: [ai]
      summary: Change a global AI provider
      description: |
        Runs `host.ai_providers.update` on the provider; the outcome's `result` is the updated
        `AiProvider`. Absent members are left unchanged; `expected_revision` is required
        (`409 REVISION_CONFLICT` when stale). Changing `base_url` removes the stored API key: the
        key is bound to the address it was entered for, so the new address never receives it
        (re-enter the key after moving a provider). Administrator only, human browser session only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.ai_providers.update
        summary: Change a global AI provider's name, address, model or default flag
        effect: write
        risk: low
        mode: invoke
        idempotent: true
        plannable: true
        ui_route: /settings/ai
        permission: host.ai_providers:update
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Members to change, with the expected revision.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiProviderUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAIProvider
      tags: [ai]
      summary: Remove a global AI provider and its API key
      description: |
        Runs `host.ai_providers.delete` on the provider; the stored API key is deleted in the same
        transaction. `expected_revision` is a query parameter because DELETE carries no body. The
        default provider is refused with `409 STATE_CONFLICT` while another provider exists, so a
        delete cannot leave the installation without a usable default by accident. Administrator
        only, human browser session only. Destructive: the operation's approval needs a second
        factor (ADR-0004 D6).
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.ai_providers.delete
        summary: Remove a global AI provider and its stored API key
        effect: destructive
        risk: high
        mode: invoke
        idempotent: true
        plannable: true
        ui_route: /settings/ai
        permission: host.ai_providers:delete
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: expected_revision
          in: query
          required: true
          description: The revision the client last saw; a mismatch returns REVISION_CONFLICT.
          schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ai/providers/{provider_id}/api-key:
    parameters:
      - $ref: '#/components/parameters/ProviderIdPath'
    put:
      operationId: setAIProviderAPIKey
      tags: [ai]
      summary: Store or replace a provider's API key
      description: |
        The key is encrypted as a secret owned by `ai_providers/<provider_id>` with the purpose
        `agent.native.api_key` and is only ever sent as the Authorization header of requests to
        this provider's `base_url`; it is deleted with the provider and when `base_url` changes.
        Catalog-exempt: the plaintext must not reach an operation record or an idempotent replay
        (GAPS 缺口 2); the audit row records the change without the value. Administrator only,
        human browser session only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Storing the same key again leaves the same state, so a retry needs no stored key.
      x-qwq-action-exempt: A credential of an administrator-managed resource; never part of the AI action catalog; audited without the value.
      requestBody:
        description: The API key to store for this provider.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiProviderKeyRequest' }
      responses:
        '204':
          description: The key is stored; the answer never contains it.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: clearAIProviderAPIKey
      tags: [ai]
      summary: Remove a provider's API key
      description: |
        Deletes the provider's stored key; later requests to the provider carry no Authorization
        header. Clearing a provider without a key changes nothing. Catalog-exempt; audited.
        Administrator only, human browser session only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Clearing twice has no further effect.
      x-qwq-action-exempt: A credential of an administrator-managed resource; never part of the AI action catalog; audited without the value.
      responses:
        '204':
          description: The key is removed (or was not there).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ai/providers/{provider_id}/test:
    parameters:
      - $ref: '#/components/parameters/ProviderIdPath'
    post:
      operationId: testAIProvider
      tags: [ai]
      summary: Probe a provider's connectivity
      description: |
        One GET of `{base_url}/models` through the same outbound-controlled client the session
        turns use (AGT-03): a private destination is refused unless `agent.model_egress_allow`
        opens it. The answer only says whether it worked, how long it took and, on failure, the
        class — never the address, the exact status code or the response body. Administrator only,
        human browser session only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: A probe has no side effect; repeating it simply probes again.
      x-qwq-action-exempt: A read-only probe through an administrator-managed provider; it changes nothing and is not an AI action.
      responses:
        '200':
          description: The probe outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProviderTestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- events
  /api/v1/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Subscribe to the event stream (SSE)
      description: |
        Server-sent events (`text/event-stream`). One connection per browser tab; filter with
        `topics`. The handshake checks `Origin` and `Host` against the allow-list.

        Frames (see `StreamFrame`):
        - Domain events have no `event:` line, so they arrive in `EventSource.onmessage`. `id:` is the
          event `sequence`; `data:` is one line of JSON, an `Event` envelope. Delivery is
          at-least-once; deduplicate by `event_id`.
        - `event: ready` is sent first, with the stream head sequence. Open the stream before loading
          snapshots so no change is missed; then, for each `resource.changed` whose `revision` differs
          from the cached one, refetch the `changed_pointers` with `fields`. Events that predate the
          snapshot only cause a redundant refetch.
        - `event: heartbeat` every `sse_heartbeat_seconds` (15 s, always < 30 s). A client that sees no
          frame for 45 s reconnects.
        - `event: resync` when the requested `Last-Event-ID` is older than the retention window, or
          the connection's bounded buffer overflowed. The client must reload the snapshots it shows
          and continue from `head_sequence`. After an overflow resync the server closes the stream.

        Resume with the `Last-Event-ID` header (sent automatically by `EventSource` on reconnect) or the
        `last_event_id` query parameter after a page reload. The server sends `retry:` with the
        reconnect delay; clients add jitter and back off exponentially. Lossy realtime topics (metrics,
        presence) are not replayed. Events are filtered by the subscriber's read permission.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: topics
          in: query
          description: |
            Comma-separated event types or prefixes ending in `.*`, at most `sse_topics_max`.
            Default `resource.changed,operation.updated`.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 16
            uniqueItems: true
            items: { type: string, maxLength: 128, pattern: '^[a-z][a-z0-9_.-]*(\.\*)?$' }
        - name: last_event_id
          in: query
          description: Resume after this sequence. Ignored when the `Last-Event-ID` header is present.
          schema: { $ref: '#/components/schemas/Sequence' }
        - name: Last-Event-ID
          in: header
          description: Standard SSE resume header; the sequence of the last domain event received.
          schema: { $ref: '#/components/schemas/Sequence' }
      responses:
        '200':
          description: The event stream. Each frame's `data` is JSON.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StreamFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- agent tools (ADR-0004 D8)
  /api/v1/agent/find_actions:
    post:
      operationId: agentFindActions
      tags: [agent]
      summary: Search the action catalog
      description: |
        Local keyword search over the action catalog (host OpenAPI `x-qwq-action` + plugin manifest
        operations); no model is called. Returns at most `limit` entries (default 8), each with only
        `id`, `summary`, `effect` and `risk`. Summaries of plugin actions are untrusted.
      security:
        - delegationToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Read-only tool.
      x-qwq-mcp:
        tool: find_actions
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      requestBody:
        description: Tool parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindActionsRequest' }
      responses:
        '200':
          description: Matching actions, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindActionsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent/describe_action:
    post:
      operationId: agentDescribeAction
      tags: [agent]
      summary: Get one action's metadata, argument schema and examples
      description: |
        Loads details on demand. By default returns the metadata, `target` and `args_schema` only;
        `include_result_schema=true` adds `result_schema`, and `include_docs=true` adds the plugin's
        bundled docs (untrusted, may be truncated). Plugin-supplied schemas are untrusted data, not
        instructions.
      security:
        - delegationToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Read-only tool.
      x-qwq-mcp:
        tool: describe_action
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      requestBody:
        description: Tool parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DescribeActionRequest' }
      responses:
        '200':
          description: The action description.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionDescription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent/read:
    post:
      operationId: agentRead
      tags: [agent]
      summary: Read a resource or collection by subject
      description: |
        Reads host-owned subjects (see `Subject`). A single resource returns `values`, a flat map
        from JSON Pointer to value (only the requested `fields`, or the whole resource under `""`).
        A collection returns `items` with cursor pagination. With `since_revision`, unchanged
        resources return `unchanged=true` and collections return only changed items plus
        `deleted_ids`. Responses are capped at `agent_read_items_max` items and
        `agent_read_response_bytes`; when a cap is hit, `truncated` says which and how to continue.
        Plugin-owned subjects return `404 NOT_FOUND` until the plugin read contract exists (P0-T7).
      security:
        - delegationToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Read-only tool.
      x-qwq-mcp:
        tool: read
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      requestBody:
        description: Tool parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '200':
          description: The projected state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent/plan:
    post:
      operationId: agentPlan
      tags: [agent]
      summary: Preview an action without side effects
      description: Same semantics and result as `POST /api/v1/plans`, with a 200 status for tool callers.
      security:
        - delegationToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Side-effect free; a retry only creates another short-lived plan.
      x-qwq-mcp:
        tool: plan
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      x-qwq-limits:
        max_body_bytes: 4194304
      requestBody:
        description: Tool parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent/execute:
    post:
      operationId: agentExecute
      tags: [agent]
      summary: Create an operation from a plan or from action + args
      description: |
        Give either `plan_id`, or `action` + `args` (+ `target`). Giving both, or neither, fails with
        `400 VALIDATION_FAILED`. Always `200` with an `OperationOutcome` (tool callers read `status`,
        not the HTTP code). Policy decides what happens next (ADR-0004 D6): reads run directly,
        `low` runs and notifies, `medium`/`high` stop at `AWAITING_APPROVAL`; then call `wait`.
        If the delegation policy has `on_approval_required=fail`, an action that needs approval fails
        with `403 APPROVAL_REQUIRED` and nothing is created. MCP adapters derive `Idempotency-Key`
        from the tool call so that transport retries are safe; re-executing an already executed plan
        returns `409 STATE_CONFLICT` with its `operation_id`.
      security:
        - delegationToken: []
      x-qwq-idempotency: required
      x-qwq-mcp:
        tool: execute
        annotations: { readOnlyHint: false, destructiveHint: true, idempotentHint: false, openWorldHint: true }
      x-qwq-limits:
        max_body_bytes: 4194304
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Tool parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteRequest' }
      responses:
        '200':
          description: The operation outcome so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent/wait:
    post:
      operationId: agentWait
      tags: [agent]
      summary: Long-poll an operation until it ends or needs approval
      description: |
        Server-side long poll. Returns as soon as the operation is terminal (`SUCCEEDED`, `FAILED`,
        `CANCELED`, `REJECTED`, `EXPIRED`), or enters `AWAITING_APPROVAL` when it was not already
        in that state at call time, or after `timeout_seconds` with `timed_out=true` and the current
        status. Waiting on an operation already in `AWAITING_APPROVAL` therefore waits for the
        decision. At most `agent_concurrent_waits_per_delegation` concurrent waits; beyond that
        `429 RATE_LIMITED`. `timeout_seconds` is capped below common reverse-proxy read timeouts.
      security:
        - delegationToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Read-only tool.
      x-qwq-mcp:
        tool: wait
        annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      requestBody:
        description: Tool parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitRequest' }
      responses:
        '200':
          description: The operation outcome when the wait ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent/cancel:
    post:
      operationId: agentCancel
      tags: [agent]
      summary: Cancel an operation
      description: |
        Same semantics as `POST /api/v1/operations/{operation_id}/cancel`, always `200` with the
        outcome (a running operation shows `cancel_requested=true`). A delegation can cancel only
        operations it created.
      security:
        - delegationToken: []
      x-qwq-idempotency: required
      x-qwq-mcp:
        tool: cancel
        annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Tool parameters.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCancelRequest' }
      responses:
        '200':
          description: The operation outcome after the cancel request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-qwq_session
      description: |
        Browser session (ARCH §4.1.1). Set by login and setup with
        `HttpOnly; Secure; SameSite=Lax; Path=/api/`. The `__Secure-` prefix stops a network attacker
        from planting the cookie over plain HTTP; `Path=/api/` keeps it away from public plugin routes
        under `/p/`. The ID is rotated on login and privilege change; idle and absolute timeouts apply.
        Every non-GET request with this scheme also needs `csrfToken`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Synchronizer token bound to the session, returned in `Session.csrf_token` and kept in memory by
        the Shell (the cookie path `/api/` makes a double-submit cookie unreadable to the page). A
        missing or wrong token returns `403 CSRF_FAILED`. The gateway also rejects cross-site requests
        by `Origin`/`Sec-Fetch-Site`.
    delegationToken:
      type: http
      scheme: bearer
      bearerFormat: qwq delegation token (prefix qwq_dlg_)
      description: |
        Issued by `POST /api/v1/delegations` to an AI operator (ADR-0004 D4). Accepted only on
        `/api/v1/agent/*`; any other route returns `403 PERMISSION_DENIED`. Effective permission =
        owner RBAC ∩ delegation policy ∩ plugin capabilities. Can never decide approvals.
    serviceAccountToken:
      type: http
      scheme: bearer
      bearerFormat: qwq service-account token (prefix qwq_sa_)
      description: |
        Automation credential for the regular REST routes. Never accepted on `/api/v1/agent/*`, on
        approval decisions or on delegation management. General bearer issuance is out of scope
        for this draft. The renewal-bootstrap endpoint creates a restricted account without
        returning its bearer token.
  headers:
    Location:
      description: URL of the created or accepted resource.
      schema: { type: string, format: uri-reference, maxLength: 512 }
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110). Also given as `retry_after` in the body.
      schema: { type: integer, format: int32, minimum: 0, maximum: 86400 }
    IdempotencyReplayed:
      description: '`true` when this response is the stored result of an earlier request with the same key.'
      schema: { type: boolean }
    SetSessionCookie:
      description: '`__Secure-qwq_session=<id>; HttpOnly; Secure; SameSite=Lax; Path=/api/`'
      schema: { type: string }
    ClearSessionCookie:
      description: Expires the session cookie.
      schema: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key (a UUID or ULID is fine), sent as a bare token without quotes.
        Scope: authenticated principal (user, delegation or service account) + HTTP method + concrete
        path. TTL 24 h from first use; at most `idempotency_keys_per_principal` live keys, beyond which
        new keys get `429 RATE_LIMITED` (old keys are never evicted early).
        - Same key, same request fingerprint (SHA-256 of the RFC 8785 canonical JSON body and the
          sorted query string): the stored response is returned with `Idempotency-Replayed: true`.
        - Same key, different fingerprint: `422 IDEMPOTENCY_KEY_REUSED`.
        - Same key while the first request is still being processed: `409 IDEMPOTENCY_IN_PROGRESS`
          (retryable, with `retry_after`).
        Only responses produced after the key was bound are stored (2xx and 4xx from the handler).
        Authentication failures, `429` and `5xx` release the key so the retry is processed afresh.
        A missing key returns `400 VALIDATION_FAILED` with a violation at `/Idempotency-Key`.
      schema: { $ref: '#/components/schemas/IdempotencyKeyValue' }
    IdempotencyKeyConditional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Same semantics as the required form. Required unless the target action has `effect=read` and `mode=invoke`;
        the gateway checks this against the action catalog. Keys sent with synchronous read invokes are ignored
        and not stored.
      schema: { $ref: '#/components/schemas/IdempotencyKeyValue' }
    Fields:
      name: fields
      in: query
      description: |
        Field projection: comma-separated RFC 6901 JSON Pointers relative to the resource (for lists:
        relative to each item), at most `fields_max`. Example: `fields=/name,/status/state`.
        The result keeps the original nesting and contains only the selected members plus the
        identifier and `revision`. Pointers traverse objects only: selecting an array returns it
        whole, and index segments are rejected. Commas inside keys are not supported here (use the
        agent `read` tool). An unknown pointer returns `400 VALIDATION_FAILED` at `/fields`.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 32
        uniqueItems: true
        items: { $ref: '#/components/schemas/JsonPointer' }
    SinceRevision:
      name: since_revision
      in: query
      description: |
        Increment: the `revision` watermark of an earlier list response. The response then has
        `delta=true` and contains only items created or changed since, plus `deleted_ids`. If the
        watermark is older than the change retention, the server returns a full snapshot with
        `delta=false`; the client must then replace its cache.
      schema: { $ref: '#/components/schemas/Revision' }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page. Keep the other query parameters unchanged.
      schema: { $ref: '#/components/schemas/Cursor' }
    Limit:
      name: limit
      in: query
      description: Page size; default `list_limit_default`, at most `list_limit_max`.
      schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }
    ExpectedRevisionQuery:
      name: expected_revision
      in: query
      required: true
      description: The revision the caller last read; a mismatch returns `409 REVISION_CONFLICT`.
      schema: { $ref: '#/components/schemas/Revision' }
    UserIdPath:
      name: user_id
      in: path
      required: true
      description: User identifier.
      schema: { $ref: '#/components/schemas/ResourceId' }
    DelegationIdPath:
      name: delegation_id
      in: path
      required: true
      description: Delegation identifier.
      schema: { $ref: '#/components/schemas/ResourceId' }
    NodeIdPath:
      name: node_id
      in: path
      required: true
      description: Node identifier; `local` in a standalone installation.
      schema: { $ref: '#/components/schemas/NodeId' }
    PluginIdPath:
      name: plugin_id
      in: path
      required: true
      description: Plugin identifier from its manifest.
      schema: { $ref: '#/components/schemas/PluginId' }
    PluginUploadIdPath:
      name: upload_id
      in: path
      required: true
      description: Opaque upload handle returned by `POST /api/v1/plugin-packages`.
      schema: { type: string, minLength: 36, maxLength: 36, pattern: '^upl_[0-9a-f]{32}$' }
    PluginTrustKeyIdPath:
      name: key_id
      in: path
      required: true
      description: Trusted publisher Ed25519 key identifier (`ed25519:<64 lower-case hex>`).
      schema: { type: string, minLength: 72, maxLength: 72, pattern: '^ed25519:[a-f0-9]{64}$' }
    MfaCodeHeader:
      name: X-QWQ-MFA-Code
      in: header
      required: false
      description: Optional TOTP or recovery code satisfying second-factor checks for sensitive host mutations when the current session is not freshly MFA-verified.
      schema: { type: string, minLength: 6, maxLength: 32 }
    InstanceIdPath:
      name: instance_id
      in: path
      required: true
      description: Plugin instance identifier.
      schema: { $ref: '#/components/schemas/InstanceId' }
    OperationNamePath:
      name: operation
      in: path
      required: true
      description: Operation name from the plugin manifest.
      schema: { $ref: '#/components/schemas/OperationName' }
    OperationIdPath:
      name: operation_id
      in: path
      required: true
      description: Operation identifier.
      schema: { $ref: '#/components/schemas/ResourceId' }
    PlanIdPath:
      name: plan_id
      in: path
      required: true
      description: Plan identifier.
      schema: { $ref: '#/components/schemas/ResourceId' }
    ApprovalIdPath:
      name: approval_id
      in: path
      required: true
      description: Approval identifier.
      schema: { $ref: '#/components/schemas/ResourceId' }
    AgentSessionIdPath:
      name: session_id
      in: path
      required: true
      description: Agent session identifier.
      schema: { $ref: '#/components/schemas/ResourceId' }
    ProviderIdPath:
      name: provider_id
      in: path
      required: true
      description: AI provider identifier.
      schema: { $ref: '#/components/schemas/ResourceId' }
  responses:
    OperationDone:
      description: |
        Finished synchronously. `status` is `SUCCEEDED`; `operation_id` is empty only for `effect=read`, `mode=invoke`
        plugin actions, which do not create operation records.
      headers:
        Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OperationOutcome' }
    OperationAccepted:
      description: Accepted; the operation is pending, running or awaiting approval. Follow `Location` or events.
      headers:
        Location: { $ref: '#/components/headers/Location' }
        Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Operation' }
    BadRequest:
      description: '`VALIDATION_FAILED`: malformed JSON, schema or business validation failure, with `violations`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: '`UNAUTHENTICATED`: missing, expired or revoked credentials, or failed login.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`PERMISSION_DENIED`, `CSRF_FAILED`, `MFA_REQUIRED` or `APPROVAL_REQUIRED`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`NOT_FOUND`: no such resource, or the caller may not see it.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        `REVISION_CONFLICT` (with `current_revision`), `PRECONDITION_FAILED` (with
        `failed_preconditions`), `PLAN_EXPIRED`, `STATE_CONFLICT` or `IDEMPOTENCY_IN_PROGRESS`.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: '`PAYLOAD_TOO_LARGE`: body larger than the route limit, or JSON nested deeper than allowed.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: '`IDEMPOTENCY_KEY_REUSED`, or `PLUGIN_ERROR` for a plugin-reported failure without a host mapping.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`RATE_LIMITED`: per-principal, per-IP or per-delegation limit, or idempotency key quota.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: '`UNAVAILABLE`, `NODE_OFFLINE` or `PLUGIN_UNAVAILABLE`; retryable.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InsufficientStorage:
      description: '`INSUFFICIENT_STORAGE`: the staging filesystem lacks room for another package; retryable.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Timeout:
      description: '`TIMEOUT`: the plugin or node did not answer within the operation deadline.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Error:
      description: Any other error (`405`, `415`, `500`, ...). Always a Problem.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    # ------------------------------------------------------------ errors
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details with qwq extension members. `type` is `urn:qwq:problem:<code>`,
        `title` is the fixed English title of the code, `detail` describes this occurrence.
        Never contains stack traces, SQL or file paths.
      required: [type, title, status, code, retryable, request_id]
      properties:
        type: { type: string, format: uri-reference, maxLength: 256, description: 'Problem type URI, derived from `code`.' }
        title: { type: string, maxLength: 120, description: Short fixed title of the code. }
        status: { type: integer, format: int32, minimum: 400, maximum: 599, description: HTTP status code. }
        detail:
          type: string
          maxLength: 2000
          x-qwq-untrusted: true
          description: Human-readable explanation. Untrusted when `code` is `PLUGIN_ERROR` (plugin text).
        instance: { type: string, format: uri-reference, maxLength: 512, description: Request path or operation URL. }
        code: { $ref: '#/components/schemas/ProblemCode' }
        retryable: { type: boolean, description: Whether repeating the same request may succeed. }
        retry_after: { type: integer, format: int32, minimum: 0, maximum: 86400, description: Seconds before a retry; mirrors `Retry-After`. }
        request_id: { type: string, maxLength: 64, description: 'Host-generated request ID, also in the `X-Request-Id` response header.' }
        violations:
          type: array
          maxItems: 100
          description: Field-level problems (`VALIDATION_FAILED`); at most `violations_max`.
          items: { $ref: '#/components/schemas/FieldViolation' }
        violations_truncated: { type: boolean, description: More violations existed than were returned. }
        current_revision: { $ref: '#/components/schemas/Revision' }
        failed_preconditions:
          type: array
          maxItems: 100
          description: '`PRECONDITION_FAILED`: the preconditions that no longer hold.'
          items: { $ref: '#/components/schemas/FailedPrecondition' }
        operation_id: { type: string, maxLength: 64, description: 'The operation this error belongs to, or the existing operation for `STATE_CONFLICT` on plan execution.' }
        node_id: { $ref: '#/components/schemas/NodeId' }
        effective_risk: { $ref: '#/components/schemas/RiskLevel' }
        limit:
          type: object
          description: '`PAYLOAD_TOO_LARGE` and `RATE_LIMITED`: which limit was hit.'
          required: [name, max]
          properties:
            name: { type: string, maxLength: 64, description: 'Limit name from `x-qwq-limits`, e.g. `max_body_bytes`.' }
            max: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: The configured maximum. }
        dependents:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/PluginId' }
          description: With `STATE_CONFLICT` on a removal, the plugins that still require it.
        plugin_code:
          type: string
          maxLength: 64
          x-qwq-untrusted: true
          description: '`PLUGIN_ERROR`: the machine-readable code reported by the plugin.'
    ProblemCode:
      type: string
      x-qwq-extensible-enum: true
      description: |
        Machine-readable error code. New codes may be added without a breaking change; clients treat an
        unknown code like its HTTP status class. Mapping:

        | code | HTTP | retryable | meaning |
        |---|---|---|---|
        | `VALIDATION_FAILED` | 400 | no | Malformed request or invalid arguments; see `violations` |
        | `UNAUTHENTICATED` | 401 | no | Missing/expired credentials, failed login or setup token |
        | `MFA_REQUIRED` | 403 | no | Destructive approval or enrollment link without a fresh second factor |
        | `CSRF_FAILED` | 403 | no | Missing or wrong CSRF token, or cross-site request |
        | `PERMISSION_DENIED` | 403 | no | RBAC, delegation policy or credential type not allowed |
        | `APPROVAL_REQUIRED` | 403 | no | Needs approval and the policy says `on_approval_required=fail` |
        | `NOT_FOUND` | 404 | no | No such resource or route, or not visible to the caller |
        | `METHOD_NOT_ALLOWED` | 405 | no | Route exists, method does not |
        | `REVISION_CONFLICT` | 409 | no | `expected_revision` differs; see `current_revision` |
        | `PRECONDITION_FAILED` | 409 | no | A plan precondition no longer holds; plan again |
        | `PLAN_EXPIRED` | 409 | no | The plan passed `expires_at`; plan again |
        | `STATE_CONFLICT` | 409 | no | Not allowed in the resource's current state |
        | `IDEMPOTENCY_IN_PROGRESS` | 409 | yes | Same key still processing; retry after `retry_after` |
        | `PAYLOAD_TOO_LARGE` | 413 | no | Body size or JSON depth limit; see `limit` |
        | `UNSUPPORTED_MEDIA_TYPE` | 415 | no | Body is not `application/json` |
        | `IDEMPOTENCY_KEY_REUSED` | 422 | no | Same key with a different request fingerprint |
        | `PLUGIN_ERROR` | 422 | per plugin | Plugin-reported failure; see `plugin_code` |
        | `RATE_LIMITED` | 429 | yes | Rate or quota limit; retry after `retry_after` |
        | `INTERNAL` | 500 | yes | Unexpected host error; details only in logs under `request_id` |
        | `UNAVAILABLE` | 503 | yes | Host not ready (startup, upgrade, maintenance) |
        | `INSUFFICIENT_STORAGE` | 507 | yes | Not enough free disk space for a plugin package; retry after cleanup or an expiry |
        | `NODE_OFFLINE` | 503 | yes | Target node's agent is disconnected; see `node_id` |
        | `PLUGIN_UNAVAILABLE` | 503 | yes | Plugin not running, cold-starting or quarantined |
        | `TIMEOUT` | 504 | yes | Plugin or node missed the operation deadline |

        Plugin errors whose code matches a host code (`VALIDATION_FAILED`, `PRECONDITION_FAILED`,
        `REVISION_CONFLICT`) are passed through with that code; all others become `PLUGIN_ERROR`.
        `INTERNAL` is retryable only together with the same `Idempotency-Key`.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - MFA_REQUIRED
        - CSRF_FAILED
        - PERMISSION_DENIED
        - APPROVAL_REQUIRED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - REVISION_CONFLICT
        - PRECONDITION_FAILED
        - PLAN_EXPIRED
        - STATE_CONFLICT
        - IDEMPOTENCY_IN_PROGRESS
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - IDEMPOTENCY_KEY_REUSED
        - PLUGIN_ERROR
        - RATE_LIMITED
        - INTERNAL
        - UNAVAILABLE
        - INSUFFICIENT_STORAGE
        - NODE_OFFLINE
        - PLUGIN_UNAVAILABLE
        - TIMEOUT
    FieldViolation:
      type: object
      description: |
        One field-level problem; same shape as proto `FieldViolation`. Also used for warnings.
        For body fields `pointer` is an RFC 6901 JSON Pointer into the request body; for parameters it
        is `/<parameter name>` and `in` names the location.
      required: [pointer, code, message]
      properties:
        in:
          type: string
          enum: [body, query, header, path]
          default: body
          description: Where the offending value is.
        pointer: { $ref: '#/components/schemas/JsonPointer' }
        code: { type: string, maxLength: 64, pattern: '^[A-Z][A-Z0-9_]*$', description: 'Machine-readable reason, e.g. `REQUIRED`, `PORT_IN_USE`.' }
        message:
          type: string
          maxLength: 500
          x-qwq-untrusted: true
          description: Human-readable message; untrusted when produced by a plugin.
    Precondition:
      type: object
      description: Optimistic concurrency guard captured by a plan; same shape as proto `Precondition`.
      required: [subject, revision]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        revision: { $ref: '#/components/schemas/Revision' }
    FailedPrecondition:
      type: object
      description: A precondition that did not hold at execution time.
      required: [subject, expected_revision]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        expected_revision: { $ref: '#/components/schemas/Revision' }
        current_revision:
          description: Current revision; null when the resource no longer exists.
          oneOf:
            - { $ref: '#/components/schemas/Revision' }
            - { type: 'null' }
    # ------------------------------------------------------------ primitives
    Revision:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._~-]+$'
      description: |
        Opaque resource version. Changes on every committed modification. Compare for equality only;
        do not parse, order or do arithmetic on it. On collections it is a watermark for `since_revision`.
      examples: ['42']
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
      description: Opaque pagination cursor.
    JsonPointer:
      type: string
      maxLength: 256
      pattern: '^(/([^/~]|~[01])*)*$'
      description: RFC 6901 JSON Pointer; `""` is the whole document.
      examples: ['/inbounds/0/port']
    ResourceId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque host-assigned identifier.
    NodeId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
      description: Node identifier; a standalone installation has the single node `local`.
      examples: [local]
    PluginId:
      type: string
      maxLength: 128
      pattern: '^[a-z][a-z0-9]*([.-][a-z0-9]+)*$'
      description: Plugin identifier; same pattern as the manifest `id`.
      examples: [com.example.monitor]
    InstanceId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$'
      description: Plugin instance identifier, unique per node and plugin. The first instance is `default`.
      examples: [default]
    OperationName:
      type: string
      maxLength: 64
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
      description: Operation name; same pattern as the manifest `operations[].name`.
      examples: [scan.run]
    ActionId:
      type: string
      maxLength: 200
      pattern: '^(host\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+|[a-z][a-z0-9]*([.-][a-z0-9]+)*/[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*)$'
      description: |
        Catalog identifier. Host actions: `host.<resource>.<verb>` (from `x-qwq-action.id`). Plugin
        actions: `<plugin_id>/<operation>`. The `/` cannot occur in host IDs, so the two never collide.
      examples: [host.users.create, com.example.monitor/scan.run]
    Subject:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^[a-z][a-z0-9_-]*(/[A-Za-z0-9._~:@-]+)*$'
      description: |
        Canonical resource name used in events, preconditions and the agent `read` tool: the resource
        path relative to `/api/v1/`. Host-owned: `users/<id>`, `nodes/<id>`, `plugins/<id>`,
        `operations/<id>`, `approvals/<id>`, `delegations/<id>`, and the collections `users`, `nodes`,
        `plugins`, `operations`, `approvals`. Plugin-owned (the host prefixes what the plugin reports):
        `nodes/<node_id>/plugins/<plugin_id>/instances/<instance_id>/resources/<path>` for node
        placement and `plugins/<plugin_id>/resources/<path>` for controller placement.
      examples: [users/u_01J9Z3, nodes/local/plugins/com.example.monitor/instances/default/resources/alerts/cpu]
    Sequence:
      type: string
      maxLength: 20
      pattern: '^[0-9]+$'
      description: Event journal sequence (uint64 as a decimal string, so JavaScript keeps full precision).
    IdempotencyKeyValue:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9_.:-]+$'
      description: Idempotency key token.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.
    RiskLevel:
      type: string
      enum: [low, medium, high]
      description: Risk level (ADR-0004 D6).
    Effect:
      type: string
      enum: [read, write, destructive]
      description: What an action does to state (ADR-0004 D5).
    Mode:
      type: string
      enum: [invoke, job]
      description: '`invoke` answers synchronously; `job` is long-running and returns 202.'
    ApprovalLevel:
      type: string
      enum: [auto, confirm, ai_confirm]
      description: |
        When the host asks the user before running an operation (ADR-0010 §2). `auto`: only the host
        hard rules ask; `confirm`: every call asks; `ai_confirm`: calls from an `ai_agent` (a
        delegation) ask, people and service accounts do not. A plugin operation without a
        declaration derives it from its effect: read → `auto`, write and destructive → `confirm`.
        A destructive effect and an effective risk of `high` always ask (a host hard rule), except
        that a `full` permission mode drops the risk rule.
    PermissionMode:
      type: string
      enum: [read_only, safe, full, custom]
      description: |
        User-selected permission mode of an agent session or a delegation (ADR-0010 §2.1); safe by
        default. It is a ceiling: `read_only` refuses every write operation without queueing an
        approval; `safe` asks for `confirm`, `ai_confirm`, destructive and high-risk operations;
        `full` skips the plugin-level approvals and the high-risk rule but still asks for an
        irreversible destructive operation; `custom` keeps the level-based rule and will grow
        per-item overrides. An AI client can never change the mode: it comes from the session or
        delegation record, never from a request body.
    # ------------------------------------------------------------ actor, target, action metadata
    ActorKind:
      type: string
      enum: [human, ai_agent, service, system]
      description: Operator type (ADR-0004 D4); proto `ActorKind` without the `ACTOR_KIND_` prefix.
    Actor:
      type: object
      description: |
        Who caused a change; set by the host, mirrors proto `Actor`. `id` is a user ID (`human`),
        a delegation ID (`ai_agent`), a service-account ID (`service`) or a host component name
        (`system`, e.g. `reconciler`). `on_behalf_of` is the user whose authority is used, for
        `ai_agent` and `service`.
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/ActorKind' }
        id: { type: string, maxLength: 64, description: Actor identifier. }
        on_behalf_of: { type: string, maxLength: 64, description: User ID of the delegating human. }
        display_name: { type: string, maxLength: 64, description: 'Host-known display name, e.g. "AI (on behalf of alice)".' }
    Target:
      type: object
      description: |
        Where an action runs. Host actions use only `subject`. Node-placed plugin actions need
        `node_id`, `plugin_id` and `instance_id`; controller-placed ones need `plugin_id`.
        `subject` names the resource being changed, when there is one.
      properties:
        node_id: { $ref: '#/components/schemas/NodeId' }
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        subject: { $ref: '#/components/schemas/Subject' }
    TargetInput:
      type: object
      additionalProperties: false
      description: '`Target` as accepted in requests.'
      properties:
        node_id: { $ref: '#/components/schemas/NodeId' }
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        subject: { $ref: '#/components/schemas/Subject' }
    ActionMeta:
      type: object
      description: |
        Catalog metadata of an action; the same fields as a plugin manifest operation (ADR-0004 D5) and
        as the `x-qwq-action` extension on host routes. `risk` here is the effective risk
        (declared risk raised to the capability floor); `declared_risk` is what the author declared.
      required: [id, summary, effect, risk, mode, idempotent, plannable, source]
      properties:
        id: { $ref: '#/components/schemas/ActionId' }
        summary: { type: string, minLength: 1, maxLength: 120, x-qwq-untrusted: true, description: One-line summary; untrusted for plugin actions. }
        effect: { $ref: '#/components/schemas/Effect' }
        risk: { $ref: '#/components/schemas/RiskLevel' }
        declared_risk: { $ref: '#/components/schemas/RiskLevel' }
        mode: { $ref: '#/components/schemas/Mode' }
        idempotent: { type: boolean, description: Repeating the action with the same arguments has no further effect. }
        plannable: { type: boolean, description: The action implements a structured preview (`PlanOperation`). }
        undo: { $ref: '#/components/schemas/ActionId' }
        ui_route: { type: string, maxLength: 128, pattern: '^/[a-z0-9._/:-]*$', description: Shell route for follow mode. }
        permission: { type: string, maxLength: 128, description: 'RBAC permission, e.g. `host.users:create`.' }
        timeout_ms: { type: integer, format: int32, minimum: 1, maximum: 300000, description: Execution deadline. }
        source: { type: string, enum: [host, plugin], description: Whether the action is defined by the host or a plugin. }
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        placement: { type: string, enum: [node, controller], description: Plugin placement; absent for host actions. }
        approval: { $ref: '#/components/schemas/ApprovalLevel' }
        approval_summary:
          type: string
          minLength: 1
          maxLength: 200
          x-qwq-untrusted: true
          description: Confirmation-card title written by the plugin author; absent for host actions.
        approval_description:
          type: string
          minLength: 1
          maxLength: 2000
          x-qwq-untrusted: true
          description: Expandable confirmation text written by the plugin author (Markdown, plain text only); absent for host actions.
        reachability:
          type: boolean
          description: |
            The action can cut the administrator off from the server or the panel (firewall, SSH,
            panel listener or TLS; ADR-0016). The host clamps such an action to risk `high` and
            approval at least `ai_confirm` when the manifest is loaded, forces the flag from the
            capabilities the action may use, and shows a lockout warning before it runs.
    ActionSummary:
      type: object
      description: Compact catalog entry returned by `find_actions`.
      required: [id, summary, effect, risk]
      properties:
        id: { $ref: '#/components/schemas/ActionId' }
        summary: { type: string, maxLength: 120, x-qwq-untrusted: true, description: One-line summary; untrusted for plugin actions. }
        effect: { $ref: '#/components/schemas/Effect' }
        risk: { $ref: '#/components/schemas/RiskLevel' }
    ActionList:
      type: object
      additionalProperties: false
      description: |
        One page of the catalog as the signed-in person may use it. Actions their role does not grant
        are absent, and `truncated` says more matches exist than this page shows.
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ActionMeta' }
        truncated: { type: boolean, description: More matches exist than this page shows. }
    ActionDetail:
      description: '`ActionMeta` plus the argument schema, which a list page leaves out.'
      allOf:
        - $ref: '#/components/schemas/ActionMeta'
        - type: object
          required: [request_schema]
          properties:
            request_schema: { type: object, x-qwq-untrusted: true, description: 'JSON Schema of the request payload; for a plugin action it comes from the package.' }
    # ------------------------------------------------------------ audit (GAPS gap 7)
    AuditOutcome:
      type: string
      enum: [success, failure, denied]
      description: Result of the audited event.
    AuditEntry:
      type: object
      description: |
        One audit row. `detail` has passed a redaction whitelist: only reviewed non-secret members
        are returned, never a token, password, key or secret reference, and never a nested object.
      required: [audit_id, at, actor, action, subject, outcome]
      properties:
        audit_id: { $ref: '#/components/schemas/ResourceId' }
        at: { $ref: '#/components/schemas/Timestamp' }
        actor: { $ref: '#/components/schemas/Actor' }
        action: { type: string, maxLength: 128, description: 'Stable dotted name, e.g. `host.users.create` or `auth.login`.' }
        subject: { type: string, maxLength: 512, description: Resource subject; empty for authentication events. }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        node_id: { $ref: '#/components/schemas/NodeId' }
        request_id: { type: string, maxLength: 64, description: Gateway request identifier of the event. }
        detail: { type: object, x-qwq-untrusted: true, description: Whitelisted non-secret facts; absent when nothing passed the whitelist. }
    AuditPage:
      type: object
      additionalProperties: false
      description: |
        One page of the audit log, newest first. The pagination members live under `meta`: audit rows
        carry no revision, so this is not a revisioned collection and `since_revision` does not apply.
      required: [items, meta]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AuditEntry' } }
        meta:
          type: object
          additionalProperties: false
          description: Pagination of the audit log.
          properties:
            next_cursor: { $ref: '#/components/schemas/Cursor' }
    # ------------------------------------------------------------ operations
    OperationStatus:
      type: string
      description: |
        ADR-0004 D7 state machine:

        ```text
        PENDING ─▶ AWAITING_APPROVAL ─▶ APPROVED ─▶ RUNNING ─▶ SUCCEEDED / FAILED / CANCELED
                       ├─▶ REJECTED
                       └─▶ EXPIRED      (approval not decided within approval_ttl_seconds)
        PENDING ─▶ RUNNING              (no approval needed)
        PENDING / AWAITING_APPROVAL / APPROVED ─▶ CANCELED   (cancel before start)
        PENDING / APPROVED ─▶ FAILED                         (e.g. PRECONDITION_FAILED before start)
        ```

        Terminal: `SUCCEEDED`, `FAILED`, `CANCELED`, `REJECTED`, `EXPIRED`.
      enum: [PENDING, AWAITING_APPROVAL, APPROVED, REJECTED, EXPIRED, RUNNING, SUCCEEDED, FAILED, CANCELED]
    OperationProgress:
      type: object
      description: Latest progress report of a job; mirrors proto `JobProgress`.
      properties:
        percent: { type: integer, format: int32, minimum: 0, maximum: 100, description: Completion estimate. }
        step: { type: string, maxLength: 64, pattern: '^[a-z0-9_.-]*$', description: 'Machine-readable step ID, used by follow mode.' }
        message:
          type: string
          maxLength: 500
          x-qwq-untrusted: true
          description: Progress text from the plugin or node. Untrusted; render as plain text.
    Operation:
      type: object
      description: |
        The unified record of a state change (ARCH §7). `operation_id + attempt` identifies one
        execution; non-idempotent operations are never retried automatically.
      required: [operation_id, action, status, target, actor, effective_risk, attempt, created_at, updated_at, revision]
      properties:
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        action: { $ref: '#/components/schemas/ActionId' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        target: { $ref: '#/components/schemas/Target' }
        actor: { $ref: '#/components/schemas/Actor' }
        effective_risk: { $ref: '#/components/schemas/RiskLevel' }
        plan_id: { $ref: '#/components/schemas/ResourceId' }
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        attempt: { type: integer, format: int32, minimum: 1, maximum: 1000, description: 'Execution attempt, starting at 1.' }
        cancel_requested: { type: boolean, description: A cancel was requested while running. }
        progress: { $ref: '#/components/schemas/OperationProgress' }
        result:
          x-qwq-untrusted: true
          description: |
            Result payload when `SUCCEEDED`; follows the action's response schema. Untrusted for plugin
            actions. Secret fields are replaced by references. Only the actor that started the operation
            and callers that hold the permission of its action see it; other readers get the operation
            without `result`.
        error: { $ref: '#/components/schemas/Problem' }
        ui_route: { type: string, maxLength: 128, description: 'Shell route of the action, for follow mode.' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    OperationOutcome:
      type: object
      description: |
        Compact view of an operation for synchronous answers and agent tools: only what a caller needs
        to decide its next step. `operation_id` is empty for synchronous `effect=read`, `mode=invoke` plugin actions (no record).
      required: [operation_id, action, status]
      properties:
        operation_id: { type: string, maxLength: 64, description: Operation identifier; empty only for synchronous read invokes. }
        action: { $ref: '#/components/schemas/ActionId' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        effective_risk: { $ref: '#/components/schemas/RiskLevel' }
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        cancel_requested: { type: boolean, description: A cancel was requested while running. }
        progress: { $ref: '#/components/schemas/OperationProgress' }
        result:
          x-qwq-untrusted: true
          description: Result payload when `SUCCEEDED`. Untrusted for plugin actions.
        error: { $ref: '#/components/schemas/Problem' }
        timed_out: { type: boolean, description: '`wait` only: the timeout elapsed before a state worth reporting.' }
        revision: { $ref: '#/components/schemas/Revision' }
    CancelRequest:
      type: object
      additionalProperties: false
      description: Optional cancel details.
      properties:
        reason: { type: string, maxLength: 500, description: Recorded in the audit log. }
    # ------------------------------------------------------------ lists
    ListMeta:
      type: object
      description: |
        Pagination and increment metadata shared by list responses. `revision` is the collection
        watermark to pass as `since_revision` next time; on multi-page reads it is fixed by the first
        page, so use the value from the last page. `next_cursor` is absent on the last page.
      required: [revision, delta]
      properties:
        next_cursor: { $ref: '#/components/schemas/Cursor' }
        revision: { $ref: '#/components/schemas/Revision' }
        delta: { type: boolean, description: '`true`: only changes since `since_revision`; `false`: a full snapshot.' }
        deleted_ids:
          type: array
          maxItems: 1000
          description: With `delta=true`, IDs removed since `since_revision`.
          items: { type: string, maxLength: 128 }
    OperationList:
      description: A page of operations.
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Operation' }, description: Operations. }
    # ------------------------------------------------------------ plans
    PlanRequest:
      type: object
      additionalProperties: false
      description: |
        What to preview. For host actions, `args` holds the route's path parameters and body members
        flattened into one object (including `expected_revision`); for plugin actions it is the
        operation payload. `expected_revision` + `target.subject` add a precondition on that subject.
      required: [action, args]
      properties:
        action: { $ref: '#/components/schemas/ActionId' }
        args: { type: object, description: 'Action arguments, validated against the action''s schema.' }
        target: { $ref: '#/components/schemas/TargetInput' }
        expected_revision: { $ref: '#/components/schemas/Revision' }
    PlannedChange:
      type: object
      description: |
        One change a plan would make; mirrors proto `PlannedChange`. `source=plugin` entries come from
        the plugin's `PlanOperation` and are untrusted previews; `source=host` entries are computed by
        the host. Secret values appear only as references.
      required: [kind, subject, source]
      properties:
        kind: { type: string, enum: [create, update, delete], description: Change kind. }
        subject: { $ref: '#/components/schemas/Subject' }
        pointer: { $ref: '#/components/schemas/JsonPointer' }
        before: { x-qwq-untrusted: true, description: Value before the change (absent for create). }
        after: { x-qwq-untrusted: true, description: Value after the change (absent for delete). }
        reversible: { type: boolean, description: The author claims this change can be undone. }
        source: { type: string, enum: [host, plugin], description: Who produced this entry. }
        plugin_id: { $ref: '#/components/schemas/PluginId' }
    Plan:
      type: object
      description: |
        Side-effect free preview bound to a later execution (ADR-0004 D7). `args_digest` is the SHA-256
        of the RFC 8785 canonical arguments; execution uses exactly these arguments.
      required: [plan_id, action, target, args_digest, changes, violations, warnings, preconditions, effective_risk, requires_approval, executable, plannable, created_at, expires_at]
      properties:
        plan_id: { $ref: '#/components/schemas/ResourceId' }
        action: { $ref: '#/components/schemas/ActionId' }
        target: { $ref: '#/components/schemas/Target' }
        args: { type: object, description: 'Public arguments with sensitive values and internal references redacted. An opaque argument object is represented by {"$redacted":true}.' }
        args_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Digest of the canonical arguments. }
        plannable: { type: boolean, description: '`false`: the action has no structured preview and `changes` is empty.' }
        changes: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlannedChange' }, description: Previewed changes. }
        changes_truncated: { type: boolean, description: More changes existed than were returned. }
        violations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FieldViolation' }, description: Blocking problems; any entry makes `executable=false`. }
        warnings: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FieldViolation' }, description: Non-blocking problems. }
        preconditions: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Precondition' }, description: Revisions that must still hold at execution. }
        effective_risk: { $ref: '#/components/schemas/RiskLevel' }
        requires_approval: { type: boolean, description: Executing this plan as the current caller will stop at `AWAITING_APPROVAL`. }
        requires_mfa: { type: boolean, description: The approval will require a second factor. }
        executable: { type: boolean, description: No blocking violations. }
        operation_id: { type: string, maxLength: 64, description: Set once the plan was executed. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    # ------------------------------------------------------------ approvals
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELED]
      description: '`CANCELED`: the operation was canceled while waiting.'
    ApprovalFacts:
      type: object
      description: |
        What the host itself knows about the operation, rendered first on the confirmation card
        (ADR-0004 D6). Nothing here is written by the requesting AI, and the only plugin-authored
        members are the catalog `summary` and the `approval_summary`/`approval_description` text of
        ADR-0010, all marked untrusted. `permission_mode` says which mode the calling session or
        delegation ran with, so the approver can see why the decision was asked for.
      required: [action, args, target, required_capabilities, effective_risk, declared_risk, effect, reversible, requested_by]
      properties:
        action: { $ref: '#/components/schemas/ActionMeta' }
        args: { type: object, description: 'Public execution arguments with sensitive values and internal references redacted. An opaque argument object is represented by {"$redacted":true}.' }
        args_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Digest of the canonical arguments. }
        target: { $ref: '#/components/schemas/Target' }
        node_name: { type: string, maxLength: 64, description: Host-known display name of the target node. }
        required_capabilities:
          type: array
          maxItems: 64
          description: Capabilities the action uses (name + scope), which determine the risk floor.
          items:
            type: object
            required: [name, scope]
            properties:
              name: { type: string, maxLength: 64, description: Capability name. }
              scope: { type: string, maxLength: 128, description: Capability scope. }
        effect: { $ref: '#/components/schemas/Effect' }
        declared_risk: { $ref: '#/components/schemas/RiskLevel' }
        effective_risk: { $ref: '#/components/schemas/RiskLevel' }
        reversible: { type: boolean, description: An `undo` action exists for this action. }
        undo: { $ref: '#/components/schemas/ActionId' }
        requested_by: { $ref: '#/components/schemas/Actor' }
        approval_summary:
          type: string
          minLength: 1
          maxLength: 200
          x-qwq-untrusted: true
          description: 'The plugin author''s confirmation-card title, shown as "from plugin"; absent for host actions.'
        approval_description:
          type: string
          minLength: 1
          maxLength: 2000
          x-qwq-untrusted: true
          description: 'The plugin author''s explanation behind "show details"; Markdown rendered as plain text; absent for host actions.'
        permission_mode: { $ref: '#/components/schemas/PermissionMode' }
    Approval:
      type: object
      description: A request for a human decision on one operation.
      required: [approval_id, operation_id, status, facts, requires_mfa, created_at, expires_at, revision]
      properties:
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        plan_id: { $ref: '#/components/schemas/ResourceId' }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        facts: { $ref: '#/components/schemas/ApprovalFacts' }
        plugin_preview:
          type: object
          x-qwq-untrusted: true
          description: The plan's changes and warnings as reported by the plugin; shown as "from plugin".
          properties:
            changes: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlannedChange' }, description: Previewed changes. }
            warnings: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FieldViolation' }, description: Warnings. }
        requires_mfa: { type: boolean, description: Deciding requires `mfa_code` (destructive actions). }
        decided_by: { $ref: '#/components/schemas/Actor' }
        decided_at: { $ref: '#/components/schemas/Timestamp' }
        comment: { type: string, maxLength: 500, description: The approver's comment. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    ApprovalList:
      description: A page of approvals.
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Approval' }, description: Approvals. }
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      description: The decision.
      required: [decision, expected_revision]
      properties:
        decision: { type: string, enum: [approve, reject], description: Approve or reject. }
        expected_revision: { $ref: '#/components/schemas/Revision' }
        comment: { type: string, maxLength: 500, description: 'Optional comment, recorded in the audit log.' }
        mfa_code: { type: string, maxLength: 6, pattern: '^[0-9]{6}$', writeOnly: true, description: Current TOTP code; required when `requires_mfa`. }
    # ------------------------------------------------------------ agent sessions
    AgentSessionStatus:
      type: string
      enum: [idle, running, waiting_approval, cancelled, failed, attention]
      description: |
        Session lifecycle (design §2). `idle`: no turn is running; `running`: one turn is running;
        `waiting_approval`: the turn paused on a human decision; `cancelled` and `failed`: the last
        turn ended that way, and a new message may start another one. `attention` is only valid as
        the `status` list filter: it selects `waiting_approval` and `failed` for the floating window.
    AgentCore:
      type: string
      enum: [native, claude-code, codex, opencode, dsh, acp]
      description: |
        The replaceable core of a session. `native` is the host's built-in OpenAI-compatible core;
        the external CLI/ACP cores (`claude-code`, `codex`, `opencode`, `dsh`, `acp`) answer
        `503 UNAVAILABLE` on send when their backing CLI binary is unavailable on the host (ADR-0010 §6).
    AgentToolStatus:
      type: string
      enum: [proposed, running, awaiting_approval, succeeded, failed, rejected, cancelled]
      description: State of one tool call an agent proposed.
    AgentSession:
      type: object
      description: |
        One agent session (design §2). `config` is the core configuration and never contains a
        secret: the native core's API key is write-only and only shown as `has_api_key`. `revision` is the concurrency guard
        of the session row; `last_seq` is the highest published session sequence.
      required: [session_id, plugin_id, title, core, permission_mode, status, config, has_api_key, last_seq, pending_approvals, created_at, updated_at, revision]
      properties:
        session_id: { $ref: '#/components/schemas/ResourceId' }
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        title: { type: string, minLength: 1, maxLength: 120, x-qwq-untrusted: true, description: Title chosen by the user; rendered as plain text. }
        core: { $ref: '#/components/schemas/AgentCore' }
        permission_mode: { $ref: '#/components/schemas/PermissionMode' }
        status: { $ref: '#/components/schemas/AgentSessionStatus' }
        config: { type: object, description: 'Core configuration; never contains a secret or a secret reference.' }
        has_api_key: { type: boolean, description: 'Whether the owner stored an API key for the native core (PUT .../api-key).' }
        last_seq: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Highest session sequence published so far. }
        pending_approvals: { type: integer, format: int32, minimum: 0, maximum: 1000, description: Tool calls waiting for a human decision. }
        last_message_at: { $ref: '#/components/schemas/Timestamp' }
        last_message_preview: { type: string, maxLength: 120, x-qwq-untrusted: true, description: Head of the newest transcript entry (plain text, untrusted); for list badges and previews. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    AgentSessionMessage:
      type: object
      description: |
        One transcript entry. `content` is plain text for a client; `content_json` is the structured
        fragment of a tool call (an assistant step) or of a tool result. Both can carry text produced
        by a model or a plugin and are untrusted.
      required: [seq, message_id, role, content, created_at]
      properties:
        seq: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Session sequence; also the SSE event id. }
        message_id: { type: string, maxLength: 64, description: Stable message identifier. }
        role: { type: string, enum: [user, assistant, system, tool], description: Author of the entry. }
        content: { type: string, maxLength: 262144, x-qwq-untrusted: true, description: Plain-text form; model or plugin output is untrusted. }
        content_json: { x-qwq-untrusted: true, description: Structured tool-call or tool-result fragment. }
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AgentSessionApproval:
      type: object
      description: |
        One awaiting tool call with the confirmation-card text of the operation. `summary` and
        `description` are written by the plugin author (ADR-0010 §4) and are untrusted.
      required: [call_id, approval_id, action, status, created_at]
      properties:
        call_id: { type: string, maxLength: 64, description: Tool call identifier. }
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        action: { $ref: '#/components/schemas/ActionId' }
        args: { type: object, description: 'Proposed arguments with sensitive values and internal references redacted. An opaque argument object is represented by {"$redacted":true}.' }
        summary: { type: string, maxLength: 200, x-qwq-untrusted: true, description: Confirmation-card title from the plugin author. }
        description: { type: string, maxLength: 2000, x-qwq-untrusted: true, description: Expandable confirmation text from the plugin author (plain text). }
        risk: { $ref: '#/components/schemas/RiskLevel' }
        approval: { $ref: '#/components/schemas/ApprovalLevel' }
        status: { $ref: '#/components/schemas/AgentToolStatus' }
        deadline: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AgentSessionApprovalList:
      type: object
      description: The pending approvals of a session.
      required: [items]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AgentSessionApproval' }, description: Pending approvals, oldest first. }
    AgentSessionMessageList:
      type: object
      description: One page of a session transcript (GET /agent-sessions/{id}/messages).
      required: [items]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AgentSessionMessage' }, description: Messages with seq below before_seq, oldest first. }
    AgentSessionInFlight:
      type: object
      additionalProperties: false
      description: In-memory buffered streaming content of an active turn not yet persisted to SQLite.
      required: [message_id, content, head_seq]
      properties:
        message_id: { type: string, maxLength: 128, description: Identifier of the assistant message currently streaming. }
        reasoning: { type: string, maxLength: 262144, x-qwq-untrusted: true, description: Buffered reasoning/thinking text so far. }
        content: { type: string, maxLength: 262144, x-qwq-untrusted: true, description: Buffered assistant reply text so far. }
        head_seq: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Latest runtime event sequence covered by this snapshot. }
    AgentSessionDetail:
      description: A session with its recent transcript and pending approvals.
      allOf:
        - $ref: '#/components/schemas/AgentSession'
        - type: object
          required: [messages, approvals]
          properties:
            messages: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AgentSessionMessage' }, description: Retained transcript, oldest first. }
            approvals: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AgentSessionApproval' }, description: Pending approvals of this session. }
            in_flight: { $ref: '#/components/schemas/AgentSessionInFlight', description: Present when a turn is actively streaming unpersisted tokens. }
    AgentSessionList:
      description: A page of agent sessions.
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AgentSession' }, description: Sessions, newest first. }
    AgentSessionCreateRequest:
      type: object
      additionalProperties: false
      description: |
        Session settings. Every member is optional: the defaults are the title "New session", core
        `native`, permission mode `safe` and the empty config.
      properties:
        title: { type: string, maxLength: 120, description: Display title; control characters are rejected. }
        core: { $ref: '#/components/schemas/AgentCore' }
        permission_mode: { $ref: '#/components/schemas/PermissionMode' }
        config: { type: object, description: 'Core configuration; `api_key_secret` is a secret reference, never a plaintext key.' }
    AgentSessionUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        Members to change; at least one of `title`, `permission_mode`, and `config` must be present.
        `expected_revision` is the revision the client last saw.
      required: [expected_revision]
      properties:
        title: { type: string, maxLength: 120, description: New display title. }
        permission_mode: { $ref: '#/components/schemas/PermissionMode' }
        config: { type: object, description: 'Partial core configuration patch (provider_id, auth_mode, model, reasoning_effort, max_context_tokens, plan_mode); plaintext secrets are rejected.' }
        expected_revision: { $ref: '#/components/schemas/Revision' }
    AgentSendMessageRequest:
      type: object
      additionalProperties: false
      description: One user message.
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 32768, x-qwq-untrusted: true, description: Message text; the core receives it as untrusted input. }
        client_message_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$', description: Optional idempotency key of the send; a retry with the same value returns the stored message. }
    AgentSendMessageResponse:
      type: object
      description: The stored message and the session state the turn was started for.
      required: [session, message]
      properties:
        session: { $ref: '#/components/schemas/AgentSession' }
        message: { $ref: '#/components/schemas/AgentSessionMessage' }
    AgentSessionAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      description: The native core's API key. Write-only; never returned.
      properties:
        api_key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: 'Visible ASCII; surrounding whitespace is dropped.' }
    AgentSessionCancelRequest:
      type: object
      additionalProperties: false
      description: Optional reason recorded with the cancelled turn.
      properties:
        reason: { type: string, maxLength: 500, description: Free-text reason shown in the transcript. }
    AgentSessionEvent:
      type: object
      description: |
        One event of a session stream. `seq` is the session sequence and the SSE `id`; the sequence is
        shared by messages and tool calls and only grows. `turn.completed.status` is one of `idle`,
        `waiting_approval`, `cancelled` and `failed`.
      required: [type, seq]
      properties:
        type:
          type: string
          enum: [message.delta, message.completed, tool_call, tool_result, approval_required, approval_decided, turn.completed, error]
          description: Event type.
        seq: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Session sequence. }
        session_id: { $ref: '#/components/schemas/ResourceId' }
        message_id: { type: string, maxLength: 64, description: Message this frame belongs to. }
        delta: { type: string, maxLength: 262144, x-qwq-untrusted: true, description: Text appended to the assistant message (message.delta). }
        call_id: { type: string, maxLength: 64, description: Tool call this frame belongs to. }
        action: { $ref: '#/components/schemas/ActionId' }
        args: { type: object, description: 'Proposed tool arguments with sensitive values and internal references redacted. An opaque argument object is represented by {"$redacted":true}.' }
        risk: { $ref: '#/components/schemas/RiskLevel' }
        approval: { $ref: '#/components/schemas/ApprovalLevel' }
        status: { type: string, maxLength: 32, description: 'Tool status (tool_result) or turn outcome (turn.completed).' }
        result: { x-qwq-untrusted: true, description: Tool result as reported by operations. }
        error: { $ref: '#/components/schemas/AgentSessionError' }
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        summary: { type: string, maxLength: 200, x-qwq-untrusted: true, description: Plugin author's confirmation-card title (approval_required). }
        description: { type: string, maxLength: 2000, x-qwq-untrusted: true, description: Plugin author's confirmation text (approval_required). }
        deadline: { $ref: '#/components/schemas/Timestamp' }
        decision: { type: string, enum: [approve, reject], description: The human decision (approval_decided). }
        comment: { type: string, maxLength: 500, x-qwq-untrusted: true, description: The approver's comment (approval_decided). }
        code: { type: string, maxLength: 64, description: Stable problem code (error). }
        detail: { type: string, maxLength: 2000, x-qwq-untrusted: true, description: Human-readable error detail (error). }
        tool_calls:
          type: array
          maxItems: 16
          description: The calls of an assistant step (message.completed).
          items: { $ref: '#/components/schemas/AgentSessionMessageToolCall' }
        at: { $ref: '#/components/schemas/Timestamp' }
    AgentSessionError:
      type: object
      description: Error code and detail inside a session event.
      required: [code]
      properties:
        code: { type: string, maxLength: 64, description: Stable error code (ProblemCode). }
        detail: { type: string, maxLength: 2000, x-qwq-untrusted: true, description: Human-readable detail. }
    AgentSessionMessageToolCall:
      type: object
      description: One tool call proposed by an assistant step.
      required: [call_id, action, arguments]
      properties:
        call_id: { type: string, maxLength: 64, description: Tool call identifier. }
        action: { $ref: '#/components/schemas/ActionId' }
        arguments: { type: object, description: 'Arguments as proposed, with secret values replaced by references.' }
    # ------------------------------------------------------------ ai providers
    AiProvider:
      type: object
      description: |
        A global AI provider (ADR-0017). An administrator sees every member; other principals get
        the reduced projection without `base_url`, the timestamps and `revision` (GAPS
        缺口 2). The API key is never part of the resource: only `has_api_key` is exposed.
      additionalProperties: false
      required: [provider_id, name, model, has_api_key, is_default]
      properties:
        provider_id: { $ref: '#/components/schemas/ResourceId' }
        name: { type: string, minLength: 1, maxLength: 64, description: Display name; unique among providers. }
        kind: { type: string, enum: [openai_compatible, anthropic_compatible], description: 'Endpoint wire protocol (`openai_compatible` or `anthropic_compatible`).' }
        base_url: { type: string, minLength: 1, maxLength: 2048, description: Endpoint base URL; administrator projection only. }
        model: { type: string, minLength: 1, maxLength: 128, description: Default model a session uses unless its config overrides it. }
        models:
          type: array
          maxItems: 500
          description: Cached list of available model identifiers discovered from or configured for this provider.
          items: { type: string, maxLength: 128 }
        reasoning_effort: { type: string, maxLength: 48, pattern: '^[a-zA-Z0-9._:/-]{0,48}$', description: Custom reasoning/thinking effort code (e.g. minimal, low, medium, high, xhigh, max, none, or numeric budget); empty auto-matches the built-in model catalog and falls back to high. }
        max_context_tokens: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: Default context window size in tokens (0 auto-matches the model catalog). }
        has_api_key: { type: boolean, description: Whether an API key is stored. The key is write-only and never returned. }
        is_default: { type: boolean, description: 'Whether sessions without their own endpoint use this provider; at most one provider is the default.' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    AiProviderList:
      type: object
      description: Every provider, ordered by identifier; the list is bounded and not paginated.
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AiProvider' }, description: Providers. }
    AiProviderCreateRequest:
      type: object
      additionalProperties: false
      description: A provider to add. The API key is not here; store it with the api-key route afterwards.
      required: [name, base_url, model]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: Display name; unique among providers. }
        kind: { type: string, enum: [openai_compatible, anthropic_compatible], description: 'Endpoint wire protocol; defaults to `openai_compatible`.' }
        base_url: { type: string, minLength: 1, maxLength: 2048, description: 'Absolute http or https URL without credentials, query or fragment.' }
        model: { type: string, minLength: 1, maxLength: 128, description: Default model a session uses unless its config overrides it. }
        models:
          type: array
          maxItems: 500
          description: Optional cached model list available on this provider.
          items: { type: string, maxLength: 128 }
        reasoning_effort: { type: string, maxLength: 48, pattern: '^[a-zA-Z0-9._:/-]{0,48}$', description: Custom reasoning/thinking effort code (e.g. minimal, low, medium, high, xhigh, max, none, or numeric budget); empty auto-matches the built-in model catalog and falls back to high. }
        max_context_tokens: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: Default context window size in tokens (0 auto-matches the model catalog). }
        is_default: { type: boolean, description: Make this the provider sessions without their own endpoint use; clears the previous default. }
    AiProviderUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        Members to change; at least one editable field must be present. Changing `base_url` removes the stored API key.
      required: [expected_revision]
      properties:
        expected_revision: { $ref: '#/components/schemas/Revision' }
        name: { type: string, minLength: 1, maxLength: 64, description: New display name. }
        kind: { type: string, enum: [openai_compatible, anthropic_compatible], description: New endpoint wire protocol. }
        base_url: { type: string, minLength: 1, maxLength: 2048, description: 'New endpoint base URL; removes the stored API key.' }
        model: { type: string, minLength: 1, maxLength: 128, description: New default model. }
        models:
          type: array
          maxItems: 500
          description: Updated cached model list available on this provider.
          items: { type: string, maxLength: 128 }
        reasoning_effort: { type: string, maxLength: 48, pattern: '^[a-zA-Z0-9._:/-]{0,48}$', description: New custom reasoning/thinking effort code; empty restores auto-matching against the built-in model catalog with fallback to high. }
        max_context_tokens: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: New default context window size in tokens (0 restores automatic model matching). }
        is_default: { type: boolean, description: 'Whether this provider is the default; setting it clears the previous default.' }
    AiProviderFetchModelsRequest:
      type: object
      additionalProperties: false
      description: Parameters for discovering available models from a saved provider or an unsaved endpoint.
      properties:
        provider_id: { $ref: '#/components/schemas/ResourceId' }
        kind: { type: string, enum: [openai_compatible, anthropic_compatible], description: Endpoint wire protocol. }
        base_url: { type: string, maxLength: 2048, description: Endpoint base URL (required when provider_id is omitted). }
        api_key: { type: string, maxLength: 4096, writeOnly: true, description: Optional write-only API key for unsaved endpoints. }
    AiProviderFetchModelsResult:
      type: object
      additionalProperties: false
      description: Result of model discovery; never returns raw upstream error bodies.
      required: [ok, models]
      properties:
        ok: { type: boolean, description: Whether model discovery succeeded. }
        models:
          type: array
          maxItems: 500
          description: Sorted deduplicated model identifiers returned by the endpoint.
          items: { type: string, maxLength: 128 }
        latency_ms: { type: integer, format: int64, minimum: 0, maximum: 600000, description: Round-trip time in milliseconds. }
        category: { type: string, enum: [auth, network, denied, 4xx, 5xx], description: Sanitized failure category when ok is false. }
    AgentCoreLoginState:
      type: object
      additionalProperties: false
      description: In-flight or recently completed official CLI login process state.
      required: [state]
      properties:
        state: { type: string, enum: [pending, succeeded, failed, cancelled, expired], description: Login lifecycle state. }
        verification_url: { type: string, maxLength: 2048, description: Official OAuth/device verification URL to open in a browser. }
        user_code: { type: string, maxLength: 64, description: One-time device authorization code. }
        message: { type: string, maxLength: 500, description: Human-readable status guidance. }
        output_tail:
          type: array
          maxItems: 32
          description: Recent sanitized CLI login log lines (tokens redacted).
          items: { type: string, maxLength: 300 }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AgentCoreAuthStatus:
      type: object
      additionalProperties: false
      description: Installation and official login state of one external CLI agent core.
      required: [core, display_name, binary, installed, install_hint, logged_in, auth_method]
      properties:
        core: { type: string, enum: [codex, claude-code, opencode], description: External CLI core identifier. }
        display_name: { type: string, maxLength: 64, description: Human-readable core name. }
        binary: { type: string, maxLength: 64, description: CLI executable name. }
        installed: { type: boolean, description: Whether the CLI binary is present in PATH. }
        install_hint: { type: string, maxLength: 200, description: Recommended official installation command. }
        logged_in: { type: boolean, description: Whether persistent official login credentials are present in the isolated agent home. }
        auth_method: { type: string, enum: [oauth, token, none], description: Active persistent login credential type. }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        active_login: { $ref: '#/components/schemas/AgentCoreLoginState' }
    AgentCoreAuthList:
      type: object
      additionalProperties: false
      description: Official login status for every supported external CLI agent core.
      required: [items]
      properties:
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/AgentCoreAuthStatus' }, description: External CLI core auth entries. }
    AgentCoreLoginRequest:
      type: object
      additionalProperties: false
      description: Request to start official CLI login or import an OAuth setup token.
      properties:
        mode: { type: string, enum: [device, token], description: Login flow mode (device launches official CLI login; token imports pasted setup token or auth JSON). }
        token: { type: string, maxLength: 65536, writeOnly: true, description: Write-only setup token or credentials JSON when mode is token. }
    AgentCorePromptTarget:
      type: object
      additionalProperties: false
      description: Canonical custom prompt file for one agent core family.
      required: [core, display_name, rel_path, file_name, description]
      properties:
        core: { $ref: '#/components/schemas/AgentCore' }
        display_name: { type: string, maxLength: 64, description: Core display name. }
        rel_path: { type: string, maxLength: 128, description: Relative path inside prompts/. }
        file_name: { type: string, maxLength: 64, description: Canonical prompt filename (CLAUDE.md, AGENTS.md, SYSTEM.md). }
        description: { type: string, maxLength: 240, description: Explanation of how this prompt file is loaded. }
    AgentWorkspaceFileEntry:
      type: object
      additionalProperties: false
      description: Metadata of one file inside the agent workspace.
      required: [area, path, name, size, is_text, updated_at]
      properties:
        area: { type: string, enum: [mcp, skills, prompts], description: Separated workspace area. }
        path: { type: string, maxLength: 240, description: Relative path within the area. }
        name: { type: string, maxLength: 128, description: Basename of the file. }
        group: { type: string, maxLength: 128, description: Skill slug or agent core family folder. }
        size: { type: integer, format: int64, minimum: 0, maximum: 10485760, description: File size in bytes. }
        is_text: { type: boolean, description: Whether the file can be edited inline as UTF-8 text. }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AgentExchangeEntry:
      type: object
      additionalProperties: false
      description: One file or subfolder in the agent interactive exchange folder.
      required: [name, path, is_dir, size, is_text, is_image, updated_at]
      properties:
        name: { type: string, maxLength: 256, description: Entry basename. }
        path: { type: string, maxLength: 320, description: Relative path inside the exchange folder. }
        is_dir: { type: boolean, description: Whether the entry is a subfolder. }
        size: { type: integer, format: int64, minimum: 0, maximum: 1073741824, description: File size in bytes (0 for directories). }
        child_count: { type: integer, format: int32, minimum: 0, maximum: 100000, description: Direct child count when is_dir is true. }
        is_text: { type: boolean, description: Whether the file is previewable/editable as UTF-8 text. }
        is_image: { type: boolean, description: Whether the file is a previewable image. }
        mime_type: { type: string, maxLength: 128, description: Detected MIME type when known. }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AgentExchangeListResult:
      type: object
      additionalProperties: false
      description: Directory listing of one path inside the agent interactive exchange folder.
      required: [path, parent_path, root_hint, entries, total_dirs, total_files, total_bytes]
      properties:
        path: { type: string, maxLength: 320, description: Current relative directory path (empty for root). }
        parent_path: { type: string, maxLength: 320, description: Parent relative directory path. }
        root_hint: { type: string, maxLength: 512, description: Absolute host directory path of the exchange root. }
        entries:
          type: array
          maxItems: 1000
          description: Folders and files inside this directory.
          items: { $ref: '#/components/schemas/AgentExchangeEntry' }
        total_dirs: { type: integer, format: int32, minimum: 0, maximum: 100000, description: Number of subfolders in this directory. }
        total_files: { type: integer, format: int32, minimum: 0, maximum: 100000, description: Number of files in this directory. }
        total_bytes: { type: integer, format: int64, minimum: 0, maximum: 1099511627776, description: Combined file bytes in this directory. }
    AgentExchangePreview:
      type: object
      additionalProperties: false
      description: Bounded preview of one file inside the agent interactive exchange folder.
      required: [path, name, size, is_text, is_image, updated_at]
      properties:
        path: { type: string, maxLength: 320, description: Relative file path. }
        name: { type: string, maxLength: 256, description: File basename. }
        size: { type: integer, format: int64, minimum: 0, maximum: 1073741824, description: File size in bytes. }
        is_text: { type: boolean, description: Whether inline text content is returned. }
        is_image: { type: boolean, description: Whether the file is a previewable image. }
        mime_type: { type: string, maxLength: 128, description: Detected MIME type. }
        truncated: { type: boolean, description: True when inline text was truncated to the preview cap. }
        content: { type: string, maxLength: 524288, description: UTF-8 text preview content. }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AgentExchangeMkdirRequest:
      type: object
      additionalProperties: false
      description: Request to create a subfolder inside the exchange folder.
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 320, description: Relative subfolder path to create. }
    AgentExchangeWriteRequest:
      type: object
      additionalProperties: false
      description: Request to create or update a text file inside the exchange folder.
      required: [path, content]
      properties:
        path: { type: string, minLength: 1, maxLength: 320, description: Relative file path. }
        content: { type: string, maxLength: 2097152, description: UTF-8 text content. }
    AgentExchangeRenameRequest:
      type: object
      additionalProperties: false
      description: Request to rename or move a file or subfolder inside the exchange folder.
      required: [from, to]
      properties:
        from: { type: string, minLength: 1, maxLength: 320, description: Current relative path. }
        to: { type: string, minLength: 1, maxLength: 320, description: Target relative path. }
    AgentExchangeUploadResult:
      type: object
      additionalProperties: false
      description: Summary of files uploaded into the interactive exchange folder.
      required: [dir, items, total]
      properties:
        dir: { type: string, maxLength: 320, description: Target subfolder path. }
        items:
          type: array
          maxItems: 100
          description: Uploaded file entries.
          items: { $ref: '#/components/schemas/AgentExchangeEntry' }
        total: { type: integer, format: int32, minimum: 0, maximum: 100, description: Count of uploaded files. }
    AgentWorkspaceListResult:
      type: object
      additionalProperties: false
      description: Listed files for one separated agent workspace directory.
      required: [area, directory_hint, items]
      properties:
        area: { type: string, enum: [mcp, skills, prompts], description: Separated workspace area. }
        directory_hint: { type: string, maxLength: 512, description: Isolated host directory path of this area. }
        items:
          type: array
          maxItems: 500
          description: Files currently stored in this area.
          items: { $ref: '#/components/schemas/AgentWorkspaceFileEntry' }
        prompt_targets:
          type: array
          maxItems: 8
          description: Canonical per-core prompt targets when area is prompts.
          items: { $ref: '#/components/schemas/AgentCorePromptTarget' }
    AgentWorkspaceFileContent:
      type: object
      additionalProperties: false
      description: Inline text content of one workspace file.
      required: [area, path, content, size]
      properties:
        area: { type: string, enum: [mcp, skills, prompts], description: Separated workspace area. }
        path: { type: string, maxLength: 240, description: Relative path within the area. }
        content: { type: string, maxLength: 524288, description: UTF-8 file text content. }
        size: { type: integer, format: int64, minimum: 0, maximum: 524288, description: File size in bytes. }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AgentWorkspaceWriteRequest:
      type: object
      additionalProperties: false
      description: Request to write text or upload a file into a workspace area.
      required: [area, path]
      properties:
        area: { type: string, enum: [mcp, skills, prompts], description: Target workspace area. }
        path: { type: string, minLength: 1, maxLength: 240, description: Relative file path within the area. }
        content: { type: string, maxLength: 2097152, description: UTF-8 text content. }
        content_base64: { type: string, maxLength: 3145728, description: Optional base64-encoded file bytes for drag-and-drop uploads. }
    AgentMCPServerEntry:
      type: object
      additionalProperties: false
      description: Standard MCP server configuration entry stored in mcp/servers.json.
      required: [id, name, transport, enabled]
      properties:
        id: { type: string, maxLength: 64, description: Unique MCP server slug. }
        name: { type: string, maxLength: 128, description: Display name. }
        description: { type: string, maxLength: 500, description: Server summary. }
        transport: { type: string, enum: [stdio, http], description: Transport protocol. }
        command: { type: string, maxLength: 256, description: Executable for stdio transport. }
        args:
          type: array
          maxItems: 32
          description: Command arguments for stdio transport.
          items: { type: string, maxLength: 256 }
        url: { type: string, maxLength: 2048, description: Endpoint URL for HTTP transport. }
        env:
          type: object
          description: Environment variables passed to the MCP server.
          additionalProperties: { type: string, maxLength: 1024 }
        enabled: { type: boolean, description: Whether this MCP server is enabled for agent turns. }
        source: { type: string, maxLength: 128, description: Official repository source if installed from the registry. }
    AgentRegistrySourceMeta:
      type: object
      additionalProperties: false
      description: Metadata of one built-in official Skills or MCP repository.
      required: [id, name, kind, repo, url, description]
      properties:
        id: { type: string, maxLength: 64, description: Source identifier. }
        name: { type: string, maxLength: 128, description: Official repository display name. }
        kind: { type: string, enum: [skill, mcp], description: Resource category provided by this repository. }
        repo: { type: string, maxLength: 128, description: GitHub owner/repo slug. }
        url: { type: string, maxLength: 512, description: Official repository homepage URL. }
        description: { type: string, maxLength: 300, description: Short description. }
    AgentRegistryItem:
      type: object
      additionalProperties: false
      description: One searchable official Skill or MCP server entry.
      required: [id, slug, kind, source, source_name, name, description, repo, repo_url, installed]
      properties:
        id: { type: string, maxLength: 128, description: Stable registry item identifier. }
        slug: { type: string, maxLength: 64, description: Local folder or MCP id slug. }
        kind: { type: string, enum: [skill, mcp], description: Item type. }
        source: { type: string, maxLength: 64, description: Official source identifier. }
        source_name: { type: string, maxLength: 128, description: Official source display name. }
        name: { type: string, maxLength: 128, description: Display title. }
        description: { type: string, maxLength: 500, description: Summary of capabilities. }
        repo: { type: string, maxLength: 128, description: Upstream GitHub owner/repo. }
        repo_path: { type: string, maxLength: 256, description: Relative path inside upstream repository. }
        repo_url: { type: string, maxLength: 512, description: Upstream repository URL. }
        raw_url: { type: string, maxLength: 512, description: Whitelisted raw SKILL.md URL. }
        tags:
          type: array
          maxItems: 16
          description: Searchable tags.
          items: { type: string, maxLength: 64 }
        installed: { type: boolean, description: Whether already installed in the local agent workspace. }
        mcp_template: { $ref: '#/components/schemas/AgentMCPServerEntry' }
    AgentRegistrySearchResult:
      type: object
      additionalProperties: false
      description: Result of searching built-in official Skills and MCP repositories.
      required: [sources, items, live_refreshed]
      properties:
        sources:
          type: array
          maxItems: 16
          description: Built-in official repository definitions.
          items: { $ref: '#/components/schemas/AgentRegistrySourceMeta' }
        items:
          type: array
          maxItems: 300
          description: Matching official Skills and MCP servers.
          items: { $ref: '#/components/schemas/AgentRegistryItem' }
        live_refreshed: { type: boolean, description: True when live GitHub indexes were refreshed in this call. }
        cached_at: { $ref: '#/components/schemas/Timestamp' }
    AgentRegistryInstallRequest:
      type: object
      additionalProperties: false
      description: Request to download and install one official Skill or MCP server.
      required: [id]
      properties:
        id: { type: string, minLength: 1, maxLength: 128, description: Official registry item identifier. }
    AgentRegistryInstallResult:
      type: object
      additionalProperties: false
      description: Result of installing an official Skill or MCP server.
      required: [id, kind, installed, target, from_live, message]
      properties:
        id: { type: string, maxLength: 128, description: Installed registry item identifier. }
        kind: { type: string, enum: [skill, mcp], description: Installed item type. }
        installed: { type: boolean, description: Always true on success. }
        target: { type: string, maxLength: 256, description: Written relative path inside the agent workspace. }
        from_live: { type: boolean, description: True when downloaded directly from upstream GitHub raw content. }
        message: { type: string, maxLength: 500, description: Human-readable confirmation message. }
    AiProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      description: The provider's API key. Write-only; never returned.
      properties:
        api_key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: 'Visible ASCII; surrounding whitespace is dropped.' }
    AiProviderTestResult:
      type: object
      additionalProperties: false
      description: The outcome of one connectivity probe; never the address, the exact status or the body.
      required: [ok]
      properties:
        ok: { type: boolean, description: Whether the endpoint answered 200 within the deadline. }
        latency_ms: { type: integer, format: int64, minimum: 0, maximum: 600000, description: Round-trip time of a successful probe. }
        category: { type: string, enum: [auth, network, denied, 4xx, 5xx], description: 'Failure class; absent when `ok`. `denied` is the outbound policy, `auth` a 401/403.' }
    AgentCoreInfo:
      type: object
      additionalProperties: false
      description: One selectable agent core (ADR-0010 §5).
      required: [core, available]
      properties:
        core: { $ref: '#/components/schemas/AgentCore' }
        available: { type: boolean, description: Whether the host can run this core now. }
        reason: { type: string, maxLength: 200, description: Why an unavailable core is unavailable; the interface shows it next to the core. }
    AgentCoreList:
      type: object
      additionalProperties: false
      description: The cores of ADR-0010 in fixed order.
      required: [items]
      properties:
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/AgentCoreInfo' }, description: The four cores. }
    # ------------------------------------------------------------ nodes
    Node:
      type: object
      description: |
        A managed node. Fields under `reported` come from the node's agent and are untrusted strings
        (ARCH §3.2 item 6); the rest is host-owned.
      required: [node_id, name, status, created_at, revision]
      properties:
        node_id: { $ref: '#/components/schemas/NodeId' }
        name: { type: string, maxLength: 64, description: Display name set by an administrator. }
        status: { type: string, enum: [online, offline, enrolling, disabled], description: Connection state from the node session. }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }
        protocol_version: { type: string, maxLength: 32, description: Negotiated node protocol version. }
        reported:
          type: object
          x-qwq-untrusted: true
          description: Self-reported by the agent; untrusted.
          properties:
            hostname: { type: string, maxLength: 253, description: Host name. }
            agent_version: { type: string, maxLength: 64, description: Agent version. }
            os: { type: string, maxLength: 128, description: Operating system description. }
            arch: { type: string, maxLength: 32, description: CPU architecture. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    SystemInfo:
      type: object
      additionalProperties: false
      description: |
        The installation overview. `listen` and `data_dir` are present only for an administrator;
        every other member is readable by any signed-in principal.
      required: [version, role, started_at, tls, plugins_enabled]
      properties:
        version: { type: string, maxLength: 64, description: Release version of the running binary. }
        commit: { type: string, maxLength: 64, description: VCS revision the binary was built from; absent when unknown. }
        role: { type: string, maxLength: 32, description: Deployment role of this host. }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        tls:
          type: object
          additionalProperties: false
          description: TLS state of the management listener.
          required: [mode]
          properties:
            mode: { type: string, maxLength: 32, description: 'Certificate mode: self_signed, acme or proxy.' }
            fingerprint: { type: string, maxLength: 128, description: SHA-256 fingerprint of the serving certificate. }
            not_after: { $ref: '#/components/schemas/Timestamp' }
            domains: { type: array, maxItems: 16, items: { type: string, maxLength: 253 }, description: ACME domains of the configuration. }
        listen: { type: string, maxLength: 64, description: Listener address; administrators only. }
        data_dir: { type: string, maxLength: 512, description: Data directory; administrators only. }
        plugins_enabled: { type: boolean, description: Whether any plugin has an active version. }
    PanelAccessSettings:
      type: object
      additionalProperties: false
      description: Live panel access port, secret entry path, stealth disguise, and reverse-proxy domain state.
      required:
        - listen_host
        - port
        - listen
        - tls_mode
        - entry_path
        - effective_entry_path
        - entry_gate_active
        - disguise
        - disguise_html
        - panel_domain
        - auto_disable_on_domain
        - revision
        - updated_at
      properties:
        listen_host: { type: string, maxLength: 64, description: Bound listen IP or host. }
        port: { type: integer, format: int32, minimum: 1, maximum: 65535, description: Active TCP listening port. }
        listen: { type: string, maxLength: 80, description: Full host:port listen address. }
        tls_mode: { type: string, maxLength: 32, description: Active TLS mode (self_signed, acme or proxy). }
        entry_path: { type: string, maxLength: 64, description: Configured secret entry path segment without slashes. }
        effective_entry_path: { type: string, maxLength: 64, description: Currently enforced secret entry path; empty when disabled or bypassed by a reverse-proxy domain. }
        entry_gate_active: { type: boolean, description: Whether requests without the secret entry path are gated and disguised. }
        disguise: { type: string, maxLength: 32, enum: [drop, nginx_404, nginx_403, blank_404, custom_html], description: Active disguise response mode. }
        disguise_html: { type: string, maxLength: 65536, description: Custom disguise HTML body. }
        panel_domain: { type: string, maxLength: 253, description: Configured reverse-proxy domain for direct access. }
        auto_disable_on_domain: { type: boolean, description: Automatically disable the secret entry path and disguise when a reverse-proxy domain is configured. }
        bypass_reason: { type: string, maxLength: 32, description: Reason the entry gate is currently bypassed (tls_proxy, panel_domain or public_origin). }
        port_changed: { type: boolean, description: True when a PUT request rebound the listener to a new TCP port. }
        revision: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Monotonic revision counter for optimistic concurrency checks. }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    SystemBackupEntry:
      type: object
      additionalProperties: false
      description: Metadata of one consistent host backup archive.
      required: [filename, size_bytes, created_at]
      properties:
        filename: { type: string, maxLength: 64, description: Backup archive filename. }
        size_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Archive size in bytes. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    SystemBackupList:
      type: object
      additionalProperties: false
      description: Collection of available system backup archives.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          description: Backup archives ordered newest first.
          items: { $ref: '#/components/schemas/SystemBackupEntry' }
    NodeList:
      description: A page of nodes.
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Node' }, description: Nodes. }
    # ------------------------------------------------------------ plugins
    PluginVersion:
      type: object
      description: |
        One version recorded by the updater. `status` follows the version lifecycle of ARCH §6.1;
        `install_status` is the separate installation axis of ARCH §6.6.
      required: [plugin_id, version, digest, status, install_status, active, installed_at, revision]
      properties:
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        version: { type: string, maxLength: 64, description: Exact SemVer version from the signed manifest. }
        digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Digest of the signed manifest bytes. }
        status:
          type: string
          enum: [STAGED, STARTING, CANDIDATE, ACTIVE, DRAINING, STOPPED, REJECTED, ROLLED_BACK, QUARANTINED]
          description: Version lifecycle state (ARCH §6.1).
        install_status:
          type: string
          enum: [STAGED, INSTALLED, REMOVED]
          description: Installation state (ARCH §6.6).
        active: { type: boolean, description: This version is the committed active one. }
        installed_at: { $ref: '#/components/schemas/Timestamp' }
        activated_at: { $ref: '#/components/schemas/Timestamp' }
        rejected_reason: { type: string, maxLength: 1000, description: Why the version was not activated. }
        revision: { $ref: '#/components/schemas/Revision' }
    Plugin:
      type: object
      description: |
        An installed plugin, assembled from its local version rows. `name`, `summary` and
        `publisher_id` come from the signed manifest but are written by the plugin author: untrusted.
        `versions` is ordered newest first. The optional members below come from the ACTIVE version's
        manifest; every text among them is untrusted too.
      required: [plugin_id, name, summary, publisher_id, placement, config_revision, versions, created_at, revision]
      properties:
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        name: { type: string, maxLength: 64, x-qwq-untrusted: true, description: Manifest `name`. }
        summary: { type: string, maxLength: 120, x-qwq-untrusted: true, description: Manifest `summary`. }
        publisher_id: { type: string, maxLength: 64, x-qwq-untrusted: true, description: Manifest `publisher.id`. }
        placement: { type: string, enum: [node, controller], description: Manifest `placement`. }
        active_version: { type: string, maxLength: 64, description: Version currently ACTIVE; absent when none. }
        active_status:
          type: string
          enum: [STAGED, STARTING, CANDIDATE, ACTIVE, DRAINING, STOPPED, REJECTED, ROLLED_BACK, QUARANTINED]
          description: Latest version state (ARCH §6.1); absent when no version is active.
        install_status:
          type: string
          enum: [STAGED, INSTALLED, REMOVED]
          description: Installation state (ARCH §6.6); absent when no version is active.
        config_revision: { $ref: '#/components/schemas/Revision' }
        versions: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/PluginVersion' }, description: Version rows, newest first. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
        description:
          type: string
          maxLength: 2000
          x-qwq-untrusted: true
          description: Manifest `description`; absent when the author wrote none.
        icon_url:
          type: string
          maxLength: 512
          pattern: '^/plugin-ui/'
          description: |
            Versioned URL of the manifest icon under the plugin static prefix (ADR-0018); absent
            without an icon. Render with `<img>` only, never inline.
        homepage: { type: string, maxLength: 256, description: Manifest `homepage`; a link the user may follow. }
        license: { type: string, maxLength: 64, description: Manifest `license` (SPDX expression). }
        builtin: { type: boolean, description: '`true` when the plugin is a mandatory base plugin that cannot be uninstalled; absent otherwise.' }
        enabled: { type: boolean, description: 'Whether the plugin is currently enabled on the host.' }
        startup: { type: string, enum: [eager, on_demand], description: 'Lifecycle startup mode declared by the active manifest.' }
        has_config: { type: boolean, description: '`false` when the active version declares no configuration schema; the settings tab is hidden then.' }
        capabilities:
          type: array
          maxItems: 64
          description: Capabilities the manifest declares, with the host's sensitivity verdict.
          items: { $ref: '#/components/schemas/PluginCapability' }
        operations:
          type: array
          maxItems: 256
          description: Actions of the active version, exactly as the host action catalog holds them (risk and approval already clamped).
          items: { $ref: '#/components/schemas/ActionMeta' }
        dependencies:
          type: array
          maxItems: 32
          description: Plugin ids the active version depends on; uninstall is blocked while a dependent is installed.
          items: { $ref: '#/components/schemas/PluginId' }
        resources: { $ref: '#/components/schemas/PluginResources' }
        ui: { $ref: '#/components/schemas/PluginUi' }
        runtime: { $ref: '#/components/schemas/PluginRuntime' }
    PluginCapability:
      type: object
      description: |
        One capability the active manifest requests. `sensitive` is the host's verdict (ARCH §10.3
        高敏): a sensitive capability needs its own consent line in the install wizard. `reason` is
        the author's explanation, untrusted.
      required: [name, scope, reason, sensitive]
      properties:
        name: { type: string, maxLength: 64, description: Capability name, e.g. `system.firewall`. }
        scope: { type: string, maxLength: 128, description: Capability scope, e.g. `nftables`. }
        reason: { type: string, maxLength: 512, x-qwq-untrusted: true, description: Why the plugin requests it. }
        sensitive: { type: boolean, description: The host classifies this capability as high-sensitivity. }
    PluginResources:
      type: object
      description: Resource budget of the active manifest (ARCH §5.3). `disk_max_mb` is a soft limit with periodic accounting and alerts.
      required: [memory_max_mb, cpu_quota_percent, pids_max, fds_max, disk_max_mb]
      properties:
        memory_max_mb: { type: integer, format: int64, minimum: 16, maximum: 65536, description: MemoryMax of the plugin unit. }
        cpu_quota_percent: { type: integer, format: int64, minimum: 1, maximum: 100000, description: CPUQuota of the plugin unit. }
        pids_max: { type: integer, format: int64, minimum: 1, maximum: 4096, description: TasksMax of the plugin unit. }
        fds_max: { type: integer, format: int64, minimum: 16, maximum: 65536, description: LimitNOFILE of the plugin unit. }
        disk_max_mb: { type: integer, format: int64, minimum: 1, maximum: 1048576, description: Soft disk budget under the plugin state root. }
    PluginRoute:
      type: object
      description: One route the active version contributes to the Web Shell navigation.
      required: [path, title, nav, permission]
      properties:
        path: { type: string, maxLength: 128, pattern: '^/[a-z0-9._/:-]*$', description: Shell path, e.g. `/plugins/com.example.meta/report`. }
        title: { type: string, maxLength: 32, x-qwq-untrusted: true, description: Navigation label written by the plugin author. }
        nav: { type: boolean, description: Show the route in the sidebar. }
        permission: { type: string, maxLength: 128, description: 'RBAC permission required to open the route, e.g. `com.example.meta:read`.' }
    PluginWidget:
      type: object
      description: |
        A declarative overview card the Web Shell draws natively (manifest schema 1.3, ADR-0018).
        The operation is an `effect=read`, `mode=invoke` operation of the same plugin that is polled with an empty payload
        every `refresh_seconds`; its result shape is fixed by `kind`.
      required: [id, title, kind, operation, refresh_seconds, size]
      properties:
        id: { type: string, maxLength: 32, pattern: '^[a-z][a-z0-9_-]*$', description: Widget id, unique within the plugin. }
        title: { type: string, maxLength: 32, x-qwq-untrusted: true, description: Card title written by the plugin author. }
        kind: { type: string, enum: [stat, series, checks, list], description: Result shape the Shell expects. }
        operation: { type: string, maxLength: 64, description: The plugin operation the card polls. }
        refresh_seconds: { type: integer, format: int64, minimum: 2, maximum: 86400, description: Poll interval; the host may throttle to keep a per-user, per-widget floor. }
        size: { type: string, enum: [s, m, l], description: Grid span class. }
        icon: { type: string, maxLength: 32, description: Shell icon name; an unknown name falls back to the icon of the kind. }
        color: { type: string, maxLength: 16, description: Shell category color name. }
    PluginUi:
      type: object
      description: UI contribution of the active version. Paths are versioned and served unauthenticated under `/plugin-ui` (ADR-0018); content is treated as public and sandboxed at the bridge and API layers.
      required: [entry_url, routes, widgets, connect_sources]
      properties:
        entry_url: { type: string, maxLength: 512, pattern: '^/plugin-ui/', description: Versioned URL of the sandboxed entry document. }
        routes: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/PluginRoute' }, description: Routes the plugin contributes. }
        widgets: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/PluginWidget' }, description: Overview cards the Shell renders. }
        connect_sources:
          type: array
          maxItems: 8
          description: HTTPS origins the sandboxed page may connect to (`connect-src` of its CSP).
          items: { type: string, maxLength: 256, pattern: '^https://' }
    PluginRuntime:
      type: object
      description: |
        In-memory process state of the plugin. The list answers from memory and never queries
        systemd; `memory_bytes` is the cgroup usage at the time of the read and may lag.
      required: [state]
      properties:
        state: { type: string, enum: [running, standby, starting, stopped, crashed, quarantined, unknown], description: 'Simplified process state; `standby` means an enabled on-demand plugin ready to wake on first request, `crashed` is a restart loop, `unknown` an unattributed failure.' }
        since: { $ref: '#/components/schemas/Timestamp' }
        restarts: { type: integer, format: int32, minimum: 0, maximum: 1000000, description: Restarts observed while recovering this generation. }
        memory_bytes: { type: integer, format: int64, minimum: 0, maximum: 1099511627776, description: Current cgroup memory usage in bytes. }
        memory_max_bytes: { type: integer, format: int64, minimum: 0, maximum: 1099511627776, description: MemoryMax of the plugin unit in bytes. }
        detail: { type: string, maxLength: 500, x-qwq-untrusted: true, description: Last error or state note; render as plain text. }
    PluginConfigSchema:
      type: object
      x-qwq-untrusted: true
      description: |
        JSON Schema (Draft 2020-12 subset) of the plugin configuration, exactly as shipped in the
        signed package: untrusted data rendered by the Shell form generator. Sensitive fields are
        marked `writeOnly: true` or `x-secret: true`.
    PluginList:
      description: A page of installed plugins.
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Plugin' }, description: Plugins. }
    PluginInstallRequest:
      type: object
      additionalProperties: false
      description: |
        Install the package staged by `POST /api/v1/plugin-packages`. The plugin id and version are
        read from the signed manifest. `accepted_capabilities` must cover every capability the
        manifest declares, proving the user saw the consent screen.
      required: [upload_id, accepted_capabilities]
      properties:
        upload_id: { type: string, minLength: 36, maxLength: 36, pattern: '^upl_[0-9a-f]{32}$', description: Opaque id returned by the upload call. }
        accepted_capabilities:
          type: array
          maxItems: 64
          description: Capabilities the user accepted. A capability is identified by name + scope; omitting scope accepts the name only when the manifest declares it under a single scope.
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, maxLength: 64, description: Capability name. }
              scope: { type: string, maxLength: 128, description: Capability scope. }
        expected_revision: { $ref: '#/components/schemas/Revision' }
        resources: { $ref: '#/components/schemas/PluginResourcesOverrideRequest' }
    PluginResourcesOverrideRequest:
      type: object
      additionalProperties: false
      description: Optional administrator resource limit overrides for a plugin systemd unit.
      properties:
        memory_max_mb: { type: integer, format: int64, minimum: 16, maximum: 65536, description: Hard memory limit in MiB. }
        cpu_quota_percent: { type: integer, format: int64, minimum: 1, maximum: 100000, description: CPU quota percentage. }
        pids_max: { type: integer, format: int64, minimum: 1, maximum: 4096, description: Maximum tasks/processes limit. }
        fds_max: { type: integer, format: int64, minimum: 16, maximum: 65536, description: Maximum open file descriptors. }
        disk_max_mb: { type: integer, format: int64, minimum: 1, maximum: 1048576, description: Advisory persistent disk budget in MiB. }
        reset_default: { type: boolean, description: When true, removes custom overrides and restores manifest defaults. }
    SystemHostProcess:
      type: object
      additionalProperties: false
      description: Lightweight summary of a top host process by CPU or memory usage.
      required: [pid, name, cpu_percent, mem_bytes, mem_percent]
      properties:
        pid: { type: integer, format: int32, minimum: 1, maximum: 4194304, description: Process identifier. }
        name: { type: string, maxLength: 64, description: Process command name from /proc/<pid>/stat. }
        cpu_percent: { type: number, format: double, minimum: 0, maximum: 100, description: Recent host-wide CPU usage percentage. }
        mem_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Resident set size in bytes. }
        mem_percent: { type: number, format: double, minimum: 0, maximum: 100, description: Share of total host RAM percentage. }
    SystemHostMetrics:
      type: object
      additionalProperties: false
      description: Real-time built-in host resource metrics snapshot.
      required: [collected_at, host, cpu, memory, disk, network]
      properties:
        collected_at: { type: string, format: date-time, maxLength: 64, description: RFC 3339 sample timestamp. }
        range: { type: string, enum: [5m, 15m, 1h, 6h, 24h], description: Returned trend history window. }
        sample_interval_seconds: { type: integer, format: int32, minimum: 1, maximum: 3600, description: Target spacing in seconds between returned trend points for the selected window. }
        host:
          type: object
          additionalProperties: false
          description: Basic host identity and uptime.
          required: [hostname, os, kernel, arch, uptime_seconds]
          properties:
            hostname: { type: string, maxLength: 256, description: Hostname. }
            os: { type: string, maxLength: 256, description: Operating system name. }
            kernel: { type: string, maxLength: 256, description: Kernel release. }
            arch: { type: string, maxLength: 64, description: CPU architecture. }
            uptime_seconds: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Host uptime in seconds. }
        cpu:
          type: object
          additionalProperties: false
          description: CPU utilization, load averages, breakdown, top processes, and recent history.
          required: [usage_percent, cores, load_1, load_5, load_15, history]
          properties:
            usage_percent: { type: number, format: double, minimum: 0, maximum: 100, description: CPU usage percentage. }
            cores: { type: integer, format: int32, minimum: 0, maximum: 65536, description: Logical CPU core count. }
            model: { type: string, maxLength: 160, description: CPU model string from /proc/cpuinfo. }
            user_percent: { type: number, format: double, minimum: 0, maximum: 100, description: User-space CPU percentage. }
            system_percent: { type: number, format: double, minimum: 0, maximum: 100, description: Kernel-space CPU percentage. }
            iowait_percent: { type: number, format: double, minimum: 0, maximum: 100, description: I/O wait CPU percentage. }
            load_1: { type: number, format: double, minimum: 0, description: 1-minute load average. }
            load_5: { type: number, format: double, minimum: 0, description: 5-minute load average. }
            load_15: { type: number, format: double, minimum: 0, description: 15-minute load average. }
            history: { type: array, maxItems: 64, items: { type: number, format: double }, description: Recent CPU usage percentages. }
            top_processes: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/SystemHostProcess' }, description: Top CPU-consuming processes. }
        memory:
          type: object
          additionalProperties: false
          description: Memory and swap utilization with top processes.
          required: [used_bytes, total_bytes, available_bytes, cached_bytes, usage_percent, swap_used_bytes, swap_total_bytes, history]
          properties:
            used_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Used RAM bytes. }
            total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Total RAM bytes. }
            available_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Available RAM bytes. }
            cached_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Buffers and cache bytes. }
            buffers_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Kernel buffer memory bytes. }
            usage_percent: { type: number, format: double, minimum: 0, maximum: 100, description: Memory usage percentage. }
            swap_used_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Used swap bytes. }
            swap_total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Total swap bytes. }
            history: { type: array, maxItems: 64, items: { type: number, format: double }, description: Recent memory usage percentages. }
            top_processes: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/SystemHostProcess' }, description: Top memory-consuming processes. }
        disk:
          type: object
          additionalProperties: false
          description: Primary mount, real-time disk I/O throughput, and monitored filesystem capacities.
          required: [mount, used_bytes, total_bytes, usage_percent, mounts]
          properties:
            mount: { type: string, maxLength: 512, description: Primary mount point. }
            used_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Used bytes on primary mount. }
            total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Total bytes on primary mount. }
            usage_percent: { type: number, format: double, minimum: 0, maximum: 100, description: Disk usage percentage. }
            read_bytes_per_sec: { type: number, format: double, minimum: 0, description: Aggregate block device read throughput in bytes per second. }
            write_bytes_per_sec: { type: number, format: double, minimum: 0, description: Aggregate block device write throughput in bytes per second. }
            mounts:
              type: array
              maxItems: 32
              description: Individual filesystem mounts.
              items:
                type: object
                additionalProperties: false
                required: [mount, used_bytes, total_bytes, usage_percent]
                properties:
                  mount: { type: string, maxLength: 512, description: Mount point path. }
                  device: { type: string, maxLength: 256, description: Backing block device. }
                  used_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Used bytes. }
                  total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Total bytes. }
                  usage_percent: { type: number, format: double, minimum: 0, maximum: 100, description: Usage percentage. }
        network:
          type: object
          additionalProperties: false
          description: Aggregate non-loopback network throughput, active TCP connections, per-interface rates, and cumulative bytes.
          required: [rx_bytes_per_sec, tx_bytes_per_sec, rx_total_bytes, tx_total_bytes, rx_history, tx_history]
          properties:
            rx_bytes_per_sec: { type: number, format: double, minimum: 0, description: Current inbound bytes per second. }
            tx_bytes_per_sec: { type: number, format: double, minimum: 0, description: Current outbound bytes per second. }
            rx_total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Total received bytes. }
            tx_total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Total transmitted bytes. }
            tcp_connections: { type: integer, format: int32, minimum: 0, maximum: 1048576, description: Count of active established TCP connections. }
            rx_history: { type: array, maxItems: 64, items: { type: number, format: double }, description: Recent inbound throughput samples. }
            tx_history: { type: array, maxItems: 64, items: { type: number, format: double }, description: Recent outbound throughput samples. }
            interfaces:
              type: array
              maxItems: 16
              description: Per-interface live throughput and cumulative counters.
              items:
                type: object
                additionalProperties: false
                required: [name, rx_bytes_per_sec, tx_bytes_per_sec, rx_total_bytes, tx_total_bytes]
                properties:
                  name: { type: string, maxLength: 64, description: Network interface name. }
                  rx_bytes_per_sec: { type: number, format: double, minimum: 0, description: Interface inbound bytes per second. }
                  tx_bytes_per_sec: { type: number, format: double, minimum: 0, description: Interface outbound bytes per second. }
                  rx_total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Interface cumulative received bytes. }
                  tx_total_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Interface cumulative transmitted bytes. }
        history_points:
          type: array
          maxItems: 160
          description: Timestamped host resource trend samples for built-in Home charts.
          items:
            type: object
            additionalProperties: false
            required: [ts, cpu, mem, rx_bps, tx_bps]
            properties:
              ts: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Sample Unix timestamp in seconds. }
              cpu: { type: number, format: double, minimum: 0, maximum: 100, description: CPU usage percentage at ts. }
              mem: { type: number, format: double, minimum: 0, maximum: 100, description: Memory usage percentage at ts. }
              rx_bps: { type: number, format: double, minimum: 0, description: Inbound bytes per second at ts. }
              tx_bps: { type: number, format: double, minimum: 0, description: Outbound bytes per second at ts. }
    SecurityTakeoverRequest:
      type: object
      additionalProperties: false
      description: Target coexistence manager for takeover or restoration.
      required: [manager]
      properties:
        manager:
          type: string
          maxLength: 32
          enum: [ufw, firewalld, fail2ban]
          description: System security manager service name.
    SecurityTakeoverEntry:
      type: object
      additionalProperties: false
      description: Coexistence and backup status for one system firewall or brute-force manager.
      required: [manager, active, taken_over, backup_exists, detail]
      properties:
        manager: { type: string, maxLength: 32, enum: [ufw, firewalld, fail2ban], description: Manager identifier. }
        active: { type: boolean, description: Whether the systemd unit is currently active. }
        taken_over: { type: boolean, description: Whether qwq has backed up and taken over this manager. }
        backup_exists: { type: boolean, description: Whether a restorable takeover backup exists on disk. }
        backup_at: { type: string, maxLength: 64, description: RFC 3339 timestamp when the backup was created. }
        imported_ports: { type: array, maxItems: 128, items: { type: integer, format: int32, minimum: 1, maximum: 65535 }, description: Ports imported into inet qwq during takeover. }
        detail: { type: string, maxLength: 512, description: Human-readable status summary. }
    SecurityTakeoverStatus:
      type: object
      additionalProperties: false
      description: Snapshot of all manageable coexistence managers.
      required: [managers]
      properties:
        managers:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SecurityTakeoverEntry' }
          description: Status entries for ufw, firewalld, and fail2ban.
    PluginUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        Replace the active version with the package staged by `POST /api/v1/plugin-packages`. The
        package must belong to the plugin in the path. `expected_revision` guards the active version
        the caller saw. A package from another publisher is refused with `PUBLISHER_CHANGED` unless
        a human session sets `accept_publisher_change`.
      required: [upload_id, accepted_capabilities]
      properties:
        upload_id: { type: string, minLength: 36, maxLength: 36, pattern: '^upl_[0-9a-f]{32}$', description: Opaque id returned by the upload call. }
        accepted_capabilities:
          type: array
          maxItems: 64
          description: Capabilities the user accepted. A capability is identified by name + scope; omitting scope accepts the name only when the manifest declares it under a single scope.
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, maxLength: 64, description: Capability name. }
              scope: { type: string, maxLength: 128, description: Capability scope. }
        expected_revision: { $ref: '#/components/schemas/Revision' }
        accept_publisher_change: { type: boolean, description: Accept that the package has another publisher than the active version. Human sessions only. }
    PluginRollbackRequest:
      type: object
      additionalProperties: false
      description: Optional concurrency guard of a rollback.
      properties:
        expected_revision: { $ref: '#/components/schemas/Revision' }
    PluginLogLine:
      type: object
      additionalProperties: false
      description: One journal line of a plugin; the text is untrusted plugin output.
      required: [at, stream, line]
      properties:
        at: { $ref: '#/components/schemas/Timestamp' }
        stream: { type: string, enum: [stdout, stderr], description: Which output stream the line came from. }
        line: { type: string, maxLength: 4096, x-qwq-untrusted: true, description: The line, truncated at 4 KiB. }
    PluginLogPage:
      type: object
      additionalProperties: false
      description: |
        One page of plugin journal lines, oldest first within the page. `next_cursor` reads what came
        after the last line; `truncated` says more lines were available than this page shows.
      required: [items, truncated]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PluginLogLine' } }
        next_cursor: { $ref: '#/components/schemas/Cursor' }
        truncated: { type: boolean, description: More lines were available than this page shows. }
    PluginRestartRequest:
      type: object
      additionalProperties: false
      description: Optional reason recorded in the audit log of a restart.
      properties:
        reason: { type: string, maxLength: 500, description: Why the plugin is restarted. }
    PluginPackageUploadRequest:
      type: object
      additionalProperties: false
      description: One signed plugin package. The filename is ignored; only the bytes are staged.
      required: [package]
      properties:
        package: { type: string, format: binary, maxLength: 67108864, description: The package file, at most 64 MiB. }
    PluginPackageUpload:
      type: object
      description: A staged package. It is not installed until an install or update call consumes the id.
      required: [upload_id, size, sha256, expires_at]
      properties:
        upload_id: { type: string, minLength: 36, maxLength: 36, pattern: '^upl_[0-9a-f]{32}$', description: Opaque handle for the install or update call. }
        size: { type: integer, format: int64, minimum: 1, maximum: 67108864, description: Package size in bytes. }
        sha256: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$', description: SHA-256 of the package bytes. }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    PluginPackageFetchRequest:
      type: object
      additionalProperties: false
      description: Request body to fetch and stage a signed `.qwqpkg` package from a public HTTPS URL.
      required: [url]
      properties:
        url: { type: string, minLength: 10, maxLength: 2048, pattern: '^https://', description: Public HTTPS URL pointing to a `.qwqpkg` archive. }
        expected_sha256: { type: string, minLength: 64, maxLength: 71, pattern: '^(sha256:)?[a-f0-9]{64}$', description: Optional expected SHA-256 checksum of the downloaded `.qwqpkg` file. }
    PluginTrustKeyCreateRequest:
      type: object
      additionalProperties: false
      description: Request body to add a custom Ed25519 publisher public key to the dynamic trust store.
      required: [label, public_key_pem]
      properties:
        label: { type: string, minLength: 1, maxLength: 120, description: Human-readable label identifying the developer or organization. }
        public_key_pem: { type: string, minLength: 32, maxLength: 4096, description: PKIX `PUBLIC KEY` PEM block of an Ed25519 public key. }
    PluginTrustKey:
      type: object
      additionalProperties: false
      description: One trusted Ed25519 plugin publisher public key.
      required: [key_id, label, source, public_key_pem]
      properties:
        key_id: { type: string, minLength: 72, maxLength: 72, pattern: '^ed25519:[a-f0-9]{64}$', description: Canonical Ed25519 key identifier (`ed25519:` + SHA-256 of raw 32-byte public key). }
        label: { type: string, maxLength: 120, description: Display label of the publisher key. }
        source: { type: string, maxLength: 16, enum: [official, custom], description: Whether the key comes from the read-only system trust root (`official`) or administrator-managed custom keys (`custom`). }
        public_key_pem: { type: string, maxLength: 4096, description: Canonical PKIX `PUBLIC KEY` PEM encoding. }
        added_by: { type: string, maxLength: 64, description: Principal ID of the administrator who added a custom key. }
        added_at: { $ref: '#/components/schemas/Timestamp' }
    PluginTrustKeyList:
      type: object
      additionalProperties: false
      description: List of all active official and custom trusted publisher public keys.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 256
          description: Active trusted publisher keys, official keys first.
          items: { $ref: '#/components/schemas/PluginTrustKey' }
    PluginCatalogItem:
      type: object
      additionalProperties: false
      description: One pre-built official optional plugin available from the release catalog.
      required: [plugin_id, name, summary, version, category, memory_max_mb, dependencies, download_url, size, installed, update_available]
      properties:
        plugin_id: { type: string, minLength: 1, maxLength: 64, description: Canonical plugin identifier. }
        name: { type: string, minLength: 1, maxLength: 120, description: Display name of the plugin. }
        summary: { type: string, maxLength: 512, description: Concise description of the plugin's capabilities. }
        version: { type: string, maxLength: 64, description: Target release version available for download. }
        category: { type: string, maxLength: 32, description: Display category used for store grouping and iconography. }
        memory_max_mb: { type: integer, format: int32, minimum: 0, maximum: 65536, description: Declared cgroup memory cap in MiB. }
        dependencies:
          type: array
          maxItems: 16
          description: Other official plugin IDs that should be installed before this plugin.
          items: { type: string, maxLength: 64 }
        download_url: { type: string, maxLength: 2048, description: Direct HTTPS URL to the signed `.qwqpkg` package for this host's architecture. }
        sha256: { type: string, maxLength: 71, description: Expected SHA-256 digest (`sha256:<hex>`) from `plugins-index.json` when fetched online. }
        size: { type: integer, format: int64, minimum: 0, maximum: 67108864, description: Archive size in bytes when known. }
        installed: { type: boolean, description: Whether this plugin is currently installed on the host. }
        installed_version: { type: string, maxLength: 64, description: Currently active version on this host when installed. }
        installed_revision: { type: string, maxLength: 64, description: Current host revision for optimistic concurrency during updates. }
        update_available: { type: boolean, description: Whether the catalog version differs from the installed version. }
    PluginCatalogResponse:
      type: object
      additionalProperties: false
      description: Official pre-built plugin catalog for the running host's architecture.
      required: [release, platform, source, online, fetched_at, items]
      properties:
        release: { type: string, maxLength: 64, description: Release tag resolved for the catalog (for example `v0.1.11`). }
        platform: { type: string, maxLength: 32, description: Target OS and architecture (`linux/amd64` or `linux/arm64`). }
        source: { type: string, maxLength: 32, enum: [github_release, builtin_fallback], description: Whether metadata came live from the release index or embedded fallback. }
        online: { type: boolean, description: Whether the live release index was successfully reached. }
        fetched_at: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          maxItems: 64
          description: Pre-built official plugins available for one-click install or update.
          items: { $ref: '#/components/schemas/PluginCatalogItem' }
    PluginPackageInspection:
      type: object
      description: |
        The pre-install view of a staged package (GAPS gap 4), produced by verification and parsing
        without installing. All manifest texts are written by the plugin author: untrusted.
      required: [upload_id, size, sha256, expires_at, signature, compatibility, memory, disk]
      properties:
        upload_id: { type: string, minLength: 36, maxLength: 36, pattern: '^upl_[0-9a-f]{32}$', description: Opaque handle of the inspected upload. }
        size: { type: integer, format: int64, minimum: 1, maximum: 67108864, description: Package size in bytes. }
        sha256: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$', description: SHA-256 of the package bytes. }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        signature: { $ref: '#/components/schemas/SignatureCheck' }
        manifest:
          $ref: '#/components/schemas/PluginPackageManifest'
          description: The strictly parsed manifest; absent when the package could not be parsed safely.
        compatibility: { $ref: '#/components/schemas/CompatibilityCheck' }
        memory: { $ref: '#/components/schemas/CapacityCheck' }
        disk: { $ref: '#/components/schemas/CapacityCheck' }
        installed:
          $ref: '#/components/schemas/InstalledPackageVersion'
          description: The active version when the plugin is installed — the package is an update; absent for a fresh install.
    SignatureCheck:
      type: object
      description: The install-time signature verdict of one package.
      required: [valid, key_id, trusted, publisher_id]
      properties:
        valid:
          type: boolean
          description: |
            The signing key verifies the envelope over the manifest bytes and the publisher binding
            holds. `false` with `trusted: true` is a package tampered after signing; `false` with
            `trusted: false` an unknown or absent signing key. Neither installs.
        key_id: { type: string, maxLength: 72, description: Signing key id from the signature envelope; empty when the package carries none. }
        trusted: { type: boolean, description: The signing key is in the host's trust root. }
        publisher_id: { type: string, maxLength: 64, x-qwq-untrusted: true, description: 'Manifest `publisher.id` the package claims; empty when no manifest parsed.' }
    PluginPackageManifest:
      type: object
      description: |
        Preview of the strictly parsed manifest of a staged package. Risk and approval of every
        operation are the values the catalog would publish (capability floors and the ADR-0016
        reachability clamp included). All texts are written by the plugin author: untrusted.
      required: [id, version, name, summary, placement, target, abi, capabilities, connect_sources, operations, ui_routes, widgets]
      properties:
        id: { $ref: '#/components/schemas/PluginId' }
        version: { type: string, maxLength: 64, description: Manifest version the package would install. }
        name: { type: string, maxLength: 64, x-qwq-untrusted: true, description: Manifest `name`. }
        summary: { type: string, maxLength: 120, x-qwq-untrusted: true, description: Manifest `summary`. }
        description: { type: string, maxLength: 2000, x-qwq-untrusted: true, description: Manifest `description`; absent when the author wrote none. }
        placement: { type: string, enum: [node, controller], description: Manifest `placement`. }
        target: { type: string, maxLength: 64, description: 'Manifest `target`, e.g. `linux/amd64`.' }
        abi: { type: string, maxLength: 16, description: 'Required platform ABI, `major.minor`.' }
        capabilities:
          type: array
          maxItems: 64
          description: Capabilities the manifest declares, with the host's sensitivity verdict.
          items: { $ref: '#/components/schemas/PluginCapability' }
        connect_sources:
          type: array
          maxItems: 16
          description: CSP `connect-src` origins the plugin UI declared.
          items: { type: string, maxLength: 128 }
        resources: { $ref: '#/components/schemas/PluginResources' }
        operations:
          type: array
          maxItems: 256
          description: Operations of the manifest with the host's effective risk and approval.
          items: { $ref: '#/components/schemas/PackageOperationPreview' }
        ui_routes: { type: integer, format: int32, minimum: 0, maximum: 64, description: Number of UI routes the manifest declares. }
        widgets: { type: integer, format: int32, minimum: 0, maximum: 16, description: Number of overview widgets the manifest declares. }
    PackageOperationPreview:
      type: object
      description: One operation of an inspected package, with the host's effective risk and approval.
      required: [name, summary, effect, risk]
      properties:
        name: { $ref: '#/components/schemas/OperationName' }
        summary: { type: string, maxLength: 120, x-qwq-untrusted: true, description: One-line summary; untrusted. }
        effect: { $ref: '#/components/schemas/Effect' }
        risk: { $ref: '#/components/schemas/RiskLevel' }
        approval: { $ref: '#/components/schemas/ApprovalLevel' }
        reachability:
          type: boolean
          description: |
            The operation can cut the administrator off from the server or the panel; the host
            clamps its risk to `high` and its approval to at least `ai_confirm` (ADR-0016). Absent
            when false.
    CompatibilityCheck:
      type: object
      description: Install-time compatibility of the package; `ok` is false exactly when `problems` is non-empty.
      required: [ok, problems]
      properties:
        ok: { type: boolean, description: An install would accept the package's manifest and content. }
        problems:
          type: array
          maxItems: 32
          description: Field violations the install would refuse with (schema version, publisher binding, extraction policy).
          items: { $ref: '#/components/schemas/FieldViolation' }
    CapacityCheck:
      type: object
      description: One capacity preflight of the install, in integer megabytes.
      required: [required_mb, available_mb, ok]
      properties:
        required_mb: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: What the package needs. }
        available_mb: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: What the host has; 0 when the source is unreadable. }
        ok: { type: boolean, description: The host has room, reserve included. }
    InstalledPackageVersion:
      type: object
      description: The active version of the plugin an inspected package would update.
      required: [version, revision]
      properties:
        version: { type: string, maxLength: 64, description: Version currently ACTIVE. }
        revision: { $ref: '#/components/schemas/Revision' }
    PluginUpdateResult:
      type: object
      description: The committed saga of an install, update or rollback.
      required: [saga_id, plugin_id, to_version, strategy, state, restarted, version]
      properties:
        saga_id: { $ref: '#/components/schemas/ResourceId' }
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        from_version: { type: string, maxLength: 64, description: Version replaced by the saga; absent for a fresh install. }
        to_version: { type: string, maxLength: 64, description: Version the saga activated. }
        strategy: { type: string, enum: [overlap, restart, install], description: Update strategy (ARCH §6.3). }
        state: { type: string, enum: [RUNNING, COMMITTED, ROLLED_BACK, FAILED], description: Saga state. }
        restarted: { type: boolean, description: The service was briefly down because the restart strategy ran. }
        version: { $ref: '#/components/schemas/PluginVersion' }
    PluginConfig:
      type: object
      description: |
        One immutable plugin configuration revision. Sensitive values are redacted on export and
        stored only as secret references.
      required: [plugin_id, revision, config, active]
      properties:
        plugin_id: { $ref: '#/components/schemas/PluginId' }
        revision: { $ref: '#/components/schemas/Revision' }
        config: { type: object, description: The configuration object; sensitive values are redacted. }
        active: { type: boolean, description: This revision is the applied one. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        applied_at: { $ref: '#/components/schemas/Timestamp' }
    PluginConfigRequest:
      type: object
      additionalProperties: false
      description: |
        One configuration snapshot. Values the plugin schema marks `writeOnly` or `x-secret` are
        moved into the host secret store before the snapshot is stored.
      required: [config]
      properties:
        config: { type: object, description: The complete configuration object. }
        expected_revision: { $ref: '#/components/schemas/Revision' }
    PluginInvokeRequest:
      type: object
      additionalProperties: false
      description: |
        Envelope of a plugin operation call. `payload` follows the operation's request schema.
        `expected_revision` adds a precondition on `subject` (relative to the plugin instance, e.g.
        `alerts/cpu`), which the plugin checks atomically. `plan_id` binds the call to an earlier
        plan: the payload must match the plan's `args_digest` and the plan's preconditions apply.
      required: [payload]
      properties:
        payload: { type: object, description: Operation arguments; validated against the manifest schema. }
        subject: { type: string, maxLength: 256, pattern: '^[A-Za-z0-9._~:@-]+(/[A-Za-z0-9._~:@-]+)*$', description: Plugin-relative subject the call modifies. }
        expected_revision: { $ref: '#/components/schemas/Revision' }
        plan_id: { $ref: '#/components/schemas/ResourceId' }
    # ------------------------------------------------------------ users
    Role:
      type: string
      enum: [admin, operator, viewer]
      x-qwq-extensible-enum: true
      description: Built-in roles (ADR-0005 Q7). Custom roles may be added later.
    Username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9._-]*$'
      description: Login name, lower case.
    User:
      type: object
      description: A panel user. Credentials and TOTP secrets are never returned.
      required: [user_id, username, role, mfa_enabled, disabled, created_at, updated_at, revision]
      properties:
        user_id: { $ref: '#/components/schemas/ResourceId' }
        username: { $ref: '#/components/schemas/Username' }
        display_name: { type: string, maxLength: 64, description: Display name. }
        role: { $ref: '#/components/schemas/Role' }
        mfa_enabled: { type: boolean, description: TOTP is enrolled. }
        disabled: { type: boolean, description: The user cannot log in; sessions and delegations are revoked. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    UserList:
      description: A page of users.
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/User' }, description: Users. }
    UserCreateRequest:
      type: object
      additionalProperties: false
      description: New user. The user chooses the password with a one-time enrollment link (`POST /api/v1/users/{user_id}/enrollment-token`).
      required: [username, role]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        display_name: { type: string, maxLength: 64, description: Display name. }
        role: { $ref: '#/components/schemas/Role' }
    RenewalServiceBootstrapRequest:
      type: object
      additionalProperties: false
      description: A confirmed private renewal policy; the host supplies its exact account scope.
      required: [policy_id, expected_revision]
      properties:
        policy_id: { $ref: '#/components/schemas/ResourceId' }
        expected_revision: { $ref: '#/components/schemas/Revision' }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      description: Members to change; absent members are unchanged.
      required: [expected_revision]
      minProperties: 2
      properties:
        expected_revision: { $ref: '#/components/schemas/Revision' }
        display_name: { type: string, maxLength: 64, description: Display name. }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean, description: Disable or re-enable the user. }
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      description: The caller's new display name.
      required: [display_name, expected_revision]
      properties:
        display_name: { type: string, maxLength: 64, description: Display name; empty clears it. }
        expected_revision: { $ref: '#/components/schemas/Revision' }
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      description: The second factor that makes the request fresh; `{}` when the session passed one recently.
      properties:
        mfa_code: { type: string, maxLength: 6, pattern: '^[0-9]{6}$', writeOnly: true, description: Current TOTP code; required unless the session passed a second factor recently. }
    EnrollmentToken:
      type: object
      description: The one-time enrollment link of a user who has no password yet.
      required: [user_id, expires_at]
      properties:
        user_id: { $ref: '#/components/schemas/ResourceId' }
        enrollment_token: { type: string, maxLength: 128, description: 'Token of the link; only in the issuing response, absent in idempotent replays.' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    # ------------------------------------------------------------ sessions and setup
    Password:
      type: string
      minLength: 12
      maxLength: 256
      writeOnly: true
      description: Password; hashed with argon2id, never stored or logged in clear.
    LoginRequest:
      type: object
      additionalProperties: false
      description: Password login.
      required: [username, password]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { type: string, minLength: 1, maxLength: 256, writeOnly: true, description: The user's password. }
    MfaChallenge:
      type: object
      description: Login needs a second factor; no session exists yet.
      required: [status, challenge_id, methods, expires_at]
      properties:
        status: { type: string, const: mfa_required, description: Discriminator. }
        challenge_id: { type: string, maxLength: 128, description: Single-use challenge to answer. }
        methods: { type: array, maxItems: 4, items: { type: string, enum: [totp, recovery_code] }, description: Accepted second factors. }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      description: Answer to an `MfaChallenge`.
      required: [challenge_id, method, code]
      properties:
        challenge_id: { type: string, maxLength: 128, description: From the challenge. }
        method: { type: string, enum: [totp, recovery_code], description: Which factor `code` is. }
        code: { type: string, minLength: 6, maxLength: 32, writeOnly: true, description: TOTP code or recovery code. }
    Session:
      type: object
      description: The signed-in browser session. The session ID itself is only in the cookie.
      required: [status, user, csrf_token, created_at, idle_expires_at, expires_at]
      properties:
        status: { type: string, const: authenticated, description: Discriminator. }
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string, maxLength: 128, description: Send as `X-CSRF-Token` on non-GET requests; keep in memory only. }
        mfa_verified_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        idle_expires_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    SetupStatus:
      type: object
      description: Whether first-time setup is still possible.
      required: [initialized]
      properties:
        initialized: { type: boolean, description: An administrator exists; setup is closed. }
        tls_fingerprint: { type: string, maxLength: 128, description: 'SHA-256 fingerprint of a self-signed certificate, for comparison with the installer output.' }
    SetupRequest:
      type: object
      additionalProperties: false
      description: First administrator.
      required: [setup_token, username, password]
      properties:
        setup_token: { type: string, minLength: 32, maxLength: 128, writeOnly: true, description: The one-time token from the installer output. }
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/Password' }
        display_name: { type: string, maxLength: 64, description: Display name. }
    TotpEnrollment:
      type: object
      description: A pending TOTP secret; shown once, for the QR code and for manual entry.
      required: [secret, otpauth_url, expires_at]
      properties:
        secret: { type: string, maxLength: 128, description: Base32 secret without padding. }
        otpauth_url: { type: string, maxLength: 512, description: '`otpauth://totp/...` URL for the QR code.' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    TotpCodeRequest:
      type: object
      additionalProperties: false
      description: A second-factor code.
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 32, writeOnly: true, description: TOTP code, or a recovery code where the route accepts one. }
    TotpConfirmResult:
      type: object
      description: The second factor is on.
      required: [recovery_codes, user, session]
      properties:
        recovery_codes:
          type: array
          maxItems: 32
          description: One-time recovery codes; shown only in this response.
          items: { type: string, maxLength: 32 }
        user: { $ref: '#/components/schemas/User' }
        session: { $ref: '#/components/schemas/Session' }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      description: Change of the caller's own password.
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 256, writeOnly: true, description: The current password. }
        new_password: { $ref: '#/components/schemas/Password' }
    EnrollmentRedeemRequest:
      type: object
      additionalProperties: false
      description: Redemption of an enrollment link.
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 128, writeOnly: true, description: Token of the enrollment link. }
        password: { $ref: '#/components/schemas/Password' }
    PrivateExportPrepareRequest:
      type: object
      additionalProperties: false
      description: Exact producer and resource of a private handoff, without any private material.
      required: [action, plugin_id, instance_id, node_id, purpose, subject]
      properties:
        action: { type: string, maxLength: 128, description: Current catalog action whose permission is required. }
        plugin_id: { type: string, maxLength: 26, description: The verified producer plugin. }
        instance_id: { type: string, maxLength: 26, description: The producer instance. }
        node_id: { $ref: '#/components/schemas/NodeId' }
        purpose: { type: string, enum: [ssh.private-key], description: Supported private handoff purpose. }
        subject: { type: string, maxLength: 128, description: Controlled account/user/keys resource identifier; never a path. }
    PrivateExportGrant:
      type: object
      additionalProperties: false
      description: A temporary grant bound to the original live human session.
      required: [export_id, status, expires_at]
      properties:
        export_id: { type: string, maxLength: 64, description: Opaque export ID; never an internal secret reference. }
        status: { type: string, enum: [PREPARED], description: Generation has not yet started. }
        expires_at: { type: string, format: date-time, description: Absolute five-minute handoff expiry. }
    HealthStatus:
      type: object
      description: Probe result without internal detail.
      required: [status]
      properties:
        status: { type: string, enum: [ok], description: Always `ok` with a 200 response. }
    # ------------------------------------------------------------ delegations
    DelegationPolicy:
      type: object
      additionalProperties: false
      description: |
        Upper bound on what the token may do; always intersected with the owner's RBAC and plugin
        capabilities. Defaults follow ADR-0004 D6: reads run, `low` runs and notifies,
        `medium`/`high` need approval, destructive approvals need MFA.
      properties:
        actions:
          type: array
          maxItems: 256
          uniqueItems: true
          description: Allowed action ID patterns; `*` matches one segment, e.g. `com.example.monitor/*`. Absent = all.
          items: { type: string, maxLength: 200, pattern: '^[a-z0-9.*_/-]+$' }
        node_ids: { type: array, maxItems: 1000, uniqueItems: true, items: { $ref: '#/components/schemas/NodeId' }, description: Allowed nodes; absent = all the owner may access. }
        auto_approve_max_risk:
          type: string
          enum: [none, low]
          default: low
          description: Highest effective risk that runs without approval. `medium` and `high` always need approval.
        on_approval_required:
          type: string
          enum: [queue, fail]
          default: queue
          description: '`queue`: create the operation in `AWAITING_APPROVAL`; `fail`: return `403 APPROVAL_REQUIRED` instead.'
        requests_per_minute: { type: integer, format: int32, minimum: 1, maximum: 600, default: 60, description: Rate limit of the token. }
    Delegation:
      type: object
      description: A delegation of a user's authority to an AI operator.
      required: [delegation_id, label, owner_id, policy, status, created_at, expires_at, revision]
      properties:
        delegation_id: { $ref: '#/components/schemas/ResourceId' }
        label: { type: string, maxLength: 64, description: 'Shown in the actor name, e.g. "Claude desktop".' }
        owner_id: { type: string, maxLength: 64, description: User whose authority is delegated. }
        policy: { $ref: '#/components/schemas/DelegationPolicy' }
        status: { type: string, enum: [active, suspended, expired], description: Revoked delegations are deleted. }
        token_prefix: { type: string, maxLength: 16, description: 'First characters of the token, for recognition.' }
        last_used_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    DelegationCreated:
      description: The new delegation and, once, its token.
      allOf:
        - $ref: '#/components/schemas/Delegation'
        - type: object
          properties:
            token: { type: string, maxLength: 256, description: 'Bearer token `qwq_dlg_...`; absent in idempotent replays.' }
    DelegationList:
      description: A page of delegations.
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Delegation' }, description: Delegations. }
    DelegationCreateRequest:
      type: object
      additionalProperties: false
      description: New delegation.
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 64, description: Name of the AI client. }
        policy: { $ref: '#/components/schemas/DelegationPolicy' }
        ttl_seconds: { type: integer, format: int32, minimum: 300, maximum: 7776000, default: 2592000, description: Lifetime; default 30 days. }
    DelegationUpdateRequest:
      type: object
      additionalProperties: false
      description: Members to change; absent members are unchanged. A policy can only be narrowed or replaced.
      required: [expected_revision]
      minProperties: 2
      properties:
        expected_revision: { $ref: '#/components/schemas/Revision' }
        status: { type: string, enum: [active, suspended], description: Suspend or resume. }
        policy: { $ref: '#/components/schemas/DelegationPolicy' }
    # ------------------------------------------------------------ events
    Event:
      type: object
      description: |
        Event envelope; mirrors proto `Event` (ARCH §4.2). All fields except `type`, `schema_version`,
        `subject` and `payload` are assigned by the host. Plugin event types are prefixed with the
        plugin ID (`<plugin_id>.<type>`), and their `subject` and `payload` are untrusted.
      required: [event_id, sequence, type, schema_version, subject, occurred_at, delivery_class, payload]
      properties:
        event_id: { type: string, maxLength: 64, description: Unique ID; deduplicate on it. }
        sequence: { $ref: '#/components/schemas/Sequence' }
        type: { type: string, maxLength: 128, pattern: '^[a-z][a-z0-9_.-]*$', description: 'Event type, e.g. `resource.changed`.' }
        schema_version: { type: string, maxLength: 16, description: Version of the payload schema for this type. }
        subject: { $ref: '#/components/schemas/Subject' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        actor: { $ref: '#/components/schemas/Actor' }
        node_id: { $ref: '#/components/schemas/NodeId' }
        trace_id: { type: string, maxLength: 64, description: Trace correlation ID. }
        operation_id: { type: string, maxLength: 64, description: Operation that caused the event. }
        delivery_class: { type: string, enum: [lossy_realtime, reliable], description: From the host topic policy. }
        payload: { type: object, x-qwq-untrusted: true, description: 'Type-specific payload; see `ResourceChangedPayload`, `OperationUpdatedPayload` and the `AgentSessionUpdatedPayload` / `AgentSessionAttentionPayload` pair. Untrusted for plugin event types.' }
    AgentSessionUpdatedPayload:
      type: object
      description: |
        `agent.session.updated` (gap 6): a committed status change of one agent session. The event
        is delivered to the session's owner alone, and the payload never carries the title, message
        content or tool arguments — the session event stream (`GET /api/v1/agent-sessions/{id}/events`)
        is the channel for those. `revision` is the session revision the change committed.
      required: [session_id, status, pending_approvals, last_seq, revision]
      properties:
        session_id: { $ref: '#/components/schemas/ResourceId' }
        status: { $ref: '#/components/schemas/AgentSessionStatus' }
        previous_status: { $ref: '#/components/schemas/AgentSessionStatus' }
        pending_approvals: { type: integer, format: int32, minimum: 0, maximum: 1000, description: Tool calls waiting for a human decision at commit time. }
        last_seq: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Highest session sequence at commit time. }
        last_message_at: { $ref: '#/components/schemas/Timestamp' }
        revision: { $ref: '#/components/schemas/Revision' }
    AgentSessionAttentionPayload:
      type: object
      description: |
        `agent.session.attention` (gap 6): the session needs its owner (`waiting_approval` or
        `failed`). Delivered to the owner alone, right after the `agent.session.updated` of the
        same commit, which shares its `revision`.
      required: [session_id, status, revision]
      properties:
        session_id: { $ref: '#/components/schemas/ResourceId' }
        status: { type: string, enum: [waiting_approval, failed], description: Why the owner is needed. }
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        revision: { $ref: '#/components/schemas/Revision' }
    ResourceChangedPayload:
      type: object
      description: |
        `resource.changed` (ADR-0004 D3), written in the same transaction as the change.
        `changed_pointers` lists the JSON Pointers that changed (empty for create and delete), so
        clients refetch exactly those with `fields`.
      required: [subject, revision, kind, actor, changed_pointers]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        revision: { $ref: '#/components/schemas/Revision' }
        kind: { type: string, enum: [create, update, delete], description: What happened to the subject. }
        actor: { $ref: '#/components/schemas/Actor' }
        operation_id: { type: string, maxLength: 64, description: Operation that made the change. }
        changed_pointers: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/JsonPointer' }, description: Changed members. }
        changed_pointers_truncated: { type: boolean, description: More members changed than listed; refetch the whole subject. }
    OperationUpdatedPayload:
      type: object
      description: |
        `operation.updated`: status or progress change. Carries what follow mode and the task drawer
        need; fetch the operation for `result`.
      required: [operation_id, action, status, attempt, actor, revision]
      properties:
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        action: { $ref: '#/components/schemas/ActionId' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        previous_status: { $ref: '#/components/schemas/OperationStatus' }
        attempt: { type: integer, format: int32, minimum: 1, maximum: 1000, description: Execution attempt. }
        actor: { $ref: '#/components/schemas/Actor' }
        target: { $ref: '#/components/schemas/Target' }
        effective_risk: { $ref: '#/components/schemas/RiskLevel' }
        approval_id: { $ref: '#/components/schemas/ResourceId' }
        progress: { $ref: '#/components/schemas/OperationProgress' }
        ui_route: { type: string, maxLength: 128, description: 'Shell route of the action, for follow mode.' }
        error: { $ref: '#/components/schemas/Problem' }
        revision: { $ref: '#/components/schemas/Revision' }
    ResourceChangedEvent:
      description: Envelope of a `resource.changed` event.
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, const: resource.changed, description: Event type. }
            payload: { $ref: '#/components/schemas/ResourceChangedPayload' }
    OperationUpdatedEvent:
      description: Envelope of an `operation.updated` event.
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, const: operation.updated, description: Event type. }
            payload: { $ref: '#/components/schemas/OperationUpdatedPayload' }
    AgentSessionUpdatedEvent:
      description: Envelope of an `agent.session.updated` event; delivered to the session's owner only.
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, const: agent.session.updated, description: Event type. }
            payload: { $ref: '#/components/schemas/AgentSessionUpdatedPayload' }
    AgentSessionAttentionEvent:
      description: Envelope of an `agent.session.attention` event; delivered to the session's owner only.
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, const: agent.session.attention, description: Event type. }
            payload: { $ref: '#/components/schemas/AgentSessionAttentionPayload' }
    StreamReady:
      type: object
      description: '`event: ready` data.'
      required: [head_sequence, heartbeat_seconds]
      properties:
        head_sequence: { $ref: '#/components/schemas/Sequence' }
        heartbeat_seconds: { type: integer, format: int32, minimum: 1, maximum: 29, description: Heartbeat interval. }
    StreamHeartbeat:
      type: object
      description: '`event: heartbeat` data.'
      required: [head_sequence, server_time]
      properties:
        head_sequence: { $ref: '#/components/schemas/Sequence' }
        server_time: { $ref: '#/components/schemas/Timestamp' }
    StreamResync:
      type: object
      description: '`event: resync` data: reload snapshots, then continue after `head_sequence`.'
      required: [reason, head_sequence]
      properties:
        reason: { type: string, enum: [retention_exceeded, buffer_overflow, server_restart], description: Why events were lost. }
        head_sequence: { $ref: '#/components/schemas/Sequence' }
        topics: { type: array, maxItems: 16, items: { type: string, maxLength: 128 }, description: Affected topics; absent = all subscribed. }
    StreamFrame:
      type: object
      description: |
        One SSE frame. On the wire each member is a field line (`event:`, `id:`, `retry:`, `data:`);
        `data` is a single line of JSON. Domain events have no `event` and carry `id`; control frames
        (`ready`, `heartbeat`, `resync`) have `event` and no `id`, so they never move `Last-Event-ID`.
      required: [data]
      properties:
        event: { type: string, enum: [ready, heartbeat, resync], description: Control frame name; absent for domain events. }
        id: { $ref: '#/components/schemas/Sequence' }
        retry: { type: integer, format: int32, minimum: 1000, maximum: 60000, description: Reconnect delay in milliseconds. }
        data:
          description: JSON data of the frame.
          anyOf:
            - $ref: '#/components/schemas/ResourceChangedEvent'
            - $ref: '#/components/schemas/OperationUpdatedEvent'
            - $ref: '#/components/schemas/AgentSessionUpdatedEvent'
            - $ref: '#/components/schemas/AgentSessionAttentionEvent'
            - $ref: '#/components/schemas/Event'
            - $ref: '#/components/schemas/StreamReady'
            - $ref: '#/components/schemas/StreamHeartbeat'
            - $ref: '#/components/schemas/StreamResync'
    # ------------------------------------------------------------ agent tools
    FindActionsRequest:
      type: object
      additionalProperties: false
      description: Parameters of the `find_actions` tool.
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 200, description: 'Keywords, e.g. "enable firewall".' }
        scope:
          type: object
          additionalProperties: false
          description: Optional filters.
          properties:
            plugin_id: { $ref: '#/components/schemas/PluginId' }
            node_id: { $ref: '#/components/schemas/NodeId' }
            effect: { $ref: '#/components/schemas/Effect' }
        limit: { type: integer, format: int32, minimum: 1, maximum: 20, default: 8, description: Maximum entries. }
    FindActionsResponse:
      type: object
      description: Search result.
      required: [actions, truncated]
      properties:
        actions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ActionSummary' }, description: Best matches first. }
        truncated: { type: boolean, description: More matches exist; refine the query or raise `limit`. }
    DescribeActionRequest:
      type: object
      additionalProperties: false
      description: Parameters of the `describe_action` tool.
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/ActionId' }
        include_docs: { type: boolean, default: false, description: Include the plugin's bundled docs. }
        include_result_schema:
          type: boolean
          default: false
          description: |
            Include `result_schema`. Off by default: host result schemas embed Operation and Problem
            (about 11 KB versus 0.6-1.2 KB for `args_schema`), and a caller rarely needs them before
            the call.
    ActionDescription:
      type: object
      description: |
        Everything needed to call an action. `args_schema` and `result_schema` are JSON Schema
        2020-12; for plugin actions they come from the package and are untrusted data. `args_schema`
        is the plain argument schema: `x-qwq-*` extension members are not kept in it. `target`
        says which `Target` members `plan`/`execute` need. MCP hints follow from `effect` and
        `idempotent` (`read` → readOnlyHint, `destructive` → destructiveHint).
      required: [action, target, args_schema]
      properties:
        action: { $ref: '#/components/schemas/ActionMeta' }
        target:
          type: object
          description: Required target members.
          properties:
            node_id: { type: boolean, description: '`target.node_id` is required.' }
            plugin_id: { type: boolean, description: '`target.plugin_id` is required.' }
            instance_id: { type: boolean, description: '`target.instance_id` is required.' }
            subject: { type: boolean, description: '`target.subject` is required.' }
        args_schema: { type: object, x-qwq-untrusted: true, description: JSON Schema of `args`. }
        result_schema: { type: object, x-qwq-untrusted: true, description: 'JSON Schema of `result`; returned only when `include_result_schema=true`.' }
        examples:
          type: array
          maxItems: 5
          x-qwq-untrusted: true
          description: Example argument objects.
          items: { type: object }
        docs: { type: string, maxLength: 16384, x-qwq-untrusted: true, description: 'Bundled Markdown docs, possibly truncated.' }
        docs_truncated: { type: boolean, description: '`docs` was cut at the size limit.' }
    ReadRequest:
      type: object
      additionalProperties: false
      description: Parameters of the `read` tool.
      required: [subject]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        fields: { type: array, maxItems: 32, uniqueItems: true, items: { $ref: '#/components/schemas/JsonPointer' }, description: JSON Pointers to return; absent = everything. }
        since_revision: { $ref: '#/components/schemas/Revision' }
        cursor: { $ref: '#/components/schemas/Cursor' }
        limit: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20, description: Collection page size. }
    ReadResponse:
      type: object
      description: |
        Exactly one of `values` (single resource) or `items` (collection) is present, unless
        `unchanged=true`. All string content that originates from plugins or nodes is untrusted.
      required: [subject, revision]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        revision: { $ref: '#/components/schemas/Revision' }
        unchanged: { type: boolean, description: The resource still has `since_revision`; nothing else is returned. }
        values:
          type: object
          x-qwq-untrusted: true
          description: Single resource. Keys are the requested JSON Pointers (`""` = whole resource).
          additionalProperties: true
        missing: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/JsonPointer' }, description: Requested pointers that do not exist. }
        items:
          type: array
          maxItems: 100
          x-qwq-untrusted: true
          description: Collection members, projected by `fields`.
          items: { type: object }
        delta: { type: boolean, description: Collections only; see `ListMeta.delta`. }
        deleted_ids: { type: array, maxItems: 1000, items: { type: string, maxLength: 128 }, description: Collections with `delta=true`. }
        next_cursor: { $ref: '#/components/schemas/Cursor' }
        truncated:
          type: object
          description: Present when a limit cut the response.
          required: [reason]
          properties:
            reason: { type: string, enum: [max_items, max_bytes], description: Which limit was hit. }
            returned: { type: integer, format: int32, minimum: 0, maximum: 1048576, description: Items or bytes returned. }
            hint: { type: string, maxLength: 200, description: 'Host-written advice, e.g. "pass next_cursor or narrow fields".' }
    ExecuteRequest:
      type: object
      additionalProperties: false
      description: |
        Parameters of the `execute` tool: either `plan_id`, or `action` + `args` (+ `target`,
        `expected_revision`). Not a `oneOf`, because function-calling APIs need a plain object schema;
        the host enforces the rule and answers `400 VALIDATION_FAILED`.
      properties:
        plan_id: { $ref: '#/components/schemas/ResourceId' }
        action: { $ref: '#/components/schemas/ActionId' }
        args: { type: object, description: Action arguments. }
        target: { $ref: '#/components/schemas/TargetInput' }
        expected_revision: { $ref: '#/components/schemas/Revision' }
    WaitRequest:
      type: object
      additionalProperties: false
      description: Parameters of the `wait` tool.
      required: [operation_id]
      properties:
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        timeout_seconds: { type: integer, format: int32, minimum: 1, maximum: 55, default: 25, description: Maximum wait. }
    AgentCancelRequest:
      type: object
      additionalProperties: false
      description: Parameters of the `cancel` tool.
      required: [operation_id]
      properties:
        operation_id: { $ref: '#/components/schemas/ResourceId' }
        reason: { type: string, maxLength: 500, description: Recorded in the audit log. }
