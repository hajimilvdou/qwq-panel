        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: logoutAgentCore
      tags: [agent-sessions]
      summary: Cancel active login or clear persisted official login credentials for an external CLI core
      description: Cancels any in-flight login process and removes persisted official OAuth/token credentials for the specified external CLI core. Administrators only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Idempotent DELETE clearing local CLI login state.
      x-qwq-action-exempt: Interactive CLI credential logout and subprocess teardown.
      responses:
        '200':
          description: Updated core authentication state after logout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCoreAuthStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
