        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/system/backups/{filename}:
    get:
      operationId: downloadSystemBackup
      tags: [system]
      summary: Download a system backup archive
      description: Streams a validated backup tar.gz archive from the backups directory with Cache-Control no-store. Administrators only.
      security:
        - sessionCookie: []
      parameters:
        - name: filename
          in: path
          required: true
          description: Exact backup archive filename matching qwq-<timestamp>.tar.gz.
          schema:
            type: string
            maxLength: 64
            pattern: '^qwq-[0-9]{8}T[0-9]{6}(\.[0-9]{3})?Z\.tar\.gz$'
      responses:
        '200':
          description: The backup tar.gz archive; Cache-Control is no-store.
          content:
            application/gzip:
              schema: { type: string, format: binary, description: The consistent host backup archive. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/system/support-bundle:
