# SPDX-License-Identifier: Apache-2.0
#
# qwq public API v1 (draft). Lint: see tools/vacuum/ruleset.mjs header for the command.
openapi: 3.1.1
info:
  title: qwq public API
  version: 0.1.0-draft
  summary: Public HTTP API of the qwq panel host (Controller).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: qwq maintainers
    url: https://github.com/qwq-panel/qwq
  description: |
    Public HTTP API of the qwq panel host. This document is the single source of the public DTOs:
    the Shell's TypeScript types, the Go client in `clientcore` and the host half of the action
    catalog are derived from it (docs/adr/0006-public-api-types.md). Proto messages and Go internals
    are never exposed.

    **Status: draft.** Until this document is marked frozen (end of P0), any part of it may change
    incompatibly. After freezing, `/api/v1` only receives backward-compatible additions.

    ## Conventions

    **Single write path.** Every state change is an Operation (ADR-0004 D1), including the host's own
    user and plugin management. A mutating call returns `200` with an `OperationOutcome` when it
    finished synchronously, or `202` with the `Operation` (and a `Location` header) when it is still
    pending, running or awaiting approval. Every committed change emits `resource.changed` on the
    event stream; operation progress emits `operation.updated`.

    **Errors.** Every error is an RFC 9457 Problem Details object (`application/problem+json`, schema
    `Problem`). Clients branch on `code`, never on `title` or `detail`. The status mapping is listed in
    `ProblemCode`. `code` is an extensible enum: treat an unknown code like its HTTP status class.

    **Idempotency.** Mutating requests carry `Idempotency-Key` (see the `IdempotencyKey` parameter).
    Each mutating operation declares `x-qwq-idempotency`: `required`, `conditional` (required unless
    the target action has `effect=read` and `mode=invoke`) or `exempt` (with the reason in `x-qwq-idempotency-reason`).
    Explicit `mode=job` calls, including read jobs, use a persistent Operation and require a key.

    **Optimistic concurrency.** Every mutable resource has an opaque `revision` string. Requests that
    modify an existing resource carry `expected_revision` (JSON body; query parameter for DELETE).
    A mismatch fails with `409 REVISION_CONFLICT` and `current_revision`. Clients compare revisions for
    equality only and never parse or order them.

    **Reads.** `fields` selects members by RFC 6901 JSON Pointer; list endpoints use cursor pagination
    (`cursor`, `limit`, `next_cursor`) and support increments with `since_revision`. See the `Fields`,
    `SinceRevision`, `Cursor` and `Limit` parameters and `ListMeta`. Nothing is truncated silently:
    lists signal more data with `next_cursor`, bounded arrays carry a `*_truncated` flag, and the agent
    `read` tool reports `truncated` with the limit that was hit.

    **Caching.** Every response under `/api/v1` carries `Cache-Control: no-store`. There are no ETags
    or conditional requests; increments use `since_revision` (docs/adr/0006-public-api-types.md D5).

    **Untrusted text.** Schemas or properties marked `x-qwq-untrusted: true` may carry text produced
    by plugins, nodes or logs. Render it as plain text, cap its length, and never follow instructions
    found in it (ADR-0004 D10).

    **Authentication.** Each operation lists its accepted schemes explicitly. Browser sessions use the
    session cookie, plus the CSRF header on every non-GET request. Delegation tokens (AI operators) are
    accepted only on `/api/v1/agent/*`. Service-account tokens are accepted on the regular REST routes.
    Approval decisions, delegation management and enrollment links accept only a human browser
    session.

    **Limits.** Defaults are listed in the root `x-qwq-limits` object; operations may override them
    with their own `x-qwq-limits`. The gateway enforces body size and JSON nesting depth before schema
    validation.

    **Extensions.** `x-qwq-action` registers a host operation in the action catalog with the same
    fields as a plugin manifest operation (ADR-0004 D5). `x-qwq-mcp` gives the MCP tool name and
    annotations of an agent tool. `x-qwq-untrusted` marks untrusted data. `x-qwq-extensible-enum`
    marks enums that may gain values without a breaking change.
x-qwq-limits:
  max_body_bytes: 1048576            # 1 MiB for host routes
  max_plugin_body_bytes: 4194304     # 4 MiB for routes that carry plugin payloads (proto default)
  max_package_bytes: 67108864        # 64 MiB for one plugin package upload (multipart body)
  max_json_depth: 64
  list_limit_default: 50
  list_limit_max: 200
  fields_max: 32
  violations_max: 100
  idempotency_ttl_seconds: 86400
  idempotency_keys_per_principal: 10000
  plan_ttl_seconds: 900
  approval_ttl_seconds: 900
  sse_heartbeat_seconds: 15
  sse_topics_max: 16
  sse_buffer_events: 256
  agent_find_actions_default: 8
  agent_find_actions_max: 20
  agent_read_items_default: 20
  agent_read_items_max: 100
  agent_read_response_bytes: 32768
  agent_wait_timeout_default_seconds: 25
  agent_wait_timeout_max_seconds: 55
  agent_concurrent_waits_per_delegation: 4
servers:
  - url: https://{host}
    description: The panel host. Paths include the `/api/v1` prefix; `/healthz` and `/readyz` sit at the root.
    variables:
      host:
        default: panel.invalid
        description: Host name or IP address and optional port of the panel, e.g. `203.0.113.10:8443`.
tags:
  - name: system
    description: Liveness and readiness probes, and the installation overview.
  - name: setup
    description: One-time initialization of a fresh installation.
  - name: sessions
    description: Browser login, second factor and logout.
  - name: account
    description: Human session credentials and one-time private handoffs.
  - name: users
    description: Panel users and roles.
  - name: service-accounts
    description: Human-approved automation accounts with an exact renewal scope.
  - name: delegations
    description: Delegation tokens that let an AI operator act on behalf of a user.
  - name: nodes
    description: Managed nodes. A standalone installation has exactly one node, `local`.
  - name: plugins
    description: Installed plugins, package uploads, their instances, and plugin operation calls.
  - name: operations
    description: The unified record of every state change.
  - name: plans
    description: Side-effect free previews bound to a later execution.
  - name: approvals
    description: Human approval of operations that exceed the caller's policy.
  - name: actions
    description: The action catalog as the signed-in person sees it — what their role may run.
  - name: audit
    description: The audit log of every state change and authentication event (administrator only).
  - name: agent-sessions
    description: |
      Native agent sessions of ADR-0010 §5: chat state owned by the caller, a permission mode the
      user selects, and tool calls that go through the operation surface. This is the backend of the
      built-in `agent.native` plugin; UI (page, floating window) is a separate concern.
  - name: ai
    description: |
      Global AI providers (ADR-0017): the model endpoints an administrator configures for the
      installation. Sessions pick one by `config.provider_id`; the API key is a write-only secret.
  - name: events
    description: Server-sent event stream of resource changes and operation progress.
  - name: agent
    description: Fixed tool set for AI operators (ADR-0004 D8), designed for MCP and function calling.
paths:
  # ---------------------------------------------------------------- system
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      description: Returns 200 while the process is alive. Carries no internal detail; use `qwq doctor` for diagnostics.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: |
        Returns 200 once the host accepts requests (database open, migrations applied, local agent
        connected), otherwise 503 `UNAVAILABLE`. Used by upgrades (ARCH §12) and load balancers.
      security: []
      responses:
        '200':
          description: The host is ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- setup
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Report whether the installation is initialized
      description: Unauthenticated. The Shell uses it to decide between the setup page and the login page.
      security: []
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Create the first administrator with the one-time setup token
      description: |
        ARCH §4.1.1. The installer prints a one-time link `https://<host>/setup#token=<setup_token>`
        (the token is in the fragment so it never reaches access logs), or the host listens only on
        `127.0.0.1` for setup over an SSH tunnel. The Shell posts the token with the first
        administrator's credentials. The token is compared in constant time, is rate limited and is
        invalidated on success. On success the response sets the session cookie, exactly like login.
        After setup this endpoint returns `409 STATE_CONFLICT`. A wrong or used token returns
        `401 UNAUTHENTICATED`.
      security: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: One-shot by construction (the token is consumed); a replay must not re-issue a session cookie.
      x-qwq-action-exempt: Bootstrap step before any actor exists; recorded in the audit log as actor kind `system`.
      requestBody:
        description: Setup token and the first administrator.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Administrator created and logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- sessions
  /api/v1/sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Log in with username and password
      description: |
        Without a second factor: `201`, sets the session cookie and returns the `Session`.
        With TOTP enabled: `200` with an `MfaChallenge` and no cookie; complete it with
        `POST /api/v1/sessions/mfa`. Failures return `401 UNAUTHENTICATED` without saying which
        part was wrong. Throttling is progressive per account and client IP (`429`), never a hard
        lockout (ARCH §4.1.1). The session ID is rotated on every login.
      security: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: The response carries a new session secret, which must not be stored for replay.
      x-qwq-action-exempt: Authentication, not a state change of a managed resource; audited.
      requestBody:
        description: Username and password.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: A second factor is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaChallenge' }
        '201':
          description: Logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/sessions/mfa:
    post:
      operationId: verifySessionMfa
      tags: [sessions]
      summary: Complete login with a TOTP or recovery code
      description: |
        Second login step. A challenge is single use and expires after 5 minutes. A wrong code returns
        `401 UNAUTHENTICATED`; repeated failures are throttled like passwords.
      security: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: The response carries a new session secret, which must not be stored for replay.
      x-qwq-action-exempt: Authentication, not a state change of a managed resource; audited.
      requestBody:
        description: Challenge ID and second-factor code.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '201':
          description: Logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/sessions/current:
    get:
      operationId: getCurrentSession
      tags: [sessions]
      summary: Return the current session and its CSRF token
      description: |
        The Shell calls this after a page load to obtain the CSRF token (kept in memory only) and the
        signed-in user. Returns `401` when the cookie is missing, expired or revoked.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCurrentSession
      tags: [sessions]
      summary: Log out
      description: Revokes the session and clears the cookie. Repeating it is harmless.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Naturally idempotent; revoking a revoked session is a no-op.
      x-qwq-action-exempt: Authentication, not a state change of a managed resource; audited.
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearSessionCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- account self-service
  /api/v1/sessions/current/mfa/totp:
    post:
      operationId: beginTotpEnrollment
      tags: [sessions]
      summary: Start a TOTP enrollment for the signed-in user
      description: |
        Returns a new secret and its `otpauth://` URL for the QR code, shown in this response only;
        confirm it with `POST /api/v1/sessions/current/mfa/totp/confirm` before `expires_at`.
        Starting again replaces an unconfirmed secret. When the user already has a second factor,
        the session must have passed it recently (15 minutes by default), otherwise
        `403 MFA_REQUIRED`: a stolen session must not swap the second factor. Human browser session
        with CSRF token only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: The response carries a new secret, which must not be stored for replay; repeating it only replaces the unconfirmed secret.
      x-qwq-action-exempt: Credential of a person; human session only, not in the AI action catalog. Audited on confirmation.
      responses:
        '200':
          description: The pending secret, shown only here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/sessions/current/mfa/totp/confirm:
    post:
      operationId: confirmTotpEnrollment
      tags: [sessions]
      summary: Confirm the pending TOTP secret and turn the second factor on
      description: |
        Verifies a code of the pending secret, turns the second factor on and returns the recovery
        codes, shown in this response only. The session keeps its cookie and CSRF token and is not
        counted as having passed a second factor: the code only proves the secret this session just
        created. Replacing a second factor that is already on needs a recent one (`403 MFA_REQUIRED`).
        No enrollment in progress, or an expired one, is `409 STATE_CONFLICT`; a wrong code is
        `400 VALIDATION_FAILED`. Human browser session with CSRF token only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: The response carries the recovery codes, which must not be stored for replay; the pending secret is consumed.
      x-qwq-action-exempt: Credential of a person; human session only, not in the AI action catalog. Audited.
      requestBody:
        description: A code of the pending secret.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCodeRequest' }
      responses:
        '200':
          description: Second factor on; the recovery codes are shown only here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpConfirmResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/sessions/current/mfa/totp/disable:
    post:
      operationId: disableTotp
      tags: [sessions]
      summary: Turn the signed-in user's second factor off
      description: |
        Requires a current TOTP code or an unused recovery code in the body. A wrong code is
        `403 MFA_REQUIRED` and is charged to the same progressive backoff as approval codes (`429`).
        Deletes the TOTP secret and every recovery code. A POST rather than a DELETE because the
        code travels in a body. Human browser session with CSRF token only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: The code is consumed; repeating it after success returns `409 STATE_CONFLICT`.
      x-qwq-action-exempt: Credential of a person; human session only, not in the AI action catalog. Audited.
      requestBody:
        description: The current second factor.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCodeRequest' }
      responses:
        '200':
          description: The user with `mfa_enabled` false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/sessions/current/profile:
    patch:
      operationId: updateProfile
      tags: [sessions]
      summary: Change the signed-in user's display name
      description: |
        Runs `host.account.update` on the caller's own user; the outcome's `result` is the updated
        `User`. Every role may change its own profile; the permission is human-only, so no AI
        operator or service account reaches it. `expected_revision` is the user's revision
        (`409 REVISION_CONFLICT` when stale). Human browser session with CSRF token only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.account.update
        summary: Change the signed-in person's own display name
        effect: write
        risk: low
        mode: invoke
        idempotent: true
        plannable: true
        ui_route: /settings/account
        permission: host.account:update
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The new display name, with the expected revision.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/sessions/current/password:
    put:
      operationId: changePassword
      tags: [sessions]
      summary: Change the signed-in user's password
      description: |
        Verifies the current password and applies the same policy as setup to the new one
        (violations point at `/new_password`). A wrong current password is `403 PERMISSION_DENIED`,
        not `401`, so the Shell stays signed in; guesses are throttled progressively (`429`).
        On success this session stays valid and every other session of the user is revoked.
        Human browser session with CSRF token only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Setting the same password twice has the same effect; a replay after success fails the current-password check, which is the safe answer.
      x-qwq-action-exempt: Credential of a person; human session only, not in the AI action catalog. Audited.
      requestBody:
        description: Current and new password.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204':
          description: Password changed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/enrollments:
    post:
      operationId: redeemEnrollment
      tags: [sessions]
      summary: Redeem an enrollment link into a first password and a session
      description: |
        The token comes from `POST /api/v1/users/{user_id}/enrollment-token`, handed to the user out
        of band. Sets the first password (same policy as setup) and, on success, sets the session
        cookie exactly like login. The token is single use: a wrong, used or expired token is
        `401 UNAUTHENTICATED` without saying which. Unauthenticated writes are rate limited per
        client IP (`429`).
      security: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: One-shot by construction (the token is consumed); a replay must not re-issue a session cookie.
      x-qwq-action-exempt: Bootstrap of a person's credential before they have a session; audited.
      requestBody:
        description: Enrollment token and the first password.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentRedeemRequest' }
      responses:
        '201':
          description: Password set and logged in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ------------------------------------------------------- private exports
  /api/v1/private-exports:
    post:
      operationId: preparePrivateExport
      tags: [account]
      summary: Prepare a session-bound private export
      description: |
        Prepares a five-minute handoff grant for the current human session. The grant binds the
        producer, action, node, instance, purpose and subject and does not authorize key generation.
        Generation still uses an approved operation. Private PEM never appears in its result.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Short-lived human credential handoff; no private response is cached or replayed.
      x-qwq-action-exempt: Human session credential handoff, audited; generation still goes through operations.
      requestBody:
        description: The exact authorized producer and target resource.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivateExportPrepareRequest' }
      responses:
        '201':
          description: A grant bound to this human session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateExportGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/private-exports/{export_id}/consume:
    parameters:
      - name: export_id
        in: path
        required: true
        description: ID of the private export prepared by this same human session.
        schema: { type: string, maxLength: 64, pattern: '^pex_[0-7][0-9a-hjkmnp-tv-z]{25}$' }
    post:
      operationId: consumePrivateExport
      tags: [account]
      summary: Consume private material exactly once
      description: |
        Only the original live human session may consume a ready export. Consumption, audit and
        encrypted-secret removal commit together before delivery. Connection loss never reissues
        the private key. The response is a download, never an operation result or a JSON envelope.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: A one-time private download must never be cached or replayed.
      x-qwq-action-exempt: Human session credential delivery, audited; private bytes never enter an operation.
      responses:
        '200':
          description: The selected private material; Cache-Control is no-store.
          content:
            application/octet-stream:
              schema: { type: string, format: binary, description: The one-time private key PEM. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/private-exports/{export_id}:
    parameters:
      - name: export_id
        in: path
        required: true
        description: ID of a grant prepared by this same human session.
        schema: { type: string, maxLength: 64, pattern: '^pex_[0-7][0-9a-hjkmnp-tv-z]{25}$' }
    delete:
      operationId: cancelPrivateExport
      tags: [account]
      summary: Cancel a private handoff
      description: Removes encrypted material in the original human session; already imported public keys are managed separately.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Cancels an ephemeral human credential handoff; no private response is replayed.
      x-qwq-action-exempt: Human session credential cancellation, audited.
      responses:
        '204': { description: Private handoff canceled. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- users
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      description: Cursor-paginated. Supports `fields` and `since_revision`.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/SinceRevision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      description: |
        Creates an operation for `host.users.create`. The caller never chooses the initial password:
        the result (`user`, `enrollment_pending`, `enrollment_expires_at`) only reports that the new
        user still has to enroll, and an administrator issues the one-time enrollment link with
        `POST /api/v1/users/{user_id}/enrollment-token`. No secret is ever part of the result.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.users.create
        summary: Create a panel user with a role
        effect: write
        risk: high
        mode: invoke
        idempotent: false
        plannable: true
        undo: host.users.delete
        ui_route: /settings/users
        permission: host.users:create
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The new user.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      description: Supports `fields`.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's display name, role or disabled flag
      description: Absent members are left unchanged. `expected_revision` is required.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.users.update
        summary: Change a panel user's display name, role or disabled flag
        effect: write
        risk: high
        mode: invoke
        idempotent: true
        plannable: true
        ui_route: /settings/users
        permission: host.users:update
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Members to change, with the expected revision.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: |
        Destructive: revokes the user's sessions and delegations. `expected_revision` is a query
        parameter because DELETE carries no body. Deleting the last administrator fails with
        `409 STATE_CONFLICT`.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.users.delete
        summary: Delete a panel user and revoke their sessions and delegations
        effect: destructive
        risk: high
        mode: invoke
        idempotent: true
        plannable: true
        ui_route: /settings/users
        permission: host.users:delete
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedRevisionQuery'
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/users/{user_id}/enrollment-token:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    post:
      operationId: issueEnrollmentToken
      tags: [users]
      summary: Issue a one-time enrollment link for a user without a password
      description: |
        Returns the token of the link with which a new user chooses their first password; hand it
        to the user out of band, for example in the fragment of a URL so it never reaches access
        logs. The token is shown in this response only: it is never part of an operation, an event
        or the audit log, and the idempotent replay omits it. Issuing a link retires the user's
        earlier unused links. Enrollment never replaces a password: a user who already has one, or
        is disabled, gets `409 STATE_CONFLICT`.

        **Human browser session with CSRF token only**, with `host.users:update` and a fresh second
        factor: either the session passed one recently (15 minutes by default) or the request
        carries a current `mfa_code`. Without one, or with a wrong code, the answer is
        `403 MFA_REQUIRED`; a delegation or service-account token gets `403 PERMISSION_DENIED`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: Hands a one-time credential to a person; only a human session with a fresh second factor may do it, so it is not in the AI action catalog. Audited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The second factor, unless the session passed one recently.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentTokenRequest' }
      responses:
        '200':
          description: The link token, shown only here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- service-accounts
  /api/v1/service-accounts:
    get:
      operationId: listServiceAccounts
      tags: [service-accounts]
      summary: List automation service accounts (without bearer tokens)
      description: Returns metadata for automation service accounts; plaintext bearer tokens are never returned.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Service account list
          content:
            application/json:
              schema:
                type: object
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createServiceAccount
      tags: [service-accounts]
      summary: Create an automation service account (returns bearer token once)
      description: Creates a scoped automation service account and returns its one-time bearer token in the creation response.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: credential-mint
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Service account creation payload.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, role]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                role: { type: string, enum: [admin, operator, viewer] }
                scope: { type: object }
      responses:
        '201':
          description: Created service account with one-time bearer token
          content:
            application/json:
              schema:
                type: object
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/service-accounts/{service_id}:
    delete:
      operationId: deleteServiceAccount
      tags: [service-accounts]
      summary: Revoke a service account immediately
      description: Revokes the specified service account immediately with optimistic revision concurrency.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: credential-mint
      parameters:
        - name: service_id
          in: path
          description: Identifier of the service account to revoke.
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedRevisionQuery'
      responses:
        '204':
          description: Service account revoked
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/service-accounts/renewal-bootstrap:
    post:
      operationId: bootstrapRenewalServiceAccount
      tags: [service-accounts]
      summary: Create a restricted account for a confirmed renewal policy
      description: |
        A current human session creates an operator account after high-risk approval. The host
        reads the certificate, DNS, CA, consumers and expiry from the confirmed private policy;
        callers cannot supply account permissions or credentials. The policy revision is checked
        again inside the account creation transaction. A matching valid account is reused.
        The operation result contains only `service_account_id`; no bearer token is returned.
        Attaching the account to the policy is a separate approved operation.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.service_accounts.renewal_bootstrap
        summary: Create a restricted account for a confirmed renewal policy
        effect: write
        risk: high
        mode: invoke
        idempotent: true
        plannable: true
        permission: host.service_accounts:create
        timeout_ms: 10000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The confirmed private policy and its current revision.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewalServiceBootstrapRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/delegations:
    get:
      operationId: listDelegations
      tags: [delegations]
      summary: List the caller's delegations
      description: Administrators may pass `owner=all`. Human sessions only.
      security:
        - sessionCookie: []
      parameters:
        - name: owner
          in: query
          description: '`me` (default) or `all` (administrators only).'
          schema: { type: string, enum: [me, all], default: me }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/SinceRevision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of delegations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createDelegation
      tags: [delegations]
      summary: Issue a delegation token for an AI operator
      description: |
        ADR-0004 D4. The effective permission of the token is always the owner's RBAC ∩ the policy
        below ∩ plugin capabilities. The token is returned once, in this response only; the stored
        idempotent replay omits `token` (revoke and issue a new delegation if it was lost).
        Human browser sessions only: a delegation or service-account token gets `403 PERMISSION_DENIED`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: Only humans manage delegations; not in the AI action catalog. Still recorded as an operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Label, policy and lifetime of the delegation.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreateRequest' }
      responses:
        '201':
          description: Delegation created. `token` is shown only here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/delegations/{delegation_id}:
    parameters:
      - $ref: '#/components/parameters/DelegationIdPath'
    get:
      operationId: getDelegation
      tags: [delegations]
      summary: Get a delegation
      description: Never returns the token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The delegation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDelegation
      tags: [delegations]
      summary: Suspend, resume or narrow a delegation
      description: |
        Follow mode "pause" sets `status=suspended`; "take over" deletes the delegation (ADR-0004 D9).
        Suspension takes effect for new calls immediately; running operations are not canceled.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: Only humans manage delegations; not in the AI action catalog. Still recorded as an operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Members to change, with the expected revision.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationUpdateRequest' }
      responses:
        '200':
          description: The updated delegation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDelegation
      tags: [delegations]
      summary: Revoke a delegation
      description: The token stops working immediately. Operations it already created keep running unless canceled.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: Only humans manage delegations; not in the AI action catalog. Still recorded as an operation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedRevisionQuery'
      responses:
        '204':
          description: Revoked.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- nodes
  /api/v1/nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: List managed nodes
