        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- plugins
  /api/v1/plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: List installed plugins
      description: One entry per plugin with its local version rows, newest first.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/SinceRevision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of installed plugins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: installPlugin
      tags: [plugins]
      summary: Install a plugin from an uploaded package
      description: |
        Installs the package staged by `POST /api/v1/plugin-packages`. The plugin id and version are
        read from the signed manifest, never from the request. The caller must list the capabilities
        it accepts; the updater refuses capabilities the manifest does not declare and any new
        capability that was not accepted. The answer is synchronous because the host runs the install
        saga before responding; a long install is bounded by the updater's timeout.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: |
        Installation runs the updater's own saga and transactions, so it cannot execute inside the
        host operation executor's transaction. It stays an audited host write through the plugin
        events; the upload step is a separate human action.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The staged package, the accepted capabilities and an optional concurrency guard.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginInstallRequest' }
      responses:
        '201':
          description: The installed version.
          headers:
            Location:
              description: The installed plugin.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugin-packages:
    post:
      operationId: uploadPluginPackage
      tags: [plugins]
      summary: Upload a plugin package for installation
      description: |
        Stages a signed package in the host's private staging directory for at most 15 minutes. The
        multipart filename is ignored; only the bytes of the `package` part are used, and the package
        is not executed or verified until it is installed. `upload_id` is the only handle the later
        install/update call needs.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Each upload creates a fresh ephemeral staging file with a random id; a replay is a new upload
        and executes nothing.
      x-qwq-action-exempt: |
        Staging a package is not a host action: it changes no managed resource and is consumable only
        by the install or update route. At most 32 packages may be staged on the host and 4 per
        account; both caps count uploads that are still being received. The staging filesystem must
        keep a reserve beyond one package or the upload is refused with `INSUFFICIENT_STORAGE`.
      x-qwq-limits:
        max_package_bytes: 67108864
      requestBody:
        description: One signed plugin package.
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PluginPackageUploadRequest' }
      responses:
        '201':
          description: The staged package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPackageUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugin-packages/fetch:
    post:
      operationId: fetchPluginPackage
      tags: [plugins]
      summary: Fetch a plugin package from a remote HTTPS URL
      description: |
        Downloads a signed `.qwqpkg` package from a public HTTPS URL (such as a GitHub Release
        asset) and stages it in the host's private staging directory through the same path as
        `POST /api/v1/plugin-packages`. The downloader enforces `https://` only, blocks loopback,
        RFC 1918, RFC 4193, link-local, CGNAT, multicast and unspecified IPs on both the initial
        request and every redirect hop, bounds the transfer to 64 MiB and 60 seconds, and verifies
        `expected_sha256` when provided.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Each fetch creates a fresh ephemeral staging file with a random upload id; a replay stages
        another copy and installs nothing.
      x-qwq-action-exempt: |
        Staging a remote package changes no managed resource and is consumable only by the install
        or update route. Host-wide and per-account staging quotas apply identically to multipart
        uploads.
      requestBody:
        description: Remote HTTPS package URL and optional SHA-256 digest guard.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginPackageFetchRequest' }
      responses:
        '201':
          description: The staged package downloaded from the remote HTTPS URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPackageUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugin-catalog:
    get:
      operationId: getPluginCatalog
      tags: [plugins]
      summary: List pre-built official plugins available for one-click install
      description: |
        Returns the official optional plugin catalog matched to this host's release version and
        CPU architecture (`linux/amd64` or `linux/arm64`), annotated with local installation and
        update availability status. Fetches and caches `plugins-index.json` from the official
        release mirror for 5 minutes and degrades cleanly to embedded metadata when offline.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: refresh
          in: query
          required: false
          description: Set to `1` or `true` to bypass the 5-minute catalog cache and fetch fresh metadata.
          schema: { type: string, maxLength: 8, enum: ['0', '1', 'true', 'false'] }
      responses:
        '200':
          description: The official plugin catalog matched to this host's architecture and installed state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginCatalogResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugin-trust-keys:
    get:
      operationId: listPluginTrustKeys
      tags: [plugins]
      summary: List trusted plugin publisher public keys
      description: |
        Returns all currently active Ed25519 publisher public keys trusted by the host, combining
        read-only official system keys (`/etc/qwq/trust`) and administrator-managed custom
        developer keys (`<data_dir>/trust/publishers`).
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      responses:
        '200':
          description: The active official and custom trusted publisher keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginTrustKeyList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addPluginTrustKey
      tags: [plugins]
      summary: Add a custom trusted plugin publisher public key
      description: |
        Validates and persists an Ed25519 PKIX public key PEM under the custom trust root so
        third-party plugins signed by that key pass inspection and installation immediately without
        restarting the controller. Human browser session only; requires a fresh second factor or
        `X-QWQ-MFA-Code` when the signed-in administrator has MFA enabled.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Publisher keys are uniquely addressed by their SHA-256 key_id; re-submitting the same key
        is deterministically rejected with `409 STATE_CONFLICT`.
      x-qwq-action-exempt: |
        Trust root management is a human administrator security control outside the AI action
        catalog; every addition is written to the host audit log.
      parameters:
        - $ref: '#/components/parameters/MfaCodeHeader'
      requestBody:
        description: Human label and Ed25519 PKIX public key PEM to trust.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginTrustKeyCreateRequest' }
      responses:
        '201':
          description: The newly trusted custom publisher key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginTrustKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugin-trust-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/PluginTrustKeyIdPath'
    delete:
      operationId: deletePluginTrustKey
      tags: [plugins]
      summary: Remove a custom trusted plugin publisher public key
      description: |
        Removes an administrator-added custom publisher key from the dynamic trust root and
        invalidates cached package inspections immediately. Official system keys cannot be removed
        (`403 PERMISSION_DENIED`). Human browser session only; requires a fresh second factor or
        `X-QWQ-MFA-Code` when MFA is enabled.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Deleting by immutable cryptographic key_id removes at most one custom key; repeating the
        call returns `404 NOT_FOUND` with no further side effects.
      x-qwq-action-exempt: |
        Trust root management is a human administrator security control outside the AI action
        catalog; every removal is written to the host audit log.
      parameters:
        - $ref: '#/components/parameters/MfaCodeHeader'
      responses:
        '204':
          description: Custom trusted publisher key removed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugin-packages/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/PluginUploadIdPath'
    get:
      operationId: inspectPluginPackage
      tags: [plugins]
      summary: Inspect a staged plugin package
      description: |
        Verifies and parses a staged package without installing it: the signature verdict against the
        trust root, the manifest the package claims, the install-time compatibility problems and the
        memory and disk capacity preflights. Only the principal that uploaded the package may look;
        anyone else gets `404`, exactly like an unknown id. A signature refusal is still `200` with
        `signature.valid = false`, and the manifest is present whenever it parses safely. The result
        is cached per upload until it expires, so a repeated lookup does not verify the package
        again. Nothing is consumed: install and update still accept the same `upload_id`.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      responses:
        '200':
          description: The verification and preflight result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPackageInspection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deletePluginPackage
      tags: [plugins]
      summary: Discard a staged plugin package
      description: |
        Deletes a staged plugin package owned by the calling principal so failed preflights or
        cancelled installs immediately release the per-account staging slot.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Idempotent DELETE of an ephemeral caller-owned staged upload slot.
      x-qwq-action-exempt: Cleanup of a temporary pre-install upload staged by the calling principal.
      responses:
        '204':
          description: The staged package was discarded.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    get:
      operationId: getPlugin
      tags: [plugins]
      summary: Get an installed plugin
      description: Supports `fields`.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The installed plugin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: uninstallPlugin
      tags: [plugins]
      summary: Uninstall a plugin, keeping its data by default
      description: |
        Uninstall (ARCH §6.6), always a job: `202` with the Operation, then the removal runs as a
        sequence of idempotent steps (stop the instances, remove the unit and version trees through
        the privileged helper, delete the rows), so a retry after a crash continues where it stopped.
        Configuration revisions and the plugin token are retained unless `purge_data=true`, which is
        destructive and requires a fresh second factor (`403 MFA_REQUIRED` otherwise). Blocked with
        `409 STATE_CONFLICT` while dependents exist; the problem's `dependents` lists them.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.plugins.uninstall
        summary: Uninstall a plugin from all nodes and keep its data
        effect: write
        risk: high
        mode: job
        idempotent: true
        plannable: true
        ui_route: /plugins
        permission: host.plugins:uninstall
        timeout_ms: 300000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedRevisionQuery'
        - name: purge_data
          in: query
          description: Also delete the retained configuration and the plugin token; needs a fresh second factor.
          schema: { type: boolean, default: false }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/update:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    post:
      operationId: updatePlugin
      tags: [plugins]
      summary: Update a plugin from an uploaded package
      description: |
        Replaces the active version with the package staged by `POST /api/v1/plugin-packages`. The
        systemd unit is per plugin, so the host always uses the controlled-restart strategy: the old
        process stops briefly and the new one starts. The version and plugin id come from the signed
        manifest; a package of another plugin is refused.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: |
        The update runs inside the updater's saga and transaction; it cannot execute in the host
        operation executor's transaction. Audit events are emitted by the updater.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The staged package, the accepted capabilities and an optional concurrency guard.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginUpdateRequest' }
      responses:
        '200':
          description: The committed update saga.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginUpdateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/rollback:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    post:
      operationId: rollbackPlugin
      tags: [plugins]
      summary: Roll a plugin back to its retained previous version
      description: |
        Switches the plugin back to its most recently activated retained version. The current version
        keeps its files, so a later update can move forward again. `expected_revision` optionally
        guards the active version the caller saw.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: |
        The rollback runs inside the updater's saga and transaction; it cannot execute in the host
        operation executor's transaction. Audit events are emitted by the updater.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Optional concurrency guard.
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginRollbackRequest' }
      responses:
        '200':
          description: The committed rollback saga.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginUpdateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/restart:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    post:
      operationId: restartPlugin
      tags: [plugins]
      summary: Restart a plugin instance
      description: |
        Stops the running instance and starts it again with the active version and the active
        configuration. Like install, update and rollback this runs in the runtime's own lifecycle
        rather than the host operation executor's transaction, so it produces no operation record;
        the route writes the audit row. `reason` is optional free text for that row. The response is
        the refreshed plugin, so a card can update its runtime state without a second request.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: |
        The restart runs in the plugin runtime's own lifecycle, outside the host operation
        executor's transaction. The route writes the audit row.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Optional reason for the audit log.
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginRestartRequest' }
      responses:
        '200':
          description: The restarted plugin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/enable:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    post:
      operationId: enablePlugin
      tags: [plugins]
      summary: Enable a plugin
      description: |
        Persists the enablement flag and starts the active version. The flag survives a host restart:
        every unit start goes through the same gate, so a disabled plugin is never started by a
        dispatch, a recovery or a rollback. Queued as a job because the runtime call must not run
        inside the operation's write transaction.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.plugins.enable
        summary: Enable a plugin
        effect: write
        risk: high
        mode: job
        idempotent: true
        plannable: false
        ui_route: /plugins
        permission: host.plugins:update
        timeout_ms: 60000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/disable:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    post:
      operationId: disablePlugin
      tags: [plugins]
      summary: Disable a plugin
      description: |
        Persists the enablement flag and stops every instance of the plugin. The version rows, the
        configuration and the files are kept, so enabling it again restores the same version. A
        disabled plugin answers `503 PLUGIN_UNAVAILABLE` on dispatch.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action:
        id: host.plugins.disable
        summary: Disable a plugin
        effect: write
        risk: high
        mode: job
        idempotent: true
        plannable: false
        ui_route: /plugins
        permission: host.plugins:update
        timeout_ms: 60000
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/logs:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    get:
      operationId: getPluginLogs
      tags: [plugins]
      summary: Read a page of a plugin's journal
      description: |
        Reads the plugin unit's journal through the privileged helper, which only ever addresses
        `qwq-plugin@<id>.service` and truncates every line at 4 KiB. Lines are untrusted plugin
        output. Pages are oldest first within the page; `next_cursor` reads what came after the last
        line, so a viewer follows the log forward. `stream` selects stdout or stderr (systemd writes
        stdout at LOG_INFO and stderr at LOG_ERR). At most 100 lines per page. `since_revision` is
        refused: the journal is not a revisioned collection.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: stream
          in: query
          description: Only this output stream.
          schema: { type: string, enum: [stdout, stderr] }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/SinceRevision'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: Page size, at most 100 lines.
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of journal lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/resources:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    put:
      operationId: putPluginResources
      tags: [plugins]
      summary: Update or reset a plugin's runtime resource limits
      description: Persists administrator-configured cgroup resource limits (memory, CPU quota, PIDs, FDs, disk) for the plugin and synchronizes the systemd drop-in override.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Idempotent PUT replacing desired per-plugin resource limit overrides.
      x-qwq-action-exempt: Direct host runtime resource configuration; audited directly by the host API.
      requestBody:
        description: Desired plugin resource limits or reset flag.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginResourcesOverrideRequest' }
      responses:
        '200':
          description: Updated plugin view with effective resource limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/config:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    get:
      operationId: getPluginConfig
      tags: [plugins]
      summary: Get the active plugin configuration
      description: |
        Returns the active revision. Sensitive values declared by the plugin's configuration schema
        are redacted; a plugin without a configuration reports revision `0` and an empty object.
        Supports `fields`.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The active configuration revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putPluginConfig
      tags: [plugins]
      summary: Apply a plugin configuration revision
      description: |
        Stores an immutable revision, asks the plugin to validate and apply it, and only then moves
        the active pointer. Values the plugin's schema marks `writeOnly` or `x-secret` are moved into
        the host secret store; the updater receives references, never plaintext. `expected_revision`
        guards the active revision (`0` means no configuration yet).
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: |
        Configuration is applied by the updater's own validation transaction and never executes in
        the host operation executor's transaction.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: The configuration object and an optional concurrency guard.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginConfigRequest' }
      responses:
        '200':
          description: The applied configuration revision, with sensitive values redacted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/config-schema:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
    get:
      operationId: getPluginConfigSchema
      tags: [plugins]
      summary: Get the configuration schema of the active plugin version
      description: |
        The JSON Schema 2020-12 subset the configuration form is generated from. It is written by
        the plugin author: untrusted, render it as data. Sensitive fields are marked
        `writeOnly: true` or `x-secret: true`; the host replaces their values with secret
        references before storing a configuration.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      responses:
        '200':
          description: The configuration schema of the active version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginConfigSchema' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plugins/{plugin_id}/operations/{operation}:
    parameters:
      - $ref: '#/components/parameters/PluginIdPath'
      - $ref: '#/components/parameters/OperationNamePath'
    post:
      operationId: invokeControllerPluginOperation
      tags: [plugins]
      summary: Call an operation of a controller-placed plugin
      description: |
        ADR-0002: plugins with `placement=controller` run once globally. The request and response
        payloads follow the operation's schemas in the plugin manifest; their content is untrusted.
        `mode=invoke`: `200` with the outcome. `mode=job`, or when the caller's policy requires
        approval: `202` with the Operation. Plugin-reported validation failures return
        `400 VALIDATION_FAILED` with field-level `violations`.
        A synchronous `effect=read`, `mode=invoke` operation an overview widget is bound to is held to that widget's `refresh_seconds`
        floor per principal, with at most one call in flight: a faster poll answers `429 RATE_LIMITED`
        with `Retry-After`. This synchronous read creates no operation record, so polling does not grow the log.
        An explicit read job requires `Idempotency-Key` and follows the same bounded persistent task,
        authorization, cancellation and deadline path as other jobs; it cannot accept new secret material.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: conditional
      x-qwq-action-from: manifest
      x-qwq-limits:
        max_body_bytes: 4194304
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyConditional'
      requestBody:
        description: Operation payload and optional concurrency guard or plan binding.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginInvokeRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/nodes/{node_id}/plugins/{plugin_id}/instances/{instance_id}/operations/{operation}:
    parameters:
      - $ref: '#/components/parameters/NodeIdPath'
      - $ref: '#/components/parameters/PluginIdPath'
      - $ref: '#/components/parameters/InstanceIdPath'
      - $ref: '#/components/parameters/OperationNamePath'
    post:
      operationId: invokeNodePluginOperation
      tags: [plugins]
      summary: Call an operation of a plugin instance on a node
      description: |
        ADR-0002: plugins with `placement=node`. Same contract as the controller-level route. When
        the node's agent is offline, operations that are not explicitly queueable fail with
        `503 NODE_OFFLINE` (ARCH §7). RBAC resources include `node_id`.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: conditional
      x-qwq-action-from: manifest
      x-qwq-limits:
        max_body_bytes: 4194304
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyConditional'
      requestBody:
        description: Operation payload and optional concurrency guard or plan binding.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginInvokeRequest' }
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- operations
  /api/v1/operations:
    get:
      operationId: listOperations
      tags: [operations]
      summary: List operations, newest first
      description: Filters combine with AND. Callers see only operations they are allowed to read.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses, e.g. `RUNNING,AWAITING_APPROVAL`.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 9
            uniqueItems: true
            items: { $ref: '#/components/schemas/OperationStatus' }
        - name: actor_kind
          in: query
          description: Only operations started by this kind of actor.
          schema: { $ref: '#/components/schemas/ActorKind' }
        - name: node_id
          in: query
          description: Only operations targeting this node.
          schema: { $ref: '#/components/schemas/NodeId' }
        - name: plugin_id
          in: query
          description: Only operations targeting this plugin.
          schema: { $ref: '#/components/schemas/PluginId' }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/SinceRevision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of operations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/operations/{operation_id}:
    parameters:
      - $ref: '#/components/parameters/OperationIdPath'
    get:
      operationId: getOperation
      tags: [operations]
      summary: Get an operation
      description: Supports `fields`. Poll this or follow `operation.updated` events.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/operations/{operation_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OperationIdPath'
    post:
      operationId: cancelOperation
      tags: [operations]
      summary: Cancel an operation
      description: |
        `PENDING`, `AWAITING_APPROVAL` and `APPROVED` operations become `CANCELED` at once (`200`).
        A `RUNNING` operation gets `cancel_requested=true` and `202`; it ends as `CANCELED`, or as
        `SUCCEEDED`/`FAILED` if it could not stop in time. A terminal operation returns
        `409 STATE_CONFLICT`. No `expected_revision`: progress updates change the revision constantly
        and cancel must not race with them.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: Acts on an existing operation and is recorded on it; exposed to AI as the `cancel` agent tool.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Optional reason for the audit log.
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Canceled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '202':
          description: Cancellation requested; the operation is still running.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- plans
  /api/v1/plans:
    post:
      operationId: createPlan
      tags: [plans]
      summary: Preview an action without side effects
      description: |
        ADR-0004 D7. Validates the arguments, asks the plugin's `PlanOperation` when the action is
        plannable, computes the effective risk and records preconditions. Soft problems are returned
        inside the plan (`violations`, `warnings`, `executable=false`) so a caller sees all of them at
        once; only malformed requests and unknown actions fail with an error status. A plan is
        private to the principal that created it and expires after `plan_ttl_seconds`.
        Non-plannable actions still get a plan with empty `changes`, so plan → execute works for all.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Side-effect free; a retry only creates another short-lived plan.
      x-qwq-action-exempt: Preview only; exposed to AI as the `plan` agent tool.
      x-qwq-limits:
        max_body_bytes: 4194304
      requestBody:
        description: Action, arguments and target to preview.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '201':
          description: Plan created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plans/{plan_id}:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get a plan
      description: Only the principal that created the plan, and administrators, can read it.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/plans/{plan_id}/execute:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    post:
      operationId: executePlan
      tags: [plans]
      summary: Create the operation that a plan previewed
      description: |
        A plan executes at most once. The host atomically re-checks host-side preconditions and passes
        plugin-side preconditions to the plugin; any mismatch fails the operation with
        `PRECONDITION_FAILED` (`409` when detected before the operation starts). An expired plan
        returns `409 PLAN_EXPIRED`; a plan with blocking violations returns `400 VALIDATION_FAILED`;
        a plan that already has an operation returns `409 STATE_CONFLICT` with that `operation_id`.
        Response codes follow the plugin operation routes: `200` when finished, `202` otherwise
        (including `AWAITING_APPROVAL`).
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: Executes the action recorded in the plan; exposed to AI as the `execute` agent tool.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OperationDone' }
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- approvals
  /api/v1/approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approvals
      description: |
        Approvals the caller can decide or has requested. Service accounts and the agent `read` tool
        can see the approvals of their own operations.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: status
          in: query
          description: Only approvals in this status. Default `PENDING`.
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/SinceRevision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of approvals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/approvals/{approval_id}:
    parameters:
      - $ref: '#/components/parameters/ApprovalIdPath'
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Get an approval with its confirmation card data
      description: |
        `facts` are established by the host; `plugin_preview` comes from the plugin's PlanOperation
        and is untrusted. The Shell renders the confirmation card from these two parts only; no text
        written by the requesting AI is included (ADR-0004 D6).
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/approvals/{approval_id}/decision:
    parameters:
      - $ref: '#/components/parameters/ApprovalIdPath'
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject a pending approval
      description: |
        **Human browser session with CSRF token only.** A delegation token or service-account token
        always gets `403 PERMISSION_DENIED`, whatever its policy says (ADR-0004 D6, acceptance 3).
        When the action's effect is `destructive`, `mfa_code` is required; a missing or wrong code
        returns `403 MFA_REQUIRED` (the session stays valid). Codes are checked before the approval
        is looked up and count against a progressive backoff per user and client: after repeated
        wrong codes the endpoint returns `429 RATE_LIMITED` with `Retry-After`. An approval that already expired or was decided returns
        `409 STATE_CONFLICT`. Approving moves the operation to `APPROVED` and then `RUNNING`;
        rejecting moves it to `REJECTED`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: required
      x-qwq-action-exempt: Approvals must never be reachable from the AI action catalog.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Approve or reject, with MFA code when required.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- action catalog for people (GAPS gap 5)
  /api/v1/actions:
    get:
      operationId: listActions
      tags: [actions]
      summary: Search the action catalog as the signed-in person
      description: |
        **Human browser session only.** A delegation token or service-account token always gets
        `403 PERMISSION_DENIED`; AI operators use `POST /api/v1/agent/find_actions`, which answers for
        a delegation. The same local keyword search runs here (no model is called), filtered by the
        person's role: an action the role does not grant is absent. Routes marked
        `x-qwq-action-exempt` never enter the catalog. Without `q` the catalog is enumerated in its
        own order. Execution stays on the existing routes and `POST /api/v1/plans`; this route only
        reads. Summaries of plugin actions are untrusted.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: Search terms; empty enumerates the catalog.
          schema: { type: string, maxLength: 200 }
        - name: plugin_id
          in: query
          description: Only actions of this plugin.
          schema: { $ref: '#/components/schemas/PluginId' }
        - name: effect
          in: query
          description: Only actions with this effect.
          schema: { $ref: '#/components/schemas/Effect' }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, format: int32, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching actions, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/actions/{action_id}:
    parameters:
      - name: action_id
        in: path
        required: true
        description: Catalog identifier, percent-encoded (`/` becomes `%2F`).
        schema: { $ref: '#/components/schemas/ActionId' }
    get:
      operationId: getAction
      tags: [actions]
      summary: Get one action's metadata and argument schema
      description: |
        **Human browser session only**, as `GET /api/v1/actions`. An action the person's role does not
        grant answers `404`, exactly like an unknown ID, so the catalog is not an existence oracle.
        `request_schema` is JSON Schema 2020-12; for a plugin action it comes from the package and is
        untrusted data, not instructions.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- audit log (GAPS gap 7)
  /api/v1/audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Query the audit log
      description: |
        **Human browser session with the administrator role only.** A service-account or delegation
        token gets `403 PERMISSION_DENIED`, and so does an operator or viewer: the log names every
        person and every change on the installation. Rows are newest first and paginate with
        `cursor`/`limit`; `from` and `to` are inclusive RFC 3339 bounds on the event time. `detail`
        passes a redaction whitelist before it is returned and never contains a token, password or
        key. Retention (`retention.audit`, default 365 days) bounds how far back the log goes.
      security:
        - sessionCookie: []
      parameters:
        - name: actor
          in: query
          description: Only events caused by this actor ID.
          schema: { $ref: '#/components/schemas/ResourceId' }
        - name: action
          in: query
          description: Only this action name, e.g. `host.users.create` or `auth.login`.
          schema: { type: string, maxLength: 128 }
        - name: subject
          in: query
          description: Only events about this resource subject.
          schema: { type: string, maxLength: 512 }
        - name: outcome
          in: query
          description: Only events with this outcome.
          schema: { $ref: '#/components/schemas/AuditOutcome' }
        - name: operation_id
          in: query
          description: Only events of this operation.
          schema: { $ref: '#/components/schemas/ResourceId' }
        - name: from
          in: query
          description: Inclusive lower bound on the event time.
          schema: { type: string, format: date-time, maxLength: 32 }
        - name: to
          in: query
          description: Inclusive upper bound on the event time.
          schema: { type: string, format: date-time, maxLength: 32 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- system overview (GAPS gap 7)
  /api/v1/system:
    get:
      operationId: getSystem
      tags: [system]
      summary: Read the installation overview
      description: |
        Version, role, start time, TLS state and whether any plugin is enabled. `listen` and
        `data_dir` are returned to administrators only: they say where the panel is reachable and
        where its data lives.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      responses:
        '200':
          description: The installation overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/system/metrics:
    get:
      operationId: getSystemMetrics
      tags: [system]
      summary: Read built-in real-time host CPU, memory, disk, and network metrics
      description: Returns lightweight host resource telemetry and continuously recorded multi-resolution trend history (5m, 15m, 1h, 6h, 24h) directly from the core panel framework without requiring external monitoring plugins.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: range
          in: query
          required: false
          description: Trend history window to return from continuous background ring buffers (defaults to 15m).
          schema:
            type: string
            enum: [5m, 15m, 1h, 6h, 24h]
            default: 15m
      responses:
        '200':
          description: Current host resource metrics snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemHostMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/system/security/takeover:
    get:
      operationId: getSecurityTakeover
      tags: [system]
      summary: List coexistence firewall and fail2ban takeover status
      description: Reports whether ufw, firewalld, or fail2ban is active, backed up, and taken over by qwq. Administrators only.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current takeover status of manageable coexistence services.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityTakeoverStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postSecurityTakeover
      tags: [system]
      summary: Back up and take over an existing firewall or fail2ban manager
      description: Atomically backs up existing configuration, preserves active open ports in inet qwq, and disables the competing service so qwq manages it natively. Administrators only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Idempotent takeover backed by an atomic on-disk backup record.
      x-qwq-action-exempt: Privileged host coexistence takeover; audited directly by the host API.
      requestBody:
        description: Target manager to back up and take over.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecurityTakeoverRequest' }
      responses:
        '200':
          description: Updated coexistence takeover status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityTakeoverStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/system/security/restore:
    post:
      operationId: postSecurityRestore
      tags: [system]
      summary: Restore a previously taken-over firewall or fail2ban manager
      description: Clears qwq's conflicting takeover policy and re-enables the backed-up original manager service. Administrators only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Restores a single named takeover backup record.
      x-qwq-action-exempt: Privileged host coexistence restoration; audited directly by the host API.
      requestBody:
        description: Target manager to restore from backup.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecurityTakeoverRequest' }
      responses:
        '200':
          description: Updated coexistence takeover status after restoration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityTakeoverStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/system/access:
    get:
      operationId: getSystemAccess
      tags: [system]
      summary: Read panel access port, secret entry path, disguise, and reverse-proxy domain settings
      description: Returns the live panel listening port, secret entry path, stealth disguise policy, and reverse-proxy domain auto-disable state. Administrators only.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: Current panel access and disguise configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelAccessSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putSystemAccess
      tags: [system]
      summary: Update panel listening port, secret entry path, disguise page, or reverse-proxy domain
      description: Updates live panel access settings with optimistic revision checks. Changing the port performs a live hot-rebind; setting a reverse-proxy domain automatically disables the secret entry path and disguise when auto_disable_on_domain is enabled. Administrators only.
      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Idempotent PUT protected by optimistic expected_revision check.
      x-qwq-action-exempt: Direct host panel access and stealth disguise configuration; audited directly by the host API.
      parameters:
        - $ref: '#/components/parameters/MfaCodeHeader'
      requestBody:
        description: Desired panel access, secret entry path, disguise, and reverse-proxy domain settings.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                listen_host: { type: string, maxLength: 64, description: 'Bind listen host (e.g. 127.0.0.1, 0.0.0.0, ::1, :: or a specific unicast IP).' }
                port: { type: integer, format: int32, minimum: 1, maximum: 65535, description: TCP port the panel listens on. }
                entry_path: { type: string, maxLength: 64, description: Secret entry path segment without slashes; empty disables the entry gate. }
                generate_random_entry_path: { type: boolean, description: Generate a new cryptographically random secret entry path. }
                disguise: { type: string, maxLength: 32, enum: [drop, nginx_404, nginx_403, blank_404, custom_html], description: Stealth response mode when the entry path is missing or wrong. }
                disguise_html: { type: string, maxLength: 65536, description: Custom disguise HTML used when disguise is custom_html. }
                panel_domain: { type: string, maxLength: 253, description: Reverse-proxy domain for direct access; automatically disables entry path and disguise when auto_disable_on_domain is true. }
                auto_disable_on_domain: { type: boolean, description: Automatically disable the secret entry path and disguise once a reverse-proxy domain is configured. }
                expected_revision: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Optimistic concurrency revision from the previous GET /api/v1/system/access response. }
      responses:
        '200':
          description: Updated panel access and disguise configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelAccessSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/system/backups:
    get:
      operationId: listSystemBackups
      tags: [system]
      summary: List consistent system backup archives
      description: Lists available host backup archives stored in the data directory backups folder. Administrators only.
      security:
        - sessionCookie: []
      responses:
