  # ---------------------------------------------------------------- agent sessions (ADR-0010 §5)
  /api/v1/agent-sessions:
    get:
      operationId: listAgentSessions
      tags: [agent-sessions]
      summary: List the caller's agent sessions
      description: |
        Only the sessions the caller owns. `status=attention` returns the sessions a floating window
        has to show (`waiting_approval` or `failed`); `status` may also be one exact
        `AgentSessionStatus`. Sessions are ordered newest first and paginate with `cursor`/`limit`;
        `since_revision` returns only sessions whose revision is newer.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: status
          in: query
          description: Only sessions in this state, or `attention` for waiting_approval and failed.
          schema: { $ref: '#/components/schemas/AgentSessionStatus' }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/SinceRevision'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAgentSession
      tags: [agent-sessions]
      summary: Create an agent session
      description: |
        Creates a session owned by the caller. `core` is `native` by default and `permission_mode` is
        `safe` by default; `config` holds the core configuration of ADR-0010 and never a secret nor a
        secret reference (`api_key_secret` is rejected): the native core's API key is stored with
        `PUT /api/v1/agent-sessions/{session_id}/api-key`. An unknown `core`,
        `permission_mode` or an invalid config returns `422`.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        A session is the caller's own chat state, not a host operation; a retried create is harmless
        and the client keeps the identifier of the session it actually got.
      x-qwq-action-exempt: |
        Agent sessions are per-user chat state and are not exposed to the AI action catalog; every
        tool call the agent makes still goes through operations.Run.
      requestBody:
        description: Session settings.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSessionCreateRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/AgentSessionIdPath'
    get:
      operationId: getAgentSession
      tags: [agent-sessions]
      summary: Get a session with its recent transcript and pending approvals
      description: |
        A session of another principal answers `404`, whatever its identifier is. `messages` is the
        retained window (the host keeps the newest 200 messages); `content_json` carries the
        structured tool-call fragments.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The session, its messages and its pending approvals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAgentSession
      tags: [agent-sessions]
      summary: Change a session's title or permission mode
      description: |
        Only the session's owner can change its permission mode; the mode is also never read from an
        agent turn, so an AI client cannot widen its own permissions (ADR-0010 §2.1). Switching to
        `read_only` rejects a pending write tool call that is waiting for approval; an operation that
        was already approved is not affected.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        The request is guarded by expected_revision; a replay either matches the recorded revision
        and changes nothing new or answers REVISION_CONFLICT, so no extra key is needed.
      x-qwq-action-exempt: |
        The permission mode is security-sensitive session state that only its owner may change; it is
        deliberately not an AI action.
      parameters:
        - $ref: '#/components/parameters/Fields'
      requestBody:
        description: The members to change, with the expected revision.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSessionUpdateRequest' }
      responses:
        '200':
          description: The updated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAgentSession
      tags: [agent-sessions]
      summary: Close a session and remove its transcript
      description: |
        Cancels a running turn, closes the event streams and deletes the session with its messages and
        tool calls. The operations audit keeps the record of what the agent did. `expected_revision`
        is optional; when present and stale the answer is `409 REVISION_CONFLICT`.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Deleting a chat session is bounded client-owned state; a repeat answers 404 and the host
        accepts that as the expected outcome of a retry.
      x-qwq-action-exempt: |
        A session delete removes private chat state only; it never changes the host's configuration or
        the state of the operations the agent ran.
      parameters:
        - name: expected_revision
          in: query
          required: false
          description: Optional concurrency guard; a mismatch returns REVISION_CONFLICT.
          schema: { $ref: '#/components/schemas/Revision' }
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-sessions/{session_id}/export:
    parameters:
      - $ref: '#/components/parameters/AgentSessionIdPath'
    get:
      operationId: exportAgentSession
      tags: [agent-sessions]
      summary: Export a session transcript as Markdown or JSON
      description: Downloads the full retained transcript and metadata of the caller's agent session as a Markdown (.md) or JSON (.json) file.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: format
          in: query
          description: Export file format (markdown or json).
          schema: { type: string, enum: [markdown, md, json] }
      responses:
        '200':
          description: Downloadable transcript attachment.
          content:
            text/markdown:
              schema: { type: string, maxLength: 10485760 }
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-sessions/{session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentSessionIdPath'
    get:
      operationId: listAgentMessages
      tags: [agent-sessions]
      summary: Page backwards through a session's transcript
      description: |
        The retained messages with `seq` lower than `before_seq`, the newest `limit` of them,
        oldest first. Without `before_seq` the page starts at the newest message; without `limit`
        the snapshot window of `GET /api/v1/agent-sessions/{id}` is used. Only the owner reads a
        session: another principal's identifier answers `404`.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: before_seq
          in: query
          description: Return only messages with a session sequence lower than this one.
          schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionMessageList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: sendAgentMessage
      tags: [agent-sessions]
      summary: Send a user message and start the turn that answers it
      description: |
        The message is stored and the core runs asynchronously; progress arrives on the session event
        stream. A second send while a turn is running or waiting for an approval answers
        `409 STATE_CONFLICT`. `client_message_id` makes a retry idempotent: the same value returns the
        message the first attempt created instead of appending a second one.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        A chat message is not a host operation; retries are made safe by the optional
        client_message_id member of the body instead of an Idempotency-Key header.
      x-qwq-action-exempt: |
        A message is input to the session's own core; the tool calls the core proposes are the only
        path to operations and each of them is judged on its own.
      requestBody:
        description: The user message.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSendMessageRequest' }
      responses:
        '201':
          description: The message was stored and the turn was started.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSendMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-sessions/{session_id}/api-key:
    parameters:
      - $ref: '#/components/parameters/AgentSessionIdPath'
    put:
      operationId: setAgentSessionAPIKey
      tags: [agent-sessions]
      summary: Store the native core's API key of a session
      description: |
        Replaces the session's API key. The key is encrypted as a secret owned by the session and is
        only ever sent as the bearer token of that session's model requests; it is deleted with the
        session. Only the owner can set it. Neither the key nor its reference is ever returned.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Storing the same key again leaves the same state, so a retry needs no stored key.
      x-qwq-action-exempt: |
        A credential of the caller's own chat session, not a managed host resource; audited.
      requestBody:
        description: The API key to store for this session.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSessionAPIKeyRequest' }
      responses:
        '200':
          description: The session after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: clearAgentSessionAPIKey
      tags: [agent-sessions]
      summary: Remove the native core's API key of a session
      description: |
        Deletes the session's API key; later model requests carry no Authorization header. Clearing
        a session without a key changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Clearing twice has no further effect.
      x-qwq-action-exempt: |
        A credential of the caller's own chat session, not a managed host resource; audited.
      responses:
        '200':
          description: The session after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-sessions/{session_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/AgentSessionIdPath'
    post:
      operationId: cancelAgentSession
      tags: [agent-sessions]
      summary: Cancel the current turn or a paused approval turn
      description: |
        Cooperative: a running turn is cancelled through its context (its tool calls are cancelled
        through operations), a turn waiting for an approval is rejected and ended. The terminal
        `turn.completed` event carries `cancelled`. Cancelling an idle session changes nothing.
      security:
        - sessionCookie: []
          csrfToken: []
        - serviceAccountToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: |
        Cancelling the same turn twice has no further effect, so the request is naturally idempotent
        and needs no stored key.
      x-qwq-action-exempt: |
        Cancelling a chat turn stops the caller's own session; operations started by the agent are
        cancelled by the runner, not by this route.
      requestBody:
        description: Optional reason for the transcript.
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSessionCancelRequest' }
      parameters:
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The session after the cancel request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-sessions/{session_id}/events:
    parameters:
      - $ref: '#/components/parameters/AgentSessionIdPath'
    get:
      operationId: streamAgentSession
      tags: [agent-sessions]
      summary: Session event stream (SSE)
      description: |
        `text/event-stream`. Every domain frame has `id: <seq>` (the session's monotonic sequence,
        shared by messages and tool calls) and one `data:` line of a JSON `AgentSessionEvent`, in the
        order the host published it. `event: resync` precedes the backlog when the requested position
        is older than the retained ring; the client then reloads `GET /agent-sessions/{id}` and
        continues from `head_sequence`. `event: ready` carries the head and the heartbeat interval;
        `event: heartbeat` follows every 15 s while the turn is quiet. Resume with the
        `Last-Event-ID` header or the `last_event_id` query parameter. A closed browser does not
        cancel the turn.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: Sequence of the last event received; EventSource sends it on reconnect.
          schema: { type: string, maxLength: 20, pattern: '^[0-9]+$' }
        - name: last_event_id
          in: query
          description: The same position, for a page reload that reopens the stream.
          schema: { type: string, maxLength: 20, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: The stream. Each frame's `data` is one AgentSessionEvent.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AgentSessionEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-sessions/{session_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/AgentSessionIdPath'
    get:
      operationId: listAgentSessionApprovals
      tags: [agent-sessions]
      summary: Pending approvals of one session
      description: |
        The tool calls of the session that wait for a human decision, with the plugin author's
        confirmation text. Deciding is done on `POST /api/v1/approvals/{approval_id}/decision` by a
        human browser session; the agent itself can never approve.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      responses:
        '200':
          description: The pending approvals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionApprovalList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- ai providers
  /api/v1/agent-cores:
    get:
      operationId: listAgentCores
      tags: [agent-sessions]
      summary: List the agent cores this host can run
      description: |
        The four cores of ADR-0010 in fixed order. `native` is the built-in core; the external
        CLIs are announced with `available: false` and a fixed reason until P6 wires their
        adapters. Any signed-in principal may read the list; a session picks a core at creation.
      security:
        - sessionCookie: []
        - serviceAccountToken: []
      responses:
        '200':
          description: The cores.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCoreList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
