      security:
        - sessionCookie: []
          csrfToken: []
      x-qwq-idempotency: exempt
      x-qwq-idempotency-reason: Each invocation creates a new timestamped backup archive and prunes older snapshots beyond the retention count.
      x-qwq-action-exempt: Direct host backup creation invoked by administrators; audited directly by the host API.
      responses:
        '201':
          description: Metadata of the newly created backup archive.
