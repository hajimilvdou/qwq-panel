syntax = "proto3";

package qwq.capability.docker.v1;

import "qwq/platform/v1/platform.proto";

// Host Capability service: controlled Docker Engine proxy & out-of-cgroup
// Compose runner (PLG-FIX-04 / PLG-FIX-05).
//
// Capabilities:
//   - system.docker.read:self   -> ProxyRead (allowlisted GET endpoints only)
//   - system.docker.manage:self -> ProxyWrite (allowlisted POST/DELETE) & ComposeAction
//
// The host helper (qwq-capability) pins /var/run/docker.sock and enforces strict
// endpoint allowlisting and Compose YAML safety checks outside the plugin's
// 32 MiB cgroup so container management works under DynamicUser=yes without
// exposing raw docker.sock root escape primitives.

service DockerService {
  // Proxies an allowlisted read-only Docker Engine GET endpoint.
  // effect=read, risk=low.
  rpc ProxyRead(ProxyReadRequest) returns (ProxyReadResponse);
  // Proxies an allowlisted mutating Docker Engine POST/DELETE endpoint.
  // effect=write, risk=high.
  rpc ProxyWrite(ProxyWriteRequest) returns (ProxyWriteResponse);
  // Runs host-verified `docker compose up -d` or `down` outside the plugin cgroup.
  // effect=write, risk=high.
  rpc ComposeAction(ComposeActionRequest) returns (ComposeActionResponse);
  // Lists host bindable IP addresses (127.0.0.1, ::1, 0.0.0.0, ::, and active NIC IPs).
  // effect=read, risk=low.
  rpc ListBindableIPs(ListBindableIPsRequest) returns (ListBindableIPsResponse);
  // Creates a controlled Docker bridge/overlay network (never host/macvlan/ipvlan).
  // effect=write, risk=medium.
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  // Connects or disconnects a container to/from a Docker network with optional aliases and static IP.
  // effect=write, risk=medium.
  rpc MutateContainerNetwork(MutateContainerNetworkRequest) returns (MutateContainerNetworkResponse);
  // Atomically recreates a container with new port bindings using a rollback-safe Saga.
  // effect=write, risk=high.
  rpc RecreateContainerPorts(RecreateContainerPortsRequest) returns (RecreateContainerPortsResponse);
}

message ProxyReadRequest {
  qwq.platform.v1.HostCallContext context = 1;
  // Clean relative Engine API path such as "/info" or "/containers/json".
  string path = 2;
  // URL-encoded query string without leading "?".
  string raw_query = 3;
}

message ProxyReadResponse {
  int32 status_code = 1;
  bytes body = 2;
  qwq.platform.v1.ErrorDetail error = 3;
}

message ProxyWriteRequest {
  qwq.platform.v1.HostCallContext context = 1;
  // HTTP method: POST or DELETE.
  string method = 2;
  // Clean relative Engine API path on the host allowlist.
  string path = 3;
  // URL-encoded query string without leading "?".
  string raw_query = 4;
  // Optional JSON request body.
  bytes body = 5;
}

message ProxyWriteResponse {
  int32 status_code = 1;
  bytes body = 2;
  qwq.platform.v1.ErrorDetail error = 3;
}

message ComposeActionRequest {
  qwq.platform.v1.HostCallContext context = 1;
  string stack_name = 2;
  // Action: "up" or "down".
  string action = 3;
  // Full compose YAML verified on the host helper before execution.
  string yaml_content = 4;
}

message ComposeActionResponse {
  string output = 1;
  repeated string warnings = 2;
  qwq.platform.v1.ErrorDetail error = 3;
}

message ListBindableIPsRequest {
  qwq.platform.v1.HostCallContext context = 1;
}

message BindableIP {
  string ip = 1;
  string family = 2;
  string iface = 3;
  string scope = 4;
  bool recommended = 5;
  string label = 6;
  bool is_ipv6 = 7;
}

message ListBindableIPsResponse {
  repeated BindableIP ips = 1;
  qwq.platform.v1.ErrorDetail error = 2;
}

message CreateNetworkRequest {
  qwq.platform.v1.HostCallContext context = 1;
  string name = 2;
  string driver = 3;
  string subnet = 4;
  string gateway = 5;
  bool internal = 6;
  bool enable_ipv6 = 7;
  map<string, string> labels = 8;
}

message CreateNetworkResponse {
  string network_id = 1;
  string name = 2;
  qwq.platform.v1.ErrorDetail error = 3;
}

message MutateContainerNetworkRequest {
  qwq.platform.v1.HostCallContext context = 1;
  string container_id = 2;
  string action = 3;
  string network_id = 4;
  repeated string aliases = 5;
  string ipv4_address = 6;
  bool force = 7;
  string ipv6_address = 8;
}

message MutateContainerNetworkResponse {
  bool ok = 1;
  qwq.platform.v1.ErrorDetail error = 2;
}

message PortBindingSpec {
  int32 container_port = 1;
  string protocol = 2;
  string host_ip = 3;
  int32 host_port = 4;
  string bind_mode = 5;
  bool include_ipv6 = 6;
}

message RecreateContainerPortsRequest {
  qwq.platform.v1.HostCallContext context = 1;
  string container_id = 2;
  repeated PortBindingSpec bindings = 3;
  bool commit_writable_layer = 4;
  bool allow_port_override = 5;
  bool allow_discard_writable_layer = 6;
  optional bool start_after_recreate = 7;
}

message RecreateContainerPortsResponse {
  string new_container_id = 1;
  string old_container_id = 2;
  string committed_image = 3;
  repeated string warnings = 4;
  qwq.platform.v1.ErrorDetail error = 5;
  string container_name = 6;
  repeated PortBindingSpec applied_bindings = 7;
  int64 writable_size_bytes = 8;
}
