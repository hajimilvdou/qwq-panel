#
# Installed as /usr/lib/tmpfiles.d/qwq.conf. It creates the whole directory
# skeleton of the PRIV-01 layout (docs/adr/0012-root-owned-runtime-layout.md).
#
# The rule of the layout: every directory the root helper writes below has a
# root-owned ancestry that qwq cannot rename or replace. The helper refuses to
# work otherwise (sandbox.OpenTrustedRoot), so a compromised controller cannot
# swap a root directory for a symlink to /etc.
#
# /run/qwq must exist before qwq-privileged.socket starts: a socket unit cannot
# create the directory its ListenStream lives in, and the socket is created
# root:qwq 0660 (SocketMode/SocketGroup in deployments/systemd/
# qwq-privileged.socket) so only the qwq user can connect to the helper.
#
# /var/lib/qwq/staging is the staging root of the plugin installer. It must be
# writable by qwq (the controller verifies and unpacks a package there); the
# helper only reads it and copies the tree into the root-owned
# /var/lib/qwq-plugins, so the two need not share a filesystem.
#
# 0711 on /run/qwq, plugin/ and link/: a plugin's DynamicUser must traverse
# them to reach its bind target, but cannot list or write them. /run/qwq/host
# is the only runtime directory the controller can write.
#
# type path                        mode user group age
d /var/lib/qwq                     0700 qwq  qwq  -
d /var/lib/qwq/staging             0700 qwq  qwq  -
d /var/lib/qwq-plugins             0755 root root -
d /var/lib/qwq-plugin-data         0711 root root -
d /etc/nftables.d                 0755 root root -
d /var/lib/qwq-privileged              0710 root qwq  -
d /var/lib/qwq-capability              0700 root root -
d /var/lib/qwq-privileged/creds        0700 root root -
d /var/lib/qwq-privileged/backup-stage 0750 root qwq  -
d /run/qwq                         0711 root root -
d /run/qwq/plugin                  0711 root root -
d /run/qwq/link                    0711 root root -
d /run/qwq/host                    0750 qwq  qwq  -
