// Xray v26.11.9 / 676eaf66 的 StatsService 最小兼容子集。
// 来源与许可证记录在本目录 README.md；仅保留已验证的 QueryStats RPC。
syntax = "proto3";

package xray.app.stats.command;

option go_package = "github.com/qwq-panel/qwq/internal/xraycore/xrayapi/wire";

message Stat {
  string name = 1;
  int64 value = 2;
}

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
}
