<html lang="zh-CN" data-theme="light" data-motion="reduced">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNS 托管</title>
  <script src="dns.js" defer></script>
</head>
<body>
<main id="dns-app">
  <header>
    <h1>DNS 托管与解析校验</h1>
    <p id="status" role="status">正在连接宿主...</p>
  </header>
  <section aria-label="提供商概览">

    <button id="refresh" type="button">刷新摘要</button>
  </section>
</main>

</html>
