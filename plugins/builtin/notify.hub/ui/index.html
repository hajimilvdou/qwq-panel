<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>统一告警与通知中枢</title>
  <style>
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: #f6f3ed; --surface: #fdfbf8; --surface-2: #f1ece3;
      --line: #e8e1d6; --line-strong: #d5cbbe;
      --text: #2a211b; --text-2: #685a50; --text-3: #96887d;
      --cocoa: #6b4c3b; --on-cocoa: #fdfbf8;
      --berry: #b83b6a; --berry-soft: #fae8ef;
      --jade: #1e9c8b; --jade-soft: #e2f5f2;
      --amber: #d99422; --amber-soft: #fbf0db;
      --brick: #b5352b; --brick-soft: #fae5e3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #151210; --surface: #1e1a17; --surface-2: #28221e;
      --line: #312923; --line-strong: #463b32;
      --text: #f3ede6; --text-2: #b5a89d; --text-3: #83766c;
      --cocoa: #9d755d; --on-cocoa: #17120e;
      --berry: #e05d8e; --berry-soft: rgba(224, 93, 142, 0.18);
      --jade: #32c2ae; --jade-soft: rgba(50, 194, 174, 0.16);
      --amber: #ebb044; --amber-soft: rgba(235, 176, 68, 0.16);
      --brick: #ef6b61; --brick-soft: rgba(239, 107, 97, 0.18);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .title { margin: 0; font-size: 18px; font-weight: 650; }
    .sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .tabs { display: flex; gap: 6px; background: var(--surface); padding: 4px; border: 1px solid var(--line); border-radius: 10px; }
    .tabs button { background: transparent; color: var(--text-2); border: 0; padding: 7px 14px; border-radius: 7px; font-weight: 550; cursor: pointer; font-size: 13px; }
    .tabs button.active { background: var(--cocoa); color: var(--on-cocoa); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .stat .k { font-size: 12px; color: var(--text-2); }
    .stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 12px; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-2); }
    input, select, textarea { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn { padding: 8px 14px; border-radius: 8px; border: 0; background: var(--cocoa); color: var(--on-cocoa); font-weight: 550; cursor: pointer; font-size: 13px; }
    .btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--text); }
    .btn.danger { background: var(--brick-soft); color: var(--brick); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.ok { background: var(--jade-soft); color: var(--jade); }
    .badge.warn { background: var(--amber-soft); color: var(--amber); }
    .badge.err { background: var(--brick-soft); color: var(--brick); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; color: var(--text-2); font-weight: 600; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <main id="notify-root">
    <div class="topbar">
      <div>
        <h2 class="title">统一告警与通知中枢</h2>
        <div class="sub">覆盖 Telegram / 飞书 / 钉钉 / 企业微信 / Discord / SMTP / 签名 Webhook · <span id="bridge-status">连接中…</span></div>
      </div>
      <div class="tabs" id="nav-tabs">
        <button data-tab="channels" class="active" type="button">通知渠道</button>
        <button data-tab="rules" type="button">路由与静默规则</button>
        <button data-tab="deliveries" type="button">投递记录与演练</button>
      </div>
    </div>

    <section class="stats">
      <div class="stat"><div class="k">已启用渠道</div><div class="v" id="st-channels">-</div></div>
      <div class="stat"><div class="k">路由规则</div><div class="v" id="st-rules">-</div></div>
      <div class="stat"><div class="k">24h 成功投递</div><div class="v" id="st-sent">-</div></div>
      <div class="stat"><div class="k">24h 降噪 / 失败</div><div class="v" id="st-fail">-</div></div>
    </section>

    <section data-pane="channels" class="card">
      <h3>添加 / 更新通知渠道（密钥 AES-256-GCM 加密存储）</h3>
      <div class="form-grid">
        <label>渠道名称 <input id="ch-name" placeholder="如 运维主群 Telegram" /></label>
        <label>通道类型
          <select id="ch-kind">
            <option value="telegram">Telegram Bot</option>
            <option value="feishu">飞书机器人（支持加签）</option>
            <option value="dingtalk">钉钉机器人（支持加签）</option>
            <option value="wecom">企业微信机器人</option>
            <option value="discord">Discord Webhook</option>
            <option value="webhook">自定义签名 Webhook</option>
            <option value="smtp">SMTP 邮件</option>
          </select>
        </label>
        <label>Webhook URL / SMTP 主机 <input id="ch-url" placeholder="https://... 或 smtp.example.com" /></label>
        <label>Bot Token / 签名密钥 / SMTP 密码 <input id="ch-secret" type="password" placeholder="加密保存，留空保留原值" /></label>
        <label>Chat ID / 收件邮箱 (逗号分隔) <input id="ch-target" placeholder="-100123456 或 ops@example.com" /></label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-save-ch" type="button">加密保存渠道</button>
        <button class="btn ghost" id="btn-refresh" type="button">刷新状态</button>
      </div>
      <table>
        <thead><tr><th>名称</th><th>类型</th><th>脱敏配置</th><th>最近状态</th><th>操作</th></tr></thead>
        <tbody id="channels-tbody"></tbody>
      </table>
    </section>

    <section data-pane="rules" class="card" hidden>
      <h3>告警路由、聚合冷却与静默时段</h3>
      <div class="form-grid">
        <label>规则名称 <input id="rl-name" placeholder="如 探针与安全高危告警" /></label>
        <label>来源匹配（支持 * 通配） <input id="rl-src" value="*" /></label>
        <label>最低告警级别
          <select id="rl-sev">
            <option value="info">info 及以上</option>
            <option value="warn" selected>warn 及以上</option>
            <option value="critical">仅 critical</option>
          </select>
        </label>
        <label>目标渠道 ID（逗号分隔） <input id="rl-chs" placeholder="从渠道列表复制 nch_..." /></label>
        <label>同事件冷却时间 (秒) <input id="rl-cool" type="number" value="300" min="0" max="86400" /></label>
        <label>静默开始 (HH:MM) <input id="rl-qs" placeholder="如 23:00" /></label>
        <label>静默结束 (HH:MM) <input id="rl-qe" placeholder="如 07:30" /></label>
        <label>时区 <input id="rl-tz" value="Asia/Shanghai" /></label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-save-rl" type="button">保存路由规则</button>
      </div>
      <table>
        <thead><tr><th>规则名</th><th>来源</th><th>级别</th><th>冷却</th><th>静默窗口</th><th>操作</th></tr></thead>
        <tbody id="rules-tbody"></tbody>
      </table>
    </section>

    <section data-pane="deliveries" class="card" hidden>
      <h3>模拟告警分发与投递审计</h3>
      <div class="form-grid">
        <label>事件来源 <input id="dp-src" value="server.probe" /></label>
        <label>严重级别
          <select id="dp-sev">
            <option value="info">info</option>
            <option value="warn" selected>warn</option>
            <option value="critical">critical</option>
          </select>
        </label>
        <label>告警标题 <input id="dp-title" value="节点 CPU 负载告警演练" /></label>
        <label>告警正文 <input id="dp-msg" value="节点 hk-edge-01 5 分钟负载达到 3.2，请核查。" /></label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-dispatch" type="button">触发演练分发</button>
      </div>
      <table>
        <thead><tr><th>来源</th><th>级别</th><th>标题</th><th>通道</th><th>结果</th><th>尝试</th></tr></thead>
        <tbody id="deliveries-tbody"></tbody>
      </table>
    </section>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const statusEl = document.getElementById('bridge-status');
      let port = null;
      let seq = 0;
      const pending = new Map();

      const setStatus = (t) => { statusEl.textContent = t; };
      const runAction = async (fn, okMsg) => {
        try {
          await fn();
          if (okMsg) setStatus(okMsg);
        } catch (err) {
          setStatus('操作失败：' + (err?.message || '未知错误'));
        }
      };
      const send = (msg) => { if (port) port.postMessage(msg); };
      const invoke = (operation, payload = {}) => new Promise((resolve, reject) => {
        if (!port) return reject(new Error('宿主桥尚未就绪'));
        const id = `nh_${++seq}`;
        pending.set(id, { resolve, reject });
        send({ t: 'api.invoke', id, operation, payload });
      });

      document.getElementById('nav-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-tab]');
        if (!btn) return;
        for (const b of document.querySelectorAll('#nav-tabs button')) b.classList.toggle('active', b === btn);
        for (const p of document.querySelectorAll('[data-pane]')) p.hidden = p.dataset.pane !== btn.dataset.tab;
      });

      function badge(status) {
        const span = document.createElement('span');
        span.className = 'badge ' + (status === 'ok' || status === 'sent' ? 'ok' : (status === 'error' || status === 'failed' ? 'err' : 'warn'));
        span.textContent = status;
        return span;
      }

      async function refresh() {
        try {
          const data = await invoke('notify.overview', {});
          const chs = data.channels || [];
          const rls = data.rules || [];
          const dels = data.deliveries || [];
          document.getElementById('st-channels').textContent = String(chs.filter((c) => c.enabled).length);
          document.getElementById('st-rules').textContent = String(rls.length);
          document.getElementById('st-sent').textContent = String(data.sent_24h || 0);
          document.getElementById('st-fail').textContent = `${data.suppressed_24h || 0} / ${data.failed_24h || 0}`;

          const ct = document.getElementById('channels-tbody');
          ct.replaceChildren();
          for (const c of chs) {
            const tr = document.createElement('tr');
            for (const txt of [c.name + ' (' + c.id + ')', c.kind, JSON.stringify(c.config_masked || {})]) {
              const td = document.createElement('td'); td.textContent = txt; tr.appendChild(td);
            }
            const stTd = document.createElement('td'); stTd.appendChild(badge(c.last_status || 'unknown')); tr.appendChild(stTd);
            const act = document.createElement('td');
            const tBtn = document.createElement('button'); tBtn.className = 'btn ghost'; tBtn.type = 'button'; tBtn.textContent = '测试';
            tBtn.addEventListener('click', () => void runAction(async () => {
              const r = await invoke('notify.channel.test', { id: c.id });
              await refresh();
              setStatus(r.ok ? `渠道 ${c.name} 测试成功 (HTTP ${r.http_status})` : `测试失败：${r.error || '未知错误'}`);
            }));
            const dBtn = document.createElement('button'); dBtn.className = 'btn danger'; dBtn.type = 'button'; dBtn.textContent = '删除'; dBtn.style.marginLeft = '6px';
            dBtn.addEventListener('click', () => {
              if (!window.confirm(`确认删除通知渠道「${c.name}」及其加密凭据？`)) return;
              void runAction(async () => { await invoke('notify.channel.delete', { id: c.id }); await refresh(); }, `已删除渠道 ${c.name}`);
            });
            act.append(tBtn, dBtn);
            tr.appendChild(act);
            ct.appendChild(tr);
          }

          const rt = document.getElementById('rules-tbody');
          rt.replaceChildren();
          for (const r of rls) {
            const tr = document.createElement('tr');
            const quiet = r.quiet_start ? `${r.quiet_start}-${r.quiet_end} (${r.quiet_tz})` : '关闭';
            for (const txt of [r.name, r.source_pattern, r.min_severity, `${r.cooldown_sec}s`, quiet]) {
              const td = document.createElement('td'); td.textContent = txt; tr.appendChild(td);
            }
            const act = document.createElement('td');
            const dBtn = document.createElement('button'); dBtn.className = 'btn danger'; dBtn.type = 'button'; dBtn.textContent = '删除';
            dBtn.addEventListener('click', () => {
              if (!window.confirm(`确认删除路由规则「${r.name}」？`)) return;
              void runAction(async () => { await invoke('notify.rule.delete', { id: r.id }); await refresh(); }, `已删除规则 ${r.name}`);
            });
            act.appendChild(dBtn); tr.appendChild(act);
            rt.appendChild(tr);
          }

          const dt = document.getElementById('deliveries-tbody');
          dt.replaceChildren();
          for (const d of dels) {
            const tr = document.createElement('tr');
            for (const txt of [d.source, d.severity, d.title, d.channel_name]) {
              const td = document.createElement('td'); td.textContent = txt; tr.appendChild(td);
            }
            const stTd = document.createElement('td'); stTd.appendChild(badge(d.status)); tr.appendChild(stTd);
            const atTd = document.createElement('td'); atTd.textContent = String(d.attempts || 0); tr.appendChild(atTd);
            dt.appendChild(tr);
          }
          setStatus('已连接');
        } catch (err) {
          setStatus('加载失败：' + (err.message || '未知错误'));
        }
      }

      document.getElementById('btn-refresh').addEventListener('click', () => void refresh());
      document.getElementById('btn-save-ch').addEventListener('click', () => void runAction(async () => {
        const kind = document.getElementById('ch-kind').value;
        const urlVal = document.getElementById('ch-url').value.trim();
        const secretVal = document.getElementById('ch-secret').value.trim();
        const targetVal = document.getElementById('ch-target').value.trim();
        const config = {};
        if (kind === 'telegram') {
          config.bot_token = secretVal; config.chat_id = targetVal;
          if (urlVal) config.api_base = urlVal;
        } else if (kind === 'smtp') {
          config.smtp_host = urlVal; config.smtp_port = 587; config.smtp_pass = secretVal;
          config.smtp_from = targetVal.split(',')[0]?.trim() || '';
          config.smtp_to = targetVal.split(',').map((s) => s.trim()).filter(Boolean);
        } else {
          config.webhook_url = urlVal;
          if (secretVal) config.secret = secretVal;
        }
        await invoke('notify.channel.upsert', { name: document.getElementById('ch-name').value.trim(), kind, enabled: true, config });
        document.getElementById('ch-secret').value = '';
        await refresh();
      }, '渠道已加密保存'));

      document.getElementById('btn-save-rl').addEventListener('click', () => void runAction(async () => {
        await invoke('notify.rule.upsert', {
          name: document.getElementById('rl-name').value.trim(),
          enabled: true,
          source_pattern: document.getElementById('rl-src').value.trim() || '*',
          min_severity: document.getElementById('rl-sev').value,
          channel_ids: document.getElementById('rl-chs').value.split(',').map((s) => s.trim()).filter(Boolean),
          cooldown_sec: Number(document.getElementById('rl-cool').value || 300),
          quiet_start: document.getElementById('rl-qs').value.trim(),
          quiet_end: document.getElementById('rl-qe').value.trim(),
          quiet_tz: document.getElementById('rl-tz').value.trim() || 'UTC',
          allow_critical_bypass: true,
        });
        await refresh();
      }, '路由规则已保存'));

      document.getElementById('btn-dispatch').addEventListener('click', () => void runAction(async () => {
        const res = await invoke('notify.dispatch', {
          source: document.getElementById('dp-src').value.trim(),
          severity: document.getElementById('dp-sev').value,
          title: document.getElementById('dp-title').value.trim(),
          message: document.getElementById('dp-msg').value.trim(),
        });
        await refresh();
        setStatus(`演练分发完成：命中 ${res.matched_rules} 条规则，成功 ${res.sent} / 降噪 ${res.suppressed} / 失败 ${res.failed}`);
      }));

      function accept(data) {
        if (!data || typeof data !== 'object') return;
        if (data.t === 'api.result' && pending.has(data.id)) {
          const p = pending.get(data.id); pending.delete(data.id);
          if (data.ok) p.resolve(data.payload); else p.reject(new Error(data.error?.detail || data.error?.code || 'invoke failed'));
        } else if (data.t === 'ui.settings' && (data.theme === 'light' || data.theme === 'dark')) {
          root.dataset.theme = data.theme;
        }
      }

      new ResizeObserver(() => {
        send({ t: 'ui.resize', height: Math.ceil(document.getElementById('notify-root').getBoundingClientRect().height) + 24 });
      }).observe(document.getElementById('notify-root'));

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || event.data?.t !== 'plugin.port' || !event.ports[0] || port) return;
        port = event.ports[0];
        port.onmessage = (m) => accept(m.data);
        send({ t: 'ui.ready' });
        void refresh();
      });

      window.parent.postMessage({ t: 'plugin.hello', kit_major: 1 }, '*');
    })();
  </script>
</body>
</html>
