<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>统一告警与通知中枢</title>
  <link rel="stylesheet" href="./plugin.css" />
</head>
<body>
  <main id="notify-root">
    <div class="topbar">
      <div>
        <h2 class="title">统一告警与通知中枢</h2>
        <div class="sub">覆盖 Telegram / 飞书 / 钉钉 / 企业微信 / Discord / SMTP / 签名 Webhook · <span id="bridge-status">连接中…</span></div>
      </div>
      <div class="tabs" id="nav-tabs">
        <button data-tab="channels" class="active" type="button">通知渠道</button>
        <button data-tab="rules" type="button">路由与静默规则</button>
        <button data-tab="deliveries" type="button">投递记录与演练</button>
      </div>
    </div>

    <section class="stats">
      <div class="stat"><div class="k">已启用渠道</div><div class="v" id="st-channels">-</div></div>
      <div class="stat"><div class="k">路由规则</div><div class="v" id="st-rules">-</div></div>
      <div class="stat"><div class="k">24h 成功投递</div><div class="v" id="st-sent">-</div></div>
      <div class="stat"><div class="k">24h 降噪 / 失败</div><div class="v" id="st-fail">-</div></div>
    </section>

    <section data-pane="channels" class="card">
      <h3>添加 / 更新通知渠道（密钥 AES-256-GCM 加密存储）</h3>
      <div class="form-grid">
        <label>渠道名称 <input id="ch-name" placeholder="如 运维主群 Telegram" /></label>
        <label>通道类型
          <select id="ch-kind">
            <option value="telegram">Telegram Bot</option>
            <option value="feishu">飞书机器人（支持加签）</option>
            <option value="dingtalk">钉钉机器人（支持加签）</option>
            <option value="wecom">企业微信机器人</option>
            <option value="discord">Discord Webhook</option>
            <option value="webhook">自定义签名 Webhook</option>
            <option value="smtp">SMTP 邮件</option>
          </select>
        </label>
        <label>Webhook URL / SMTP 主机 <input id="ch-url" placeholder="https://... 或 smtp.example.com" /></label>
        <label>Bot Token / 签名密钥 / SMTP 密码 <input id="ch-secret" type="password" placeholder="加密保存，留空保留原值" /></label>
        <label>Chat ID / 收件邮箱 (逗号分隔) <input id="ch-target" placeholder="-100123456 或 ops@example.com" /></label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-save-ch" type="button">加密保存渠道</button>
        <button class="btn ghost" id="btn-refresh" type="button">刷新状态</button>
      </div>
      <table>
        <thead><tr><th>名称</th><th>类型</th><th>脱敏配置</th><th>最近状态</th><th>操作</th></tr></thead>
        <tbody id="channels-tbody"></tbody>
      </table>
    </section>

    <section data-pane="rules" class="card" hidden>
      <h3>告警路由、聚合冷却与静默时段</h3>
      <div class="form-grid">
        <label>规则名称 <input id="rl-name" placeholder="如 探针与安全高危告警" /></label>
        <label>来源匹配（支持 * 通配） <input id="rl-src" value="*" /></label>
        <label>最低告警级别
          <select id="rl-sev">
            <option value="info">info 及以上</option>
            <option value="warn" selected>warn 及以上</option>
            <option value="critical">仅 critical</option>
          </select>
        </label>
        <label>目标渠道 ID（逗号分隔） <input id="rl-chs" placeholder="从渠道列表复制 nch_..." /></label>
        <label>同事件冷却时间 (秒) <input id="rl-cool" type="number" value="300" min="0" max="86400" /></label>
        <label>静默开始 (HH:MM) <input id="rl-qs" placeholder="如 23:00" /></label>
        <label>静默结束 (HH:MM) <input id="rl-qe" placeholder="如 07:30" /></label>
        <label>时区 <input id="rl-tz" value="Asia/Shanghai" /></label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-save-rl" type="button">保存路由规则</button>
      </div>
      <table>
        <thead><tr><th>规则名</th><th>来源</th><th>级别</th><th>冷却</th><th>静默窗口</th><th>操作</th></tr></thead>
        <tbody id="rules-tbody"></tbody>
      </table>
    </section>

    <section data-pane="deliveries" class="card" hidden>
      <h3>模拟告警分发与投递审计</h3>
      <div class="form-grid">
        <label>事件来源 <input id="dp-src" value="server.probe" /></label>
        <label>严重级别
          <select id="dp-sev">
            <option value="info">info</option>
            <option value="warn" selected>warn</option>
            <option value="critical">critical</option>
          </select>
        </label>
        <label>告警标题 <input id="dp-title" value="节点 CPU 负载告警演练" /></label>
        <label>告警正文 <input id="dp-msg" value="节点 hk-edge-01 5 分钟负载达到 3.2，请核查。" /></label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-dispatch" type="button">触发演练分发</button>
      </div>
      <table>
        <thead><tr><th>来源</th><th>级别</th><th>标题</th><th>通道</th><th>结果</th><th>尝试</th></tr></thead>
        <tbody id="deliveries-tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="./plugin.js"></script>
</body>
</html>
