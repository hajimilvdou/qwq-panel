<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基础安全</title>
  <link rel="stylesheet" href="./plugin.css">
</head>
<body>
  <main id="security-root">
    <header>
      <div>
        <h1>基础安全</h1>
        <div id="status" class="muted">正在连接宿主…</div>
      </div>
      <div class="row">
        <button id="refresh" type="button">刷新状态</button>
      </div>
    </header>

    <section class="grid">
      <article class="card">
        <h2>安全概览</h2>
        <div id="overview-summary">等待读取…</div>
        <div id="overview-sub" class="muted"></div>
      </article>
      <article class="card">
        <h2>防火墙与共存检测</h2>
        <div id="fw-summary">等待读取…</div>
        <div id="conflicts-summary" class="muted"></div>
      </article>
      <article class="card">
        <h2>SSH 基线与改端口事务</h2>
        <div id="sshd-summary">等待读取…</div>
        <div id="saga-summary" class="muted"></div>
      </article>
      <article class="card">
        <h2>防爆破封禁</h2>
        <div id="ban-summary">等待读取…</div>
        <div id="ban-mode" class="muted"></div>
      </article>
    </section>

    <section class="card">
      <h2>浏览器本地生成 Ed25519 SSH 密钥</h2>
      <div class="muted">私钥仅在浏览器本地生成并触发下载，绝不上传至服务器；仅自动提交 OpenSSH 公钥（不支持 WebCrypto Ed25519 时将提示回退路径）。</div>
      <div class="row">
        <label for="key-user">目标用户</label>
        <input id="key-user" type="text" value="root" placeholder="root" autocomplete="off">
        <label for="key-comment">公钥备注</label>
        <input id="key-comment" type="text" value="qwq-browser" placeholder="qwq-browser" autocomplete="off">
        <button id="gen-ed25519" class="primary" type="button">本地生成并下载私钥</button>
        <button id="copy-pubkey" type="button" hidden>复制公钥</button>
      </div>
      <div id="key-feedback" class="muted" aria-live="polite"></div>
      <pre id="key-pubkey" hidden></pre>
    </section>
  </main>
  <script src="security.js"></script>
</body>
</html>
