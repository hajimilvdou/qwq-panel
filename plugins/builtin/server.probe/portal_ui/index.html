<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="zh-CN" data-theme="light" data-style="classic" data-glass-tint="light" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qwq Probe · 服务器实时探针</title>
  <link rel="stylesheet" href="portal.css">
  <script src="portal.js" defer></script>
</head>
<body>
  <!-- 动态透明水玻璃光学背景层（Classic 模式下隐藏，Liquid Glass 模式下激活） -->
  <div id="bg-stage" class="bg-stage" aria-hidden="true">
    <div class="aurora-layer"></div>
    <img id="bg-lqip" class="bg-img bg-lqip" alt="" hidden>
    <img id="bg-hd" class="bg-img bg-hd" alt="" hidden>
  </div>
  <div id="bg-veil" class="bg-veil" aria-hidden="true"></div>
  <div id="bg-caustic" class="bg-caustic" aria-hidden="true"></div>

  <div class="wrap">
    <header class="topbar glass-surface">
      <div class="brand-group">
        <strong id="site-title" class="site-title">qwq Probe · 全球服务器实时探针</strong>
        <span id="site-sub" class="site-sub">单向零入站安全遥测</span>
      </div>
      <div class="toolbar">
        <button type="button" class="pill active" data-view="orb-cards">卡片视图</button>
        <button type="button" class="pill" data-view="compact-list">极简列表</button>
        <button type="button" class="pill" data-view="tty-terminal">极客 TTY</button>
        <button type="button" class="pill" id="theme-toggle">深浅色</button>
        <a class="pill berry admin-link" id="admin-switch-btn" href="./admin">切换后台管理</a>
      </div>
    </header>

    <div class="banner glass-surface" id="status-banner" data-level="ok">
      <span class="banner-left">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="banner-text">所有监控节点与拨测链路运行正常</span>
      </span>
      <span id="fleet-summary" class="fleet-summary">实时刷新中</span>
    </div>

    <section id="public-showcase">
      <div id="nodes-container" class="cards"></div>
      <div id="tty-container" class="tty glass-surface" hidden>
        <pre id="tty-output" class="tty-output"></pre>
        <div class="tty-prompt">
          <span>visitor@qwq-probe:~$ </span>
          <input id="tty-input" type="text" placeholder="输入 help / ls / top / ping / admin / clear">
        </div>
      </div>
    </section>
  </div>

  <!-- 私有探针访客口令解锁弹窗 -->
  <div class="modal-mask" id="visitor-lock-modal" hidden>
    <form class="modal glass-surface" id="visitor-lock-form">
      <h3 class="modal-title">私有探针访问保护</h3>
      <p class="modal-desc" id="visitor-lock-msg">当前探针已启用私有访问保护，请输入访客查看口令。</p>
      <input id="visitor-password" type="password" placeholder="输入访客口令" autocomplete="current-password" required>
      <p class="modal-err" id="visitor-lock-err" hidden></p>
      <div class="modal-actions">
        <a class="pill admin-link" id="lock-admin-link" href="./admin">管理员后台</a>
        <button type="submit" class="pill berry">解锁查看</button>
      </div>
    </form>
  </div>
</body>
</html>
