<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>轻量反向代理与站点托管</title>
  <style>
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: #f6f3ed; --surface: #fdfbf8; --surface-2: #f1ece3;
      --line: #e8e1d6; --line-strong: #d5cbbe;
      --text: #2a211b; --text-2: #685a50; --text-3: #96887d;
      --cocoa: #6b4c3b; --on-cocoa: #fdfbf8;
      --jade: #1e9c8b; --jade-soft: #e2f5f2;
      --amber: #d99422; --amber-soft: #fbf0db;
      --brick: #b5352b; --brick-soft: #fae5e3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #151210; --surface: #1e1a17; --surface-2: #28221e;
      --line: #312923; --line-strong: #463b32;
      --text: #f3ede6; --text-2: #b5a89d; --text-3: #83766c;
      --cocoa: #9d755d; --on-cocoa: #17120e;
      --jade: #32c2ae; --jade-soft: rgba(50, 194, 174, 0.16);
      --amber: #ebb044; --amber-soft: rgba(235, 176, 68, 0.16);
      --brick: #ef6b61; --brick-soft: rgba(239, 107, 97, 0.18);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .title { margin: 0; font-size: 18px; font-weight: 650; }
    .sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .tabs { display: flex; gap: 6px; background: var(--surface); padding: 4px; border: 1px solid var(--line); border-radius: 10px; }
    .tabs button { background: transparent; color: var(--text-2); border: 0; padding: 7px 14px; border-radius: 7px; font-weight: 550; cursor: pointer; font-size: 13px; }
    .tabs button.active { background: var(--cocoa); color: var(--on-cocoa); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .stat .k { font-size: 12px; color: var(--text-2); }
    .stat .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 12px; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-2); }
    input, select, pre { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); font-size: 13px; }
    pre { overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; max-height: 280px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn { padding: 8px 14px; border-radius: 8px; border: 0; background: var(--cocoa); color: var(--on-cocoa); font-weight: 550; cursor: pointer; font-size: 13px; }
    .btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--text); }
    .btn.danger { background: var(--brick-soft); color: var(--brick); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.ok { background: var(--jade-soft); color: var(--jade); }
    .badge.warn { background: var(--amber-soft); color: var(--amber); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; color: var(--text-2); font-weight: 600; }
  </style>
</head>
<body>
  <main id="ingress-root">
    <div class="topbar">
      <div>
        <h2 class="title">轻量反向代理与站点托管</h2>
        <div class="sub">零依赖内置 Go 反代 + Caddy/Nginx 确定性生成与一键回滚 · <span id="bridge-status">连接中…</span></div>
      </div>
      <div class="tabs" id="nav-tabs">
        <button data-tab="sites" class="active" type="button">反代站点</button>
        <button data-tab="preview" type="button">配置预览与热重载</button>
        <button data-tab="snapshots" type="button">快照回滚</button>
      </div>
    </div>

    <section class="stats">
      <div class="stat"><div class="k">活动引擎</div><div class="v" id="st-engine">-</div></div>
      <div class="stat"><div class="k">站点总数</div><div class="v" id="st-sites">-</div></div>
      <div class="stat"><div class="k">热生效路由</div><div class="v" id="st-active">-</div></div>
      <div class="stat"><div class="k">可回滚快照</div><div class="v" id="st-snaps">-</div></div>
    </section>

    <section data-pane="sites" class="card">
      <h3>新增 / 更新反向代理站点</h3>
      <div class="form-grid">
        <label>绑定域名 <input id="s-domain" placeholder="如 app.example.com" /></label>
        <label>上游目标地址 <input id="s-upstream" placeholder="http://127.0.0.1:3000" /></label>
        <label>路径前缀 <input id="s-prefix" value="/" /></label>
        <label>TLS 模式
          <select id="s-tls">
            <option value="managed">自动托管 (关联 tls.certificates)</option>
            <option value="custom">指定证书 ID</option>
            <option value="off">仅 HTTP（内网/上游终止）</option>
          </select>
        </label>
        <label>证书 ID（可选） <input id="s-cert" placeholder="留空自动匹配域名证书" /></label>
        <label>单 IP 限速 RPS（0 关闭） <input id="s-rps" type="number" value="0" min="0" max="10000" /></label>
        <label>BasicAuth 用户名（可选） <input id="s-user" placeholder="留空不启用鉴权" /></label>
        <label>BasicAuth 密码（bcrypt 存储） <input id="s-pass" type="password" placeholder="留空保留原值" /></label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-save-site" type="button">保存站点并生成快照</button>
        <button class="btn ghost" id="btn-apply" type="button">立即热重载生效</button>
      </div>
      <table>
        <thead><tr><th>域名</th><th>上游</th><th>TLS / 特性</th><th>限速</th><th>操作</th></tr></thead>
        <tbody id="sites-tbody"></tbody>
      </table>
    </section>

    <section data-pane="preview" class="card" hidden>
      <h3>Caddyfile / Nginx 配置预览（严格防注入渲染）</h3>
      <div class="actions">
        <button class="btn" id="btn-load-preview" type="button">刷新预览</button>
        <button class="btn ghost" id="btn-apply-2" type="button">原子写入并热重载</button>
      </div>
      <h4 style="margin:14px 0 6px;font-size:13px">Caddyfile</h4>
      <pre id="pre-caddy">加载中…</pre>
      <h4 style="margin:14px 0 6px;font-size:13px">Nginx Server Block</h4>
      <pre id="pre-nginx">加载中…</pre>
    </section>

    <section data-pane="snapshots" class="card" hidden>
      <h3>配置快照历史（保留最近 20 个版本，一键无损回滚）</h3>
      <table>
        <thead><tr><th>版本号</th><th>变更原因</th><th>站点数</th><th>操作</th></tr></thead>
        <tbody id="snaps-tbody"></tbody>
      </table>
    </section>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const statusEl = document.getElementById('bridge-status');
      let port = null;
      let seq = 0;
      const pending = new Map();

      const setStatus = (t) => { statusEl.textContent = t; };
      const runAction = async (fn, okMsg) => {
        try {
          await fn();
          if (okMsg) setStatus(okMsg);
        } catch (err) {
          setStatus('操作失败：' + (err?.message || '未知错误'));
        }
      };
      const send = (msg) => { if (port) port.postMessage(msg); };
      const invoke = (operation, payload = {}) => new Promise((resolve, reject) => {
        if (!port) return reject(new Error('宿主桥尚未就绪'));
        const id = `ing_${++seq}`;
        pending.set(id, { resolve, reject });
        send({ t: 'api.invoke', id, operation, payload });
      });

      document.getElementById('nav-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-tab]');
        if (!btn) return;
        for (const b of document.querySelectorAll('#nav-tabs button')) b.classList.toggle('active', b === btn);
        for (const p of document.querySelectorAll('[data-pane]')) p.hidden = p.dataset.pane !== btn.dataset.tab;
        if (btn.dataset.tab === 'preview') void loadPreview();
      });

      async function loadPreview() {
        const res = await invoke('ingress.config.preview', {});
        document.getElementById('pre-caddy').textContent = res.caddyfile || '';
        document.getElementById('pre-nginx').textContent = res.nginx || '';
      }

      async function refresh() {
        try {
          const data = await invoke('ingress.overview', {});
          const sites = data.sites || [];
          const snaps = data.snapshots || [];
          document.getElementById('st-engine').textContent = data.backend?.active_engine || 'builtin-go';
          document.getElementById('st-sites').textContent = String(sites.length);
          document.getElementById('st-active').textContent = String(data.active_routes || 0);
          document.getElementById('st-snaps').textContent = String(snaps.length);

          const st = document.getElementById('sites-tbody');
          st.replaceChildren();
          for (const s of sites) {
            const tr = document.createElement('tr');
            const flags = [s.tls_mode, s.websocket ? 'WS' : '', s.has_basic_auth ? 'BasicAuth' : ''].filter(Boolean).join(' · ');
            for (const txt of [s.domain + (s.path_prefix !== '/' ? s.path_prefix : ''), s.upstream_url, flags, s.rate_limit_rps > 0 ? `${s.rate_limit_rps} rps` : '不限']) {
              const td = document.createElement('td'); td.textContent = txt; tr.appendChild(td);
            }
            const act = document.createElement('td');
            const pBtn = document.createElement('button'); pBtn.className = 'btn ghost'; pBtn.type = 'button'; pBtn.textContent = '探测上游';
            pBtn.addEventListener('click', () => void runAction(async () => {
              const r = await invoke('ingress.upstream.probe', { id: s.id });
              setStatus(r.reachable ? `${s.domain} 上游可达 (HTTP ${r.status_code}, ${r.latency_ms}ms)` : `${s.domain} 上游不可达: ${r.error}`);
            }));
            const dBtn = document.createElement('button'); dBtn.className = 'btn danger'; dBtn.type = 'button'; dBtn.textContent = '删除'; dBtn.style.marginLeft = '6px';
            dBtn.addEventListener('click', () => {
              if (!window.confirm(`确认删除反代站点「${s.domain}」？（变更前将自动保留回滚快照）`)) return;
              void runAction(async () => { await invoke('ingress.site.delete', { id: s.id }); await refresh(); }, `已删除站点 ${s.domain}`);
            });
            act.append(pBtn, dBtn);
            tr.appendChild(act);
            st.appendChild(tr);
          }

          const snt = document.getElementById('snaps-tbody');
          snt.replaceChildren();
          for (const sn of snaps) {
            const tr = document.createElement('tr');
            for (const txt of [`v${sn.revision}`, sn.reason, String(sn.site_count)]) {
              const td = document.createElement('td'); td.textContent = txt; tr.appendChild(td);
            }
            const act = document.createElement('td');
            const rBtn = document.createElement('button'); rBtn.className = 'btn ghost'; rBtn.type = 'button'; rBtn.textContent = '回滚至此版本';
            rBtn.addEventListener('click', () => {
              if (!window.confirm(`确认将反代配置回滚至快照 v${sn.revision} 并立即热重载？`)) return;
              void runAction(async () => { await invoke('ingress.rollback', { snapshot_id: sn.id }); await refresh(); }, `已回滚至快照 v${sn.revision}`);
            });
            act.appendChild(rBtn);
            tr.appendChild(act);
            snt.appendChild(tr);
          }
          setStatus('已连接');
        } catch (err) {
          setStatus('加载失败：' + (err.message || '未知错误'));
        }
      }

      document.getElementById('btn-save-site').addEventListener('click', () => void runAction(async () => {
        await invoke('ingress.site.upsert', {
          domain: document.getElementById('s-domain').value.trim(),
          upstream_url: document.getElementById('s-upstream').value.trim(),
          path_prefix: document.getElementById('s-prefix').value.trim() || '/',
          tls_mode: document.getElementById('s-tls').value,
          cert_id: document.getElementById('s-cert').value.trim(),
          rate_limit_rps: Number(document.getElementById('s-rps').value || 0),
          basic_auth_user: document.getElementById('s-user').value.trim(),
          basic_auth_pass: document.getElementById('s-pass').value,
          websocket: true,
          enabled: true,
        });
        document.getElementById('s-pass').value = '';
        await refresh();
      }, '站点已保存并生成新快照'));

      const doApply = () => void runAction(async () => {
        const res = await invoke('ingress.apply', {});
        await refresh();
        setStatus(`已热重载：生效路由 ${res.active_routes} 条 (${res.engine})`);
      });
      document.getElementById('btn-apply').addEventListener('click', doApply);
      document.getElementById('btn-apply-2').addEventListener('click', doApply);
      document.getElementById('btn-load-preview').addEventListener('click', () => void runAction(loadPreview, '配置预览已刷新'));

      function accept(data) {
        if (!data || typeof data !== 'object') return;
        if (data.t === 'api.result' && pending.has(data.id)) {
          const p = pending.get(data.id); pending.delete(data.id);
          if (data.ok) p.resolve(data.payload); else p.reject(new Error(data.error?.detail || data.error?.code || 'invoke failed'));
        } else if (data.t === 'ui.settings' && (data.theme === 'light' || data.theme === 'dark')) {
          root.dataset.theme = data.theme;
        }
      }

      new ResizeObserver(() => {
        send({ t: 'ui.resize', height: Math.ceil(document.getElementById('ingress-root').getBoundingClientRect().height) + 24 });
      }).observe(document.getElementById('ingress-root'));

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || event.data?.t !== 'plugin.port' || !event.ports[0] || port) return;
        port = event.ports[0];
        port.onmessage = (m) => accept(m.data);
        send({ t: 'ui.ready' });
        void refresh();
      });

      window.parent.postMessage({ t: 'plugin.hello', kit_major: 1 }, '*');
    })();
  </script>
</body>
</html>
