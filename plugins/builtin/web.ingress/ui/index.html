<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>轻量反向代理与站点托管</title>
  <link rel="stylesheet" href="./plugin.css" />
</head>
<body>
  <main id="ingress-root">
    <div class="topbar">
      <div>
        <h2 class="title">轻量反向代理与站点托管</h2>
        <div class="sub">零依赖内置 Go 反代（支持多路径、SNI TLS 热重载、防重绑定 SSRF）+ Caddy/Nginx 渲染 · <span id="bridge-status">连接中…</span></div>
      </div>
      <div class="tabs" id="nav-tabs">
        <button data-tab="sites" class="active" type="button">反代站点</button>
        <button data-tab="preview" type="button">配置预览与热重载</button>
        <button data-tab="snapshots" type="button">快照回滚</button>
      </div>
    </div>

    <section class="stats">
      <div class="stat"><div class="k">活动引擎</div><div class="v" id="st-engine">-</div></div>
      <div class="stat"><div class="k">站点总数</div><div class="v" id="st-sites">-</div></div>
      <div class="stat"><div class="k">热生效路由</div><div class="v" id="st-active">-</div></div>
      <div class="stat"><div class="k">可回滚快照</div><div class="v" id="st-snaps">-</div></div>
    </section>

    <section data-pane="sites" class="card">
      <h3 id="site-form-title">新增 / 更新反向代理站点</h3>
      <div class="form-grid">
        <label>绑定域名 <input id="s-domain" placeholder="如 app.example.com" /></label>
        <label>上游目标地址 <input id="s-upstream" placeholder="http://127.0.0.1:3000" /></label>
        <label>路径前缀 <input id="s-prefix" value="/" placeholder="如 / 或 /api" /></label>
        <label>TLS 模式
          <select id="s-tls">
            <option value="managed">自动托管 (关联 tls.certificates)</option>
            <option value="custom">指定证书绑定 ID</option>
            <option value="off">仅 HTTP（内网/上游终止）</option>
          </select>
        </label>
        <label>证书绑定 ID（可选） <input id="s-cert" placeholder="如 certbind_xxx，留空自动匹配" /></label>
        <label>单 IP 限速 RPS（0 关闭） <input id="s-rps" type="number" value="0" min="0" max="10000" /></label>
        <label>BasicAuth 用户名（可选） <input id="s-user" placeholder="留空不启用鉴权" /></label>
        <label>BasicAuth 密码（bcrypt 存储） <input id="s-pass" type="password" placeholder="留空保留原值" /></label>
      </div>
      <div class="check-row">
        <label class="check-label"><input id="s-enabled" type="checkbox" checked /> 启用该站点</label>
        <label class="check-label"><input id="s-ws" type="checkbox" checked /> 支持 WebSocket</label>
        <label class="check-label"><input id="s-force-https" type="checkbox" checked /> 强制 HTTPS（HSTS / 308 跳转）</label>
        <label class="check-label"><input id="s-clear-auth" type="checkbox" /> 清除 BasicAuth 密码保护</label>
      </div>
      <div class="actions">
        <button class="btn" id="btn-save-site" type="button">保存站点并立即同步生效</button>
        <button class="btn ghost" id="btn-cancel-edit" type="button" hidden>取消编辑</button>
        <button class="btn ghost" id="btn-apply" type="button">强制热重载并渲染配置</button>
      </div>
      <table>
        <thead><tr><th>域名与路径</th><th>上游</th><th>TLS / 特性</th><th>限速</th><th>操作</th></tr></thead>
        <tbody id="sites-tbody"></tbody>
      </table>
    </section>

    <section data-pane="preview" class="card" hidden>
      <h3>Caddyfile / Nginx 配置预览（严格防注入渲染）</h3>
      <div class="actions">
        <button class="btn" id="btn-load-preview" type="button">刷新预览</button>
        <button class="btn ghost" id="btn-apply-2" type="button">原子写入并热重载</button>
        <button class="btn ghost" id="btn-copy-caddy" type="button">复制 Caddyfile</button>
        <button class="btn ghost" id="btn-copy-nginx" type="button">复制 Nginx 配置</button>
      </div>
      <h4 class="section-subhead">Caddyfile</h4>
      <pre id="pre-caddy">加载中…</pre>
      <h4 class="section-subhead">Nginx Server Block</h4>
      <pre id="pre-nginx">加载中…</pre>
    </section>

    <section data-pane="snapshots" class="card" hidden>
      <h3>配置快照历史（保留最近 20 个版本，一键无损回滚）</h3>
      <table>
        <thead><tr><th>版本号</th><th>变更原因</th><th>站点数</th><th>操作</th></tr></thead>
        <tbody id="snaps-tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="./plugin.js"></script>
</body>
</html>
